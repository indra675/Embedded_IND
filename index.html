 34 + 90 = 124 bit times = 6.46 ms nominal, 9.0 ms maximum. The schedule slot must be at least that long.</li></ul><h3>Versions</h3><div class="tw"><table><tr><th>Version</th><th>Year</th><th>Notes</th></tr><tr><td>LIN 1.3</td><td>2002</td><td>Classic checksum</td></tr><tr><td>LIN 2.0</td><td>2003</td><td>Enhanced checksum, diagnostics, event-triggered frames</td></tr><tr><td>LIN 2.1</td><td>2006</td><td>Clarifications and configuration</td></tr><tr><td>LIN 2.2A / ISO 17987</td><td>2010 onward</td><td>Current form; SAE J2602 is the US variant</td></tr></table></div><h3>Network management</h3><ul><li><strong>Sleep:</strong> the master sends the go-to-sleep command (diagnostic frame 0x3C with first byte 0x00) or slaves sleep after 4 to 10 s of inactivity.</li><li><strong>Wake-up:</strong> any node pulls the bus dominant for 250 us to 5 ms.</li><li>The network is described in an LDF (LIN description file) listing nodes, signals, frames and the schedule table.</li><li>Master node = master task (schedule) + slave task (its own responses).</li><li>Transceivers such as TJA1020 and MCP2003 connect a UART to the 12 V line.</li></ul><h3>Common problems</h3><ul><li>Slave and master baud rates differ by more than 14 percent after the sync byte.</li><li>Missing 1 kOhm pull-up on the master node.</li><li>Confusing classic and enhanced checksum.</li></ul><p><strong>Interview:</strong> LIN vs CAN? LIN is single-wire, single-master, up to 20 kbit/s and very cheap; CAN is differential, multi-master and faster, used for the important systems.</p><h1 id="part-b">Part B: Network and wireless</h1><h2 id="wifi">7. Wi-Fi (IEEE 802.11)</h2><p>Wi-Fi is a wireless LAN. Devices (stations) join an <strong>access point</strong> that bridges them to Ethernet and the internet. Because radios cannot listen while transmitting, Wi-Fi uses <strong>CSMA/CA</strong> (collision avoidance), not collision detection.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Bands</td><td>2.4 GHz (channels 1 to 13; 1, 6, 11 do not overlap), 5 GHz, 6 GHz (Wi-Fi 6E/7)</td></tr><tr><td>Standards</td><td>802.11b 11 Mbit/s, g 54, n up to 600 (Wi-Fi 4), ac (Wi-Fi 5) several Gbit/s, ax (Wi-Fi 6) up to 9.6 Gbit/s</td></tr><tr><td>Topology</td><td>Infrastructure (star around AP), ad hoc, mesh</td></tr><tr><td>Range</td><td>about 30 to 100 m indoors</td></tr><tr><td>Security</td><td>WPA2-PSK (AES-CCMP), WPA3 (SAE)</td></tr><tr><td>Used for</td><td>ESP32/ESP8266 IoT, cameras, anything needing bandwidth or direct IP access</td></tr></table></div><h3>How it works</h3><ul><li><strong>Joining:</strong> scan (passive beacons or active probe), authentication (open system), association, then the WPA2 4-way handshake derives the session keys, then DHCP gives an IP address.</li><li><strong>CSMA/CA:</strong> sense the medium; if idle for DIFS (34 us at 5 GHz), pick a random backoff of 0 to CW slots (9 us each) and count down only while idle. Transmit; the receiver replies with an ACK after SIFS (16 us). No ACK = retry with a doubled CW.</li><li>Frame types: <strong>management</strong> (beacon, probe, auth, assoc), <strong>control</strong> (RTS, CTS, ACK) and <strong>data</strong>. The MAC header has up to four 6-byte addresses and ends with a 4-byte FCS.</li><li>Power save: stations sleep and wake for the beacon that lists buffered frames (DTIM). ESP32 uses this for modem-sleep.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 700 94" role="img" aria-label="CSMA/CA timing" style="min-width:700px;max-width:700px"><rect class="wband" x="272" y="20" width="156" height="64"/><text class="wl wh" x="350.0" y="13.0" text-anchor="middle">we wait, then count down</text><rect class="wband" x="428" y="20" width="234" height="64"/><text class="wl wh" x="545.0" y="13.0" text-anchor="middle">we win the medium</text><text class="wt" x="4.0" y="61.0" text-anchor="start">Medium</text><path class="wv " d="M64 44 L90 44 L116 44 L142 44 L168 44 L194 44 L194 44 L194 70 L220 70 L220 70 L220 44 L246 44 L272 44 L272 44 L272 70 L298 70 L324 70 L350 70 L376 70 L402 70 L428 70 L428 70 L428 44 L454 44 L480 44 L506 44 L532 44 L558 44 L584 44 L584 44 L584 70 L610 70 L610 70 L610 44 L636 44 L662 44 L662 44 L662 70 L688 70"/><text class="wl" x="129.0" y="39.0" text-anchor="middle">STA-B DATA</text><text class="wl" x="207.0" y="39.0" text-anchor="middle">S</text><text class="wl" x="246.0" y="39.0" text-anchor="middle">ACK</text><text class="wl" x="298.0" y="39.0" text-anchor="middle">DIFS</text><text class="wl" x="376.0" y="39.0" text-anchor="middle">backoff</text><text class="wl" x="506.0" y="39.0" text-anchor="middle">our DATA</text><text class="wl" x="597.0" y="39.0" text-anchor="middle">S</text><text class="wl" x="636.0" y="39.0" text-anchor="middle">ACK</text></svg></div><figcaption>Station waits for the medium to be idle for DIFS, counts down a random backoff and sends. SIFS (S) is shorter than DIFS so the ACK always wins.</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 450 368" role="img" aria-label="Wi-Fi connection sequence" style="min-width:450px;max-width:450px"><rect class="wb" x="40" y="6" width="120" height="26" rx="6"/><text class="wf1" x="100.0" y="23.0" text-anchor="middle">Station</text><line class="wlife" x1="100" x2="100" y1="32" y2="362"/><rect class="wb" x="290" y="6" width="120" height="26" rx="6"/><text class="wf1" x="350.0" y="23.0" text-anchor="middle">Access point</text><line class="wlife" x1="350" x2="350" y1="32" y2="362"/><line class="wa" x1="100" x2="350" y1="66" y2="66"/><polygon class="wah" points="350,66 341,61.5 341,70.5"/><text class="wf1" x="225.0" y="60.0" text-anchor="middle">Probe Request</text><text class="wf2" x="225.0" y="79.0" text-anchor="middle">or listen for Beacon (every ~102 ms)</text><line class="wa r" x1="350" x2="100" y1="104" y2="104"/><polygon class="wah r" points="100,104 109,99.5 109,108.5"/><text class="wf1" x="225.0" y="98.0" text-anchor="middle">Probe Response</text><text class="wf2" x="225.0" y="117.0" text-anchor="middle">SSID, rates, security</text><line class="wa" x1="100" x2="350" y1="142" y2="142"/><polygon class="wah" points="350,142 341,137.5 341,146.5"/><text class="wf1" x="225.0" y="136.0" text-anchor="middle">Authentication</text><text class="wf2" x="225.0" y="155.0" text-anchor="middle">open system</text><line class="wa r" x1="350" x2="100" y1="180" y2="180"/><polygon class="wah r" points="100,180 109,175.5 109,184.5"/><text class="wf1" x="225.0" y="174.0" text-anchor="middle">Authentication</text><text class="wf2" x="225.0" y="193.0" text-anchor="middle">success</text><line class="wa" x1="100" x2="350" y1="218" y2="218"/><polygon class="wah" points="350,218 341,213.5 341,222.5"/><text class="wf1" x="225.0" y="212.0" text-anchor="middle">Association Request</text><line class="wa r" x1="350" x2="100" y1="256" y2="256"/><polygon class="wah r" points="100,256 109,251.5 109,260.5"/><text class="wf1" x="225.0" y="250.0" text-anchor="middle">Association Response</text><text class="wf2" x="225.0" y="269.0" text-anchor="middle">AID assigned</text><rect class="wb b" x="73.4" y="278" width="303.2" height="24" rx="12"/><text class="wf1" x="225.0" y="294.0" text-anchor="middle">WPA2: 4-way handshake (EAPOL 1 to 4) -&gt; keys</text><rect class="wb b" x="67.1" y="316" width="315.8" height="24" rx="12"/><text class="wf1" x="225.0" y="332.0" text-anchor="middle">DHCP -&gt; IP address, then encrypted data frames</text></svg></div><figcaption>Typical association sequence of a station with an access point.</figcaption></figure><h3>Wi-Fi versions</h3><div class="tw"><table><tr><th>Standard (Wi-Fi name)</th><th>Year</th><th>Band</th><th>Max rate (theory)</th><th>Key technology</th></tr><tr><td>802.11 (legacy)</td><td>1997</td><td>2.4 GHz</td><td>2 Mbit/s</td><td>DSSS or FHSS</td></tr><tr><td>802.11b</td><td>1999</td><td>2.4 GHz</td><td>11 Mbit/s</td><td>DSSS / CCK</td></tr><tr><td>802.11a</td><td>1999</td><td>5 GHz</td><td>54 Mbit/s</td><td>OFDM</td></tr><tr><td>802.11g</td><td>2003</td><td>2.4 GHz</td><td>54 Mbit/s</td><td>OFDM, b-compatible</td></tr><tr><td>802.11n (Wi-Fi 4)</td><td>2009</td><td>2.4 and 5 GHz</td><td>600 Mbit/s</td><td>MIMO up to 4 streams, 40 MHz channels, frame aggregation</td></tr><tr><td>802.11ac (Wi-Fi 5)</td><td>2013</td><td>5 GHz</td><td>about 6.9 Gbit/s</td><td>256-QAM, 160 MHz, downlink MU-MIMO</td></tr><tr><td>802.11ax (Wi-Fi 6, 6E)</td><td>2019 (6E: 2020)</td><td>2.4, 5 and (6E) 6 GHz</td><td>9.6 Gbit/s</td><td>OFDMA, 1024-QAM, uplink MU-MIMO, Target Wake Time, BSS colouring</td></tr><tr><td>802.11be (Wi-Fi 7)</td><td>2024</td><td>2.4, 5, 6 GHz</td><td>about 46 Gbit/s</td><td>320 MHz channels, 4096-QAM, Multi-Link Operation</td></tr><tr><td>802.11ah (HaLow)</td><td>2017</td><td>sub-GHz (900 MHz)</td><td>a few Mbit/s</td><td>Long range, very low power IoT</td></tr><tr><td>802.11bn (Wi-Fi 8)</td><td>in development</td><td></td><td></td><td>Reliability and latency focus</td></tr></table></div><p>Real throughput is typically 50 to 60 percent of the headline rate because of overhead and shared air time.</p><h3>Security versions</h3><div class="tw"><table><tr><th>Name</th><th>Cipher / method</th><th>Status</th></tr><tr><td>WEP</td><td>RC4, weak IV</td><td>Broken, never use</td></tr><tr><td>WPA</td><td>TKIP (RC4)</td><td>Obsolete</td></tr><tr><td>WPA2</td><td>AES-CCMP, PSK or 802.1X</td><td>Still common</td></tr><tr><td>WPA3</td><td>SAE (Dragonfly) handshake, protected management frames, 192-bit mode for enterprise</td><td>Current, mandatory for Wi-Fi 6 certified devices</td></tr></table></div><h3>Channels</h3><ul><li><strong>2.4 GHz:</strong> centre frequency = 2407 + 5 x channel MHz (channel 1 = 2412 MHz). A 20 MHz channel is wider than the 5 MHz spacing, so use channels <strong>1, 6, 11</strong> only. 13 channels in Europe, 11 in the US.</li><li><strong>5 GHz:</strong> many non-overlapping 20 MHz channels, with 40, 80 and 160 MHz bonding. Some channels require radar detection (DFS).</li><li><strong>6 GHz:</strong> up to 1200 MHz of new spectrum in the US (59 channels of 20 MHz), no legacy devices.</li><li><strong>Signal strength (RSSI):</strong> -30 dBm excellent, -67 dBm good for video, -70 dBm fair, -80 dBm poor, -90 dBm unusable.</li></ul><h3>MAC frame format</h3><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 779 82" role="img" aria-label="Wi-Fi MAC frame" style="min-width:779px;max-width:779px"><text class="wl" x="8.0" y="14.0" text-anchor="start">IEEE 802.11 data frame (not to scale)</text><rect class="wb " x="8" y="20" width="87.2" height="48" rx="4"/><text class="wf1" x="51.6" y="43.0" text-anchor="middle">Frame ctrl</text><text class="wf2" x="51.6" y="56.0" text-anchor="middle">2 B</text><rect class="wb " x="99.2" y="20" width="72.8" height="48" rx="4"/><text class="wf1" x="135.6" y="43.0" text-anchor="middle">Duration</text><text class="wf2" x="135.6" y="56.0" text-anchor="middle">2 B</text><rect class="wb b" x="176" y="20" width="106.4" height="48" rx="4"/><text class="wf1" x="229.2" y="43.0" text-anchor="middle">Addr 1</text><text class="wf2" x="229.2" y="56.0" text-anchor="middle">receiver 6 B</text><rect class="wb b" x="286.4" y="20" width="106.4" height="48" rx="4"/><text class="wf1" x="339.6" y="43.0" text-anchor="middle">Addr 2</text><text class="wf2" x="339.6" y="56.0" text-anchor="middle">transmitter 6 B</text><rect class="wb b" x="396.8" y="20" width="72.8" height="48" rx="4"/><text class="wf1" x="433.2" y="43.0" text-anchor="middle">Addr 3</text><text class="wf2" x="433.2" y="56.0" text-anchor="middle">6 B</text><rect class="wb " x="473.6" y="20" width="53.6" height="48" rx="4"/><text class="wf1" x="500.4" y="43.0" text-anchor="middle">Seq</text><text class="wf2" x="500.4" y="56.0" text-anchor="middle">2 B</text><rect class="wb g" x="531.2" y="20" width="72.8" height="48" rx="4"/><text class="wf1" x="567.6" y="43.0" text-anchor="middle">Addr 4</text><text class="wf2" x="567.6" y="56.0" text-anchor="middle">optional</text><rect class="wb " x="608" y="20" width="101.6" height="48" rx="4"/><text class="wf1" x="658.8" y="43.0" text-anchor="middle">Body</text><text class="wf2" x="658.8" y="56.0" text-anchor="middle">0 to 2304 B</text><rect class="wb " x="713.6" y="20" width="53.6" height="48" rx="4"/><text class="wf1" x="740.4" y="43.0" text-anchor="middle">FCS</text><text class="wf2" x="740.4" y="56.0" text-anchor="middle">4 B</text></svg></div><figcaption>Addr 1 to 3 hold receiver, transmitter and BSSID or source/destination depending on the To DS / From DS bits in the frame control field.</figcaption></figure><h3>Modes and low power</h3><ul><li><strong>Station (STA)</strong> joins an AP; <strong>SoftAP</strong> makes the device an AP; ESP32 supports STA + AP together. <strong>Wi-Fi Direct</strong> links two devices without an AP.</li><li>Power save: <strong>DTIM</strong> beacons tell sleeping stations that data is waiting. ESP32 modem-sleep turns the radio off between beacons; light-sleep also pauses the CPU. <strong>Target Wake Time</strong> (Wi-Fi 6) schedules each device individually.</li><li>ESP8266 and most ESP32 chips: 802.11 b/g/n on 2.4 GHz only. ESP32-C6 adds Wi-Fi 6 (2.4 GHz); ESP32-C5 adds dual-band Wi-Fi 6.</li></ul><pre><code>#include &lt;WiFi.h&gt;
void setup() {
  Serial.begin(115200);
  WiFi.mode(WIFI_STA);
  WiFi.begin(&quot;MySSID&quot;, &quot;MyPassword&quot;);
  while (WiFi.status() != WL_CONNECTED) { delay(500); Serial.print(&#x27;.&#x27;); }
  Serial.println(WiFi.localIP());
  Serial.println(WiFi.RSSI());          // signal strength in dBm
}
void loop() {}</code></pre><h3>Common problems</h3><ul><li>Wrong password: stuck in the 4-way handshake.</li><li>Crowded 2.4 GHz channels; hidden-node problem (use RTS/CTS).</li><li>ESP32 original is 2.4 GHz only; it cannot see a 5 GHz-only SSID.</li></ul><p><strong>Interview:</strong> Why not CSMA/CD like Ethernet? A radio cannot hear collisions while it transmits, so Wi-Fi avoids them with random backoff and uses ACKs to detect losses.</p><h2 id="tcpip">8. TCP/IP (the Internet Stack)</h2><p>TCP/IP is a stack of four layers. Each layer wraps the data of the layer above with its own header (<strong>encapsulation</strong>). TCP gives a reliable ordered byte stream; UDP gives fast, unreliable datagrams.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Layers</td><td>Application (HTTP, MQTT, DNS) / Transport (TCP, UDP) / Internet (IP, ICMP) / Link (Ethernet, Wi-Fi)</td></tr><tr><td>Addressing</td><td>MAC (link), IP address (32-bit IPv4, 128-bit IPv6), port (16-bit)</td></tr><tr><td>Well-known ports</td><td>HTTP 80, HTTPS 443, DNS 53, MQTT 1883 / 8883, CoAP 5683 (UDP), Modbus 502</td></tr><tr><td>MTU</td><td>1500 bytes on Ethernet, so a TCP segment carries up to 1460 bytes</td></tr><tr><td>TCP header</td><td>20 bytes: ports, sequence, acknowledgment, flags (SYN ACK FIN RST PSH), window, checksum</td></tr><tr><td>UDP header</td><td>8 bytes: ports, length, checksum</td></tr></table></div><h3>How it works</h3><ul><li><strong>Three-way handshake</strong> opens a connection (SYN, SYN+ACK, ACK); a four-step FIN exchange closes it.</li><li><strong>Reliability:</strong> every byte has a sequence number; the receiver ACKs the next byte it expects; unacknowledged data is retransmitted after a timeout. The <strong>window</strong> field does flow control; slow start and congestion avoidance limit the sending rate.</li><li><strong>UDP</strong> has no connection, no retransmission and no ordering. It suits DNS, streaming and CoAP, where speed or low overhead matters more.</li><li>On microcontrollers the stack is usually <strong>lwIP</strong> (ESP32, STM32) with a socket API: <code>socket</code>, <code>connect</code>, <code>send</code>, <code>recv</code>, <code>close</code>.</li><li>IP does routing hop by hop with a TTL; ICMP carries <code>ping</code> and error messages. DHCP assigns addresses; DNS turns names into IPs.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 450 444" role="img" aria-label="TCP handshake, data and close" style="min-width:450px;max-width:450px"><rect class="wb" x="40" y="6" width="120" height="26" rx="6"/><text class="wf1" x="100.0" y="23.0" text-anchor="middle">Client</text><line class="wlife" x1="100" x2="100" y1="32" y2="438"/><rect class="wb" x="290" y="6" width="120" height="26" rx="6"/><text class="wf1" x="350.0" y="23.0" text-anchor="middle">Server</text><line class="wlife" x1="350" x2="350" y1="32" y2="438"/><line class="wa" x1="100" x2="350" y1="66" y2="66"/><polygon class="wah" points="350,66 341,61.5 341,70.5"/><text class="wf1" x="225.0" y="60.0" text-anchor="middle">SYN</text><text class="wf2" x="225.0" y="79.0" text-anchor="middle">seq = x</text><line class="wa r" x1="350" x2="100" y1="104" y2="104"/><polygon class="wah r" points="100,104 109,99.5 109,108.5"/><text class="wf1" x="225.0" y="98.0" text-anchor="middle">SYN + ACK</text><text class="wf2" x="225.0" y="117.0" text-anchor="middle">seq = y, ack = x + 1</text><line class="wa" x1="100" x2="350" y1="142" y2="142"/><polygon class="wah" points="350,142 341,137.5 341,146.5"/><text class="wf1" x="225.0" y="136.0" text-anchor="middle">ACK</text><text class="wf2" x="225.0" y="155.0" text-anchor="middle">ack = y + 1</text><rect class="wb b" x="85" y="164" width="280" height="24" rx="12"/><text class="wf1" x="225.0" y="180.0" text-anchor="middle">ESTABLISHED</text><line class="wa" x1="100" x2="350" y1="218" y2="218"/><polygon class="wah" points="350,218 341,213.5 341,222.5"/><text class="wf1" x="225.0" y="212.0" text-anchor="middle">DATA (100 bytes)</text><text class="wf2" x="225.0" y="231.0" text-anchor="middle">seq = x + 1</text><line class="wa r" x1="350" x2="100" y1="256" y2="256"/><polygon class="wah r" points="100,256 109,251.5 109,260.5"/><text class="wf1" x="225.0" y="250.0" text-anchor="middle">ACK</text><text class="wf2" x="225.0" y="269.0" text-anchor="middle">ack = x + 101</text><line class="wa" x1="100" x2="350" y1="294" y2="294"/><polygon class="wah" points="350,294 341,289.5 341,298.5"/><text class="wf1" x="225.0" y="288.0" text-anchor="middle">FIN</text><line class="wa r" x1="350" x2="100" y1="332" y2="332"/><polygon class="wah r" points="100,332 109,327.5 109,336.5"/><text class="wf1" x="225.0" y="326.0" text-anchor="middle">ACK</text><line class="wa r" x1="350" x2="100" y1="370" y2="370"/><polygon class="wah r" points="100,370 109,365.5 109,374.5"/><text class="wf1" x="225.0" y="364.0" text-anchor="middle">FIN</text><line class="wa" x1="100" x2="350" y1="408" y2="408"/><polygon class="wah" points="350,408 341,403.5 341,412.5"/><text class="wf1" x="225.0" y="402.0" text-anchor="middle">ACK</text><text class="wf2" x="225.0" y="421.0" text-anchor="middle">then TIME_WAIT</text></svg></div><figcaption>Connection setup, one data exchange and the four-step close.</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 640 80" role="img" aria-label="Encapsulation" style="min-width:640px;max-width:640px"><text class="wl" x="8.0" y="14.0" text-anchor="start">One TCP segment inside an Ethernet frame (IPv4)</text><rect class="wb g" x="8" y="20" width="120.8" height="46" rx="4"/><text class="wf1" x="68.4" y="42.0" text-anchor="middle">Ethernet</text><text class="wf2" x="68.4" y="55.0" text-anchor="middle">14 B</text><rect class="wb " x="132.8" y="20" width="120.8" height="46" rx="4"/><text class="wf1" x="193.2" y="42.0" text-anchor="middle">IP header</text><text class="wf2" x="193.2" y="55.0" text-anchor="middle">20 B</text><rect class="wb b" x="257.6" y="20" width="120.8" height="46" rx="4"/><text class="wf1" x="318.0" y="42.0" text-anchor="middle">TCP header</text><text class="wf2" x="318.0" y="55.0" text-anchor="middle">20 B</text><rect class="wb " x="382.4" y="20" width="172.8" height="46" rx="4"/><text class="wf1" x="468.8" y="42.0" text-anchor="middle">Payload</text><text class="wf2" x="468.8" y="55.0" text-anchor="middle">application data</text><rect class="wb g" x="559.2" y="20" width="68.8" height="46" rx="4"/><text class="wf1" x="593.6" y="42.0" text-anchor="middle">FCS</text><text class="wf2" x="593.6" y="55.0" text-anchor="middle">4 B</text></svg></div><figcaption>Headers added on the way down the stack; the FCS is the Ethernet check at the end of the frame.</figcaption></figure><h3>TCP header in detail</h3><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 452 290" role="img" aria-label="TCP header" style="min-width:452px;max-width:452px"><text class="wl" x="8.0" y="14.0" text-anchor="start">Each row is 32 bits; the minimum header is 20 bytes</text><rect class="wb " x="8" y="20" width="186.4" height="40" rx="4"/><text class="wf1" x="101.2" y="39.0" text-anchor="middle">Source port</text><text class="wf2" x="101.2" y="52.0" text-anchor="middle">16 bits</text><rect class="wb " x="198.4" y="20" width="186.4" height="40" rx="4"/><text class="wf1" x="291.6" y="39.0" text-anchor="middle">Destination port</text><text class="wf2" x="291.6" y="52.0" text-anchor="middle">16 bits</text><rect class="wb b" x="8" y="74" width="376.8" height="40" rx="4"/><text class="wf1" x="196.4" y="93.0" text-anchor="middle">Sequence number</text><text class="wf2" x="196.4" y="106.0" text-anchor="middle">32 bits</text><rect class="wb b" x="8" y="128" width="376.8" height="40" rx="4"/><text class="wf1" x="196.4" y="147.0" text-anchor="middle">Acknowledgment number</text><text class="wf2" x="196.4" y="160.0" text-anchor="middle">32 bits</text><rect class="wb " x="8" y="182" width="63.2" height="40" rx="4"/><text class="wf1" x="39.6" y="201.0" text-anchor="middle">Offset</text><text class="wf2" x="39.6" y="214.0" text-anchor="middle">4</text><rect class="wb " x="75.2" y="182" width="52" height="40" rx="4"/><text class="wf1" x="101.2" y="201.0" text-anchor="middle">Rsvd</text><text class="wf2" x="101.2" y="214.0" text-anchor="middle">3</text><rect class="wb b" x="131.2" y="182" width="208.8" height="40" rx="4"/><text class="wf1" x="235.6" y="201.0" text-anchor="middle">Flags</text><text class="wf2" x="235.6" y="214.0" text-anchor="middle">NS CWR ECE URG ACK PSH RST SYN FIN</text><rect class="wb " x="344" y="182" width="96.8" height="40" rx="4"/><text class="wf1" x="392.4" y="201.0" text-anchor="middle">Window</text><text class="wf2" x="392.4" y="214.0" text-anchor="middle">16 bits</text><rect class="wb " x="8" y="236" width="186.4" height="40" rx="4"/><text class="wf1" x="101.2" y="255.0" text-anchor="middle">Checksum</text><text class="wf2" x="101.2" y="268.0" text-anchor="middle">16 bits</text><rect class="wb " x="198.4" y="236" width="186.4" height="40" rx="4"/><text class="wf1" x="291.6" y="255.0" text-anchor="middle">Urgent pointer</text><text class="wf2" x="291.6" y="268.0" text-anchor="middle">16 bits</text></svg></div><figcaption>Options (such as MSS, window scale, timestamps) follow the header when Offset is larger than 5.</figcaption></figure><h3>IPv4 header and addresses</h3><ul><li>Fields: version (4), header length, DSCP/ECN, total length, identification, flags and fragment offset, <strong>TTL</strong>, <strong>protocol</strong> (6 = TCP, 17 = UDP, 1 = ICMP), header checksum, source and destination address.</li><li>Private ranges: <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>. Example: 192.168.1.10/24 has mask 255.255.255.0, network 192.168.1.0, broadcast 192.168.1.255 and 254 usable hosts.</li><li>NAT lets many private devices share one public address by rewriting ports, which is why incoming connections need port forwarding.</li></ul><div class="tw"><table><tr><th></th><th>IPv4</th><th>IPv6</th></tr><tr><td>Address size</td><td>32 bits</td><td>128 bits</td></tr><tr><td>Notation</td><td>192.168.1.10</td><td>2001:db8::1</td></tr><tr><td>Header</td><td>20+ bytes, checksum, fragmentation by routers</td><td>40 bytes fixed, no checksum, fragmentation by sender only</td></tr><tr><td>Configuration</td><td>DHCP</td><td>SLAAC or DHCPv6</td></tr><tr><td>Broadcast</td><td>yes</td><td>no (multicast)</td></tr></table></div><h3>TCP states and congestion control</h3><ul><li>Client path: CLOSED, SYN_SENT, ESTABLISHED, FIN_WAIT_1, FIN_WAIT_2, TIME_WAIT (waits 2 x MSL, about 1 to 4 minutes), CLOSED. Server path: LISTEN, SYN_RCVD, ESTABLISHED, CLOSE_WAIT, LAST_ACK, CLOSED.</li><li><strong>Slow start:</strong> the congestion window cwnd starts small and doubles every round trip until it reaches ssthresh; then <strong>congestion avoidance</strong> adds about one segment per round trip. A timeout resets cwnd; three duplicate ACKs trigger fast retransmit.</li><li>The retransmission timeout (RTO) is based on the measured round-trip time. Nagle and delayed ACK can add 40 to 200 ms delays to small writes; disable Nagle with <code>TCP_NODELAY</code> for latency-sensitive data.</li></ul><h3>Helper protocols</h3><div class="tw"><table><tr><th>Protocol</th><th>Job</th></tr><tr><td>ARP</td><td>Finds the MAC address of an IPv4 neighbour</td></tr><tr><td>DHCP</td><td>Discover, Offer, Request, Acknowledge gives address, mask, gateway, DNS</td></tr><tr><td>DNS</td><td>Name to IP (UDP port 53, TCP for large answers)</td></tr><tr><td>ICMP</td><td>ping (echo) and error messages such as "destination unreachable"</td></tr><tr><td>NTP</td><td>Clock sync, needed for TLS certificate checks</td></tr></table></div><h3>Socket client on a microcontroller (lwIP / BSD sockets)</h3><pre><code>int s = socket(AF_INET, SOCK_STREAM, 0);
struct sockaddr_in a = {0};
a.sin_family = AF_INET;
a.sin_port   = htons(80);
inet_pton(AF_INET, &quot;192.168.1.50&quot;, &amp;a.sin_addr);
if (connect(s, (struct sockaddr *)&amp;a, sizeof a) == 0) {
    const char *req = &quot;GET / HTTP/1.1\r\nHost: 192.168.1.50\r\n\r\n&quot;;
    send(s, req, strlen(req), 0);
    char buf[256];
    int n = recv(s, buf, sizeof buf - 1, 0);   /* may return fewer bytes */
}
close(s);</code></pre><h3>Common problems</h3><ul><li>Firewall or NAT blocks incoming connections.</li><li>Many small writes cause delays (Nagle and delayed ACK interplay).</li><li>A half-open connection after a power loss; use keep-alive or application timeouts.</li></ul><p><strong>Interview:</strong> TCP vs UDP? TCP is connection-oriented, reliable and ordered with flow and congestion control; UDP is connectionless and best effort, with less latency and overhead.</p><h2 id="http">9. HTTP / HTTPS</h2><p>HTTP is the request/response protocol of the web and of most REST APIs. The client always asks first and the server answers once; it is <strong>stateless</strong> and runs on top of TCP (port 80), or TLS on port 443 for HTTPS.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Model</td><td>Client sends a request, server returns a response</td></tr><tr><td>Methods</td><td>GET read, POST create, PUT replace, PATCH change, DELETE remove, HEAD headers only</td></tr><tr><td>Status classes</td><td>1xx info, 2xx success (200, 201, 204), 3xx redirect (301, 304), 4xx client error (400, 401, 403, 404, 429), 5xx server error (500, 503)</td></tr><tr><td>Versions</td><td>1.1 text over TCP; 2 binary multiplexed streams; 3 over QUIC (UDP)</td></tr><tr><td>Overhead</td><td>Hundreds of bytes of headers per request</td></tr><tr><td>Used for</td><td>REST/JSON APIs, web dashboards, firmware download (OTA), webhooks</td></tr></table></div><h3>How it works</h3><ul><li>A request is: request line, headers, empty line, optional body. A response is: status line, headers, empty line, body. Lines end with CR LF.</li><li><strong>HTTPS</strong> = HTTP inside TLS: the client checks the server certificate, both sides agree on keys, then everything is encrypted. Constrained devices need enough RAM (tens of KB) for TLS.</li><li>Cookies and tokens (for example <code>Authorization: Bearer ...</code>) add state on top of a stateless protocol. <code>Content-Length</code> or chunked encoding tells the receiver where the body ends.</li><li>For IoT, HTTP is easy to debug and works through firewalls but is heavy compared with MQTT or CoAP. Typical ESP32 library: <code>HTTPClient</code>.</li><li>Idempotent methods (GET, PUT, DELETE) can safely be retried; POST may create duplicates.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 450 330" role="img" aria-label="HTTP request and response flow" style="min-width:450px;max-width:450px"><rect class="wb" x="40" y="6" width="120" height="26" rx="6"/><text class="wf1" x="100.0" y="23.0" text-anchor="middle">Client</text><line class="wlife" x1="100" x2="100" y1="32" y2="324"/><rect class="wb" x="290" y="6" width="120" height="26" rx="6"/><text class="wf1" x="350.0" y="23.0" text-anchor="middle">Server</text><line class="wlife" x1="350" x2="350" y1="32" y2="324"/><rect class="wb b" x="82.85" y="50" width="284.3" height="24" rx="12"/><text class="wf1" x="225.0" y="66.0" text-anchor="middle">TCP handshake (+ TLS handshake for HTTPS)</text><line class="wa" x1="100" x2="350" y1="104" y2="104"/><polygon class="wah" points="350,104 341,99.5 341,108.5"/><text class="wf1" x="225.0" y="98.0" text-anchor="middle">GET /api/temp HTTP/1.1</text><text class="wf2" x="225.0" y="117.0" text-anchor="middle">Host, Accept headers</text><line class="wa r" x1="350" x2="100" y1="142" y2="142"/><polygon class="wah r" points="100,142 109,137.5 109,146.5"/><text class="wf1" x="225.0" y="136.0" text-anchor="middle">200 OK</text><text class="wf2" x="225.0" y="155.0" text-anchor="middle">Content-Type: application/json</text><line class="wa" x1="100" x2="350" y1="180" y2="180"/><polygon class="wah" points="350,180 341,175.5 341,184.5"/><text class="wf1" x="225.0" y="174.0" text-anchor="middle">POST /api/led</text><text class="wf2" x="225.0" y="193.0" text-anchor="middle">body: {&quot;on&quot;:true}</text><line class="wa r" x1="350" x2="100" y1="218" y2="218"/><polygon class="wah r" points="100,218 109,213.5 109,222.5"/><text class="wf1" x="225.0" y="212.0" text-anchor="middle">204 No Content</text><rect class="wb b" x="85" y="240" width="280" height="24" rx="12"/><text class="wf1" x="225.0" y="256.0" text-anchor="middle">Keep-Alive: same TCP connection reused</text><line class="wa" x1="100" x2="350" y1="294" y2="294"/><polygon class="wah" points="350,294 341,289.5 341,298.5"/><text class="wf1" x="225.0" y="288.0" text-anchor="middle">Connection close (FIN)</text></svg></div><figcaption>One keep-alive connection carrying two request/response pairs.</figcaption></figure><pre><code>GET /api/temp HTTP/1.1
Host: sensor.local
Accept: application/json

HTTP/1.1 200 OK
Content-Type: application/json
Content-Length: 15

{"temp":24.5}</code></pre><h3>Common headers</h3><div class="tw"><table><tr><th>Header</th><th>Meaning</th></tr><tr><td>Host</td><td>Required in HTTP/1.1; the site name (virtual hosting)</td></tr><tr><td>Content-Type / Content-Length</td><td>Format and size of the body, for example application/json</td></tr><tr><td>Accept</td><td>Formats the client can handle</td></tr><tr><td>Authorization</td><td>Credentials, for example Bearer token or Basic</td></tr><tr><td>Cache-Control, ETag</td><td>Caching rules and version tag; the client sends If-None-Match and may get 304 Not Modified</td></tr><tr><td>Set-Cookie / Cookie</td><td>Server-set state sent back by the client</td></tr><tr><td>Connection</td><td>keep-alive or close</td></tr><tr><td>User-Agent</td><td>Client identity</td></tr></table></div><h3>Status codes to know</h3><div class="tw"><table><tr><th>Code</th><th>Meaning</th><th>Code</th><th>Meaning</th></tr><tr><td>200</td><td>OK</td><td>400</td><td>Bad request</td></tr><tr><td>201</td><td>Created</td><td>401</td><td>Unauthorized (needs login)</td></tr><tr><td>204</td><td>No content</td><td>403</td><td>Forbidden</td></tr><tr><td>301 / 302</td><td>Moved permanently / temporarily</td><td>404</td><td>Not found</td></tr><tr><td>304</td><td>Not modified (use cache)</td><td>429</td><td>Too many requests</td></tr><tr><td>101</td><td>Switching protocols (WebSocket)</td><td>500 / 503</td><td>Server error / unavailable</td></tr></table></div><h3>HTTP versions</h3><div class="tw"><table><tr><th>Version</th><th>Year</th><th>Main idea</th></tr><tr><td>0.9</td><td>1991</td><td>GET only, no headers</td></tr><tr><td>1.0</td><td>1996</td><td>Headers, status codes, one request per connection</td></tr><tr><td>1.1</td><td>1997 (RFC 9112 in 2022)</td><td>Keep-alive, Host header, chunked transfer</td></tr><tr><td>2</td><td>2015 (RFC 9113)</td><td>Binary frames, multiplexing, header compression (HPACK)</td></tr><tr><td>3</td><td>2022 (RFC 9114)</td><td>Runs over QUIC on UDP, no head-of-line blocking at transport level</td></tr></table></div><h3>HTTPS and TLS 1.3</h3><ul><li>ClientHello (supported ciphers, key share) -> ServerHello with certificate and key share, server Finished -> client Finished. Application data can flow after <strong>one round trip</strong> (TLS 1.2 needs two).</li><li>The client verifies the certificate chain up to a trusted root CA, the host name and the validity dates, so the device needs a correct clock and a CA bundle.</li><li>TLS needs about 30 to 50 KB of RAM on a microcontroller (mbedTLS), which is why a lightweight protocol or TLS session reuse is often used.</li></ul><h3>REST API example</h3><pre><code>POST /api/led HTTP/1.1
Host: sensor.local
Content-Type: application/json
Content-Length: 11

{&quot;on&quot;:true}</code></pre><pre><code>#include &lt;HTTPClient.h&gt;
HTTPClient http;
http.begin(&quot;http://sensor.local/api/temp&quot;);
int code = http.GET();                 // 200 on success
if (code == 200) Serial.println(http.getString());
http.end();</code></pre><ul><li>URLs name resources (<code>/api/led/1</code>); methods are the verbs. Test from a PC with <code>curl -v http://sensor.local/api/temp</code>.</li><li>OTA firmware updates usually download the image with an HTTPS GET and check a hash or signature.</li></ul><h3>Common problems</h3><ul><li>Forgetting the blank line or the Content-Length: the receiver hangs waiting for more data.</li><li>Certificate errors (wrong clock on the device, missing root CA).</li><li>Blocking HTTP calls inside a time-critical task.</li></ul><p><strong>Interview:</strong> GET vs POST? GET reads a resource, has no body and is idempotent and cacheable; POST sends data to create or process something and is not idempotent.</p><h2 id="bluetooth">10. Bluetooth Classic (BR/EDR)</h2><p>Bluetooth Classic is a short-range 2.4 GHz link for <strong>continuous streams</strong> such as audio and serial data. A <strong>master</strong> and up to seven active slaves form a piconet and hop together across 79 channels.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Radio</td><td>2.4 GHz ISM, 79 channels of 1 MHz (2402 to 2480 MHz), frequency hopping 1600 hops/s</td></tr><tr><td>Data rate</td><td>BR 1 Mbit/s (GFSK), EDR 2 and 3 Mbit/s (pi/4-DQPSK, 8DPSK)</td></tr><tr><td>Topology</td><td>Piconet: 1 master + 7 active slaves; scatternet joins piconets</td></tr><tr><td>Range</td><td>Class 1 100 m, Class 2 10 m, Class 3 1 m</td></tr><tr><td>Stack</td><td>Radio, baseband, LMP, L2CAP, RFCOMM, SDP, profiles</td></tr><tr><td>Profiles</td><td>SPP (serial port), A2DP (audio), HFP (hands-free), HID (keyboard)</td></tr></table></div><h3>How it works</h3><ul><li><strong>TDD with 625 us slots:</strong> the master sends in even slots and the addressed slave replies in odd slots. The hop sequence comes from the master clock and address, so every slave follows it.</li><li>Hopping avoids interference (adaptive frequency hopping skips busy channels, such as Wi-Fi).</li><li>Setup: <strong>inquiry</strong> (find devices), <strong>page</strong> (connect), then pairing (Secure Simple Pairing) and a service search with SDP.</li><li>On an ESP32 (original chip) Classic Bluetooth gives you SPP: a wireless serial port that appears like a UART on a phone or PC.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 604 146" role="img" aria-label="Bluetooth master/slave time slots" style="min-width:604px;max-width:604px"><rect class="wband" x="64" y="20" width="66" height="116"/><text class="wl wh" x="97.0" y="13.0" text-anchor="middle">625 us slot</text><line class="wg" x1="64" x2="64" y1="20" y2="134"/><line class="wg" x1="130" x2="130" y1="20" y2="134"/><line class="wg" x1="196" x2="196" y1="20" y2="134"/><line class="wg" x1="262" x2="262" y1="20" y2="134"/><line class="wg" x1="328" x2="328" y1="20" y2="134"/><line class="wg" x1="394" x2="394" y1="20" y2="134"/><line class="wg" x1="460" x2="460" y1="20" y2="134"/><line class="wg" x1="526" x2="526" y1="20" y2="134"/><line class="wg" x1="592" x2="592" y1="20" y2="134"/><text class="wt" x="4.0" y="61.0" text-anchor="start">Master</text><path class="wv " d="M64 44 L130 44 L130 44 L130 70 L196 70 L196 70 L196 44 L262 44 L262 44 L262 70 L328 70 L328 70 L328 44 L394 44 L394 44 L394 70 L460 70 L460 70 L460 44 L526 44 L526 44 L526 70 L592 70"/><text class="wl" x="97.0" y="39.0" text-anchor="middle">ch12</text><text class="wl" x="229.0" y="39.0" text-anchor="middle">ch5</text><text class="wl" x="361.0" y="39.0" text-anchor="middle">ch33</text><text class="wl" x="493.0" y="39.0" text-anchor="middle">ch8</text><text class="wt" x="4.0" y="119.0" text-anchor="start">Slave</text><path class="wv b" d="M64 128 L130 128 L130 128 L130 102 L196 102 L196 102 L196 128 L262 128 L262 128 L262 102 L328 102 L328 102 L328 128 L394 128 L394 128 L394 102 L460 102 L460 102 L460 128 L526 128 L526 128 L526 102 L592 102"/><text class="wl" x="163.0" y="97.0" text-anchor="middle">ch47</text><text class="wl" x="295.0" y="97.0" text-anchor="middle">ch70</text><text class="wl" x="427.0" y="97.0" text-anchor="middle">ch61</text><text class="wl" x="559.0" y="97.0" text-anchor="middle">ch52</text></svg></div><figcaption>Master and slave alternate, each slot on a new channel from the hop sequence (channel numbers here are examples).</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 438 80" role="img" aria-label="Bluetooth baseband packet" style="min-width:438px;max-width:438px"><text class="wl" x="8.0" y="14.0" text-anchor="start">Basic-rate packet</text><rect class="wb b" x="8" y="20" width="128" height="46" rx="4"/><text class="wf1" x="72.0" y="42.0" text-anchor="middle">Access code</text><text class="wf2" x="72.0" y="55.0" text-anchor="middle">72 bits</text><rect class="wb " x="140" y="20" width="110.4" height="46" rx="4"/><text class="wf1" x="195.2" y="42.0" text-anchor="middle">Header</text><text class="wf2" x="195.2" y="55.0" text-anchor="middle">54 bits</text><rect class="wb " x="254.4" y="20" width="172" height="46" rx="4"/><text class="wf1" x="340.4" y="42.0" text-anchor="middle">Payload</text><text class="wf2" x="340.4" y="55.0" text-anchor="middle">up to 339 bytes</text></svg></div><figcaption>Access code, header and payload; lengths vary by packet type (DM1, DH5 and so on).</figcaption></figure><h3>Packet types (ACL data)</h3><div class="tw"><table><tr><th>Type</th><th>Slots</th><th>Max payload</th><th>Notes</th></tr><tr><td>DM1</td><td>1</td><td>17 bytes</td><td>2/3 FEC (error correction)</td></tr><tr><td>DH1</td><td>1</td><td>27 bytes</td><td>no FEC</td></tr><tr><td>DM3 / DH3</td><td>3</td><td>121 / 183 bytes</td><td></td></tr><tr><td>DM5 / DH5</td><td>5</td><td>224 / 339 bytes</td><td>Best throughput on BR</td></tr><tr><td>2-DH5 / 3-DH5</td><td>5</td><td>679 / 1021 bytes</td><td>EDR</td></tr></table></div><p>Voice uses reserved <strong>SCO</strong> or <strong>eSCO</strong> links (HV1 to HV3, EV3 to EV5) with fixed slots so audio is never delayed.</p><h3>Connection states and modes</h3><ul><li><strong>Standby</strong> -> <strong>Inquiry</strong> (broadcast and listen, finds addresses) -> <strong>Page</strong> (connect to a known address) -> <strong>Connected</strong>.</li><li>Low-power modes while connected: <strong>Sniff</strong> (wake at fixed intervals), <strong>Hold</strong> (pause for a set time), <strong>Park</strong> (give up the active address).</li><li><strong>Adaptive frequency hopping:</strong> the link uses at least 20 good channels and skips those occupied by Wi-Fi.</li></ul><h3>Pairing</h3><ul><li>Legacy pairing used a PIN (0000 or 1234). <strong>Secure Simple Pairing</strong> (Bluetooth 2.1) uses ECDH and four models: Just Works, Numeric Comparison, Passkey Entry and Out of Band (for example NFC).</li></ul><h3>Profiles</h3><div class="tw"><table><tr><th>Profile</th><th>Use</th></tr><tr><td>SPP</td><td>Serial cable replacement (RFCOMM channel)</td></tr><tr><td>HFP / HSP</td><td>Hands-free and headset calls</td></tr><tr><td>A2DP</td><td>High-quality stereo audio streaming (SBC, AAC, aptX, LDAC codecs)</td></tr><tr><td>AVRCP</td><td>Play, pause, volume remote control</td></tr><tr><td>HID</td><td>Keyboard, mouse, game pad</td></tr><tr><td>PAN / OPP / PBAP</td><td>Networking, file push, phone book access</td></tr></table></div><p>Bluetooth Classic and BLE share the same brand but are different radios; see the BLE section for the version history of both.</p><pre><code>#include &quot;BluetoothSerial.h&quot;
BluetoothSerial SerialBT;
void setup()  { SerialBT.begin(&quot;ESP32-SPP&quot;); }      // visible name on the phone
void loop()   { if (SerialBT.available()) SerialBT.write(SerialBT.read()); }  // echo</code></pre><h3>Common problems</h3><ul><li>Not available on ESP32-S3, C3 and other BLE-only chips.</li><li>Pairing state cached on the phone: remove the old pairing and try again.</li><li>Interference and power use are higher than BLE for tiny data.</li></ul><p><strong>Interview:</strong> Piconet size? One master and up to 7 active slaves (8 devices), with more parked slaves.</p><h2 id="ble">11. BLE (Bluetooth Low Energy)</h2><p>BLE is designed for <strong>tiny bursts of data and years on a coin cell</strong>. Devices sleep almost all the time. A peripheral advertises, a central connects, and data is exchanged as small values called <strong>characteristics</strong>.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Radio</td><td>2.4 GHz, 40 channels of 2 MHz: advertising on 37, 38, 39; data on 0 to 36</td></tr><tr><td>PHY</td><td>LE 1M (1 Mbit/s), LE 2M, LE Coded (125 / 500 kbit/s, long range) from Bluetooth 5</td></tr><tr><td>Roles</td><td>Advertiser / scanner (GAP broadcast), peripheral / central (connection)</td></tr><tr><td>Data model</td><td>GATT: Service -> Characteristic -> Descriptor, accessed with ATT read, write, notify, indicate</td></tr><tr><td>Timing</td><td>connection interval 7.5 ms to 4 s; T_IFS 150 us between packets</td></tr><tr><td>Used for</td><td>Wearables, beacons, sensors, smart locks, phone provisioning</td></tr></table></div><h3>How it works</h3><ul><li><strong>Advertising:</strong> the peripheral sends the same packet on channels 37, 38 and 39 once every advertising interval (20 ms to 10.24 s), plus a 0 to 10 ms random delay to avoid repeated collisions. The packet can hold a name, UUIDs and up to about 31 bytes of data.</li><li><strong>Connection:</strong> after a CONNECT request both sides wake at every connection event, the central sends first, the peripheral answers 150 us later, and both hop to the next data channel. <strong>Slave latency</strong> lets the peripheral skip events to save power.</li><li><strong>GATT:</strong> a service (for example Heart Rate, UUID 0x180D) holds characteristics (value + properties). A client can read, write, or subscribe to <strong>notifications</strong> so the server pushes new values.</li><li>Security: LE Secure Connections use ECDH key exchange; bonding stores the keys for reconnection.</li><li>Beacons (iBeacon, Eddystone) only advertise and never connect.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 636 94" role="img" aria-label="BLE advertising events" style="min-width:636px;max-width:636px"><rect class="wband" x="64" y="20" width="112" height="64"/><text class="wl wh" x="120.0" y="13.0" text-anchor="middle">adv event</text><rect class="wband" x="344" y="20" width="112" height="64"/><text class="wl wh" x="400.0" y="13.0" text-anchor="middle">adv event</text><text class="wt" x="4.0" y="61.0" text-anchor="start">Advertiser</text><path class="wv " d="M64 44 L78 44 L92 44 L92 44 L92 70 L106 70 L106 70 L106 44 L120 44 L134 44 L134 44 L134 70 L148 70 L148 70 L148 44 L162 44 L176 44 L176 44 L176 70 L190 70 L204 70 L218 70 L232 70 L246 70 L260 70 L274 70 L288 70 L302 70 L316 70 L330 70 L344 70 L344 70 L344 44 L358 44 L372 44 L372 44 L372 70 L386 70 L386 70 L386 44 L400 44 L414 44 L414 44 L414 70 L428 70 L428 70 L428 44 L442 44 L456 44 L456 44 L456 70 L470 70 L484 70 L498 70 L512 70 L526 70 L540 70 L554 70 L568 70 L582 70 L596 70 L610 70 L624 70"/><text class="wl" x="78.0" y="39.0" text-anchor="middle">37</text><text class="wl" x="120.0" y="39.0" text-anchor="middle">38</text><text class="wl" x="162.0" y="39.0" text-anchor="middle">39</text><text class="wl" x="260.0" y="39.0" text-anchor="middle">advInterval</text><text class="wl" x="358.0" y="39.0" text-anchor="middle">37</text><text class="wl" x="400.0" y="39.0" text-anchor="middle">38</text><text class="wl" x="442.0" y="39.0" text-anchor="middle">39</text></svg></div><figcaption>Each advertising event sends the packet on channels 37, 38 and 39, then sleeps until the next interval (advInterval plus a 0 to 10 ms random delay).</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 636 146" role="img" aria-label="BLE connection events" style="min-width:636px;max-width:636px"><rect class="wband" x="64" y="20" width="70" height="116"/><text class="wl wh" x="99.0" y="13.0" text-anchor="middle">event ch 7</text><rect class="wband" x="344" y="20" width="70" height="116"/><text class="wl wh" x="379.0" y="13.0" text-anchor="middle">event ch 21</text><text class="wt" x="4.0" y="61.0" text-anchor="start">Central</text><path class="wv " d="M64 44 L78 44 L92 44 L92 44 L92 70 L106 70 L120 70 L134 70 L148 70 L162 70 L176 70 L190 70 L204 70 L218 70 L232 70 L246 70 L260 70 L274 70 L288 70 L302 70 L316 70 L330 70 L344 70 L344 70 L344 44 L358 44 L372 44 L372 44 L372 70 L386 70 L400 70 L414 70 L428 70 L442 70 L456 70 L470 70 L484 70 L498 70 L512 70 L526 70 L540 70 L554 70 L568 70 L582 70 L596 70 L610 70 L624 70"/><text class="wl" x="78.0" y="39.0" text-anchor="middle">M</text><text class="wl" x="218.0" y="39.0" text-anchor="middle">connection interval 7.5 ms to 4 s</text><text class="wl" x="358.0" y="39.0" text-anchor="middle">M</text><text class="wt" x="4.0" y="119.0" text-anchor="start">Periph</text><path class="wv b" d="M64 128 L78 128 L92 128 L106 128 L106 128 L106 102 L120 102 L134 102 L134 102 L134 128 L148 128 L162 128 L176 128 L190 128 L204 128 L218 128 L232 128 L246 128 L260 128 L274 128 L288 128 L302 128 L316 128 L330 128 L344 128 L358 128 L372 128 L386 128 L386 128 L386 102 L400 102 L414 102 L414 102 L414 128 L428 128 L442 128 L456 128 L470 128 L484 128 L498 128 L512 128 L526 128 L540 128 L554 128 L568 128 L582 128 L596 128 L610 128 L624 128"/><text class="wl" x="120.0" y="97.0" text-anchor="middle">S</text></svg></div><figcaption>The central opens each event, the peripheral answers after T_IFS (150 us), and the next event starts one connection interval later on another channel.</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 531 80" role="img" aria-label="BLE advertising packet layout" style="min-width:531px;max-width:531px"><text class="wl" x="8.0" y="14.0" text-anchor="start">LE 1M advertising packet</text><rect class="wb g" x="8" y="20" width="56" height="46" rx="4"/><text class="wf1" x="36.0" y="42.0" text-anchor="middle">Preamble</text><text class="wf2" x="36.0" y="55.0" text-anchor="middle">1 B</text><rect class="wb " x="68" y="20" width="136" height="46" rx="4"/><text class="wf1" x="136.0" y="42.0" text-anchor="middle">Access addr</text><text class="wf2" x="136.0" y="55.0" text-anchor="middle">4 B</text><rect class="wb b" x="208" y="20" width="76" height="46" rx="4"/><text class="wf1" x="246.0" y="42.0" text-anchor="middle">PDU hdr</text><text class="wf2" x="246.0" y="55.0" text-anchor="middle">2 B</text><rect class="wb b" x="288" y="20" width="156" height="46" rx="4"/><text class="wf1" x="366.0" y="42.0" text-anchor="middle">Payload</text><text class="wf2" x="366.0" y="55.0" text-anchor="middle">6 to 37 B</text><rect class="wb g" x="448" y="20" width="71" height="46" rx="4"/><text class="wf1" x="483.5" y="42.0" text-anchor="middle">CRC</text><text class="wf2" x="483.5" y="55.0" text-anchor="middle">3 B</text></svg></div><figcaption>Link layer packet; the payload carries advertiser address and advertising data.</figcaption></figure><h3>Bluetooth and BLE versions</h3><div class="tw"><table><tr><th>Version</th><th>Year</th><th>What changed</th></tr><tr><td>1.0 / 1.1 / 1.2</td><td>1999 to 2003</td><td>First Bluetooth, about 1 Mbit/s raw (721 kbit/s data), adaptive hopping in 1.2</td></tr><tr><td>2.0 + EDR</td><td>2004</td><td>Enhanced Data Rate: 2 and 3 Mbit/s</td></tr><tr><td>2.1 + EDR</td><td>2007</td><td>Secure Simple Pairing</td></tr><tr><td>3.0 + HS</td><td>2009</td><td>High Speed over an 802.11 link</td></tr><tr><td>4.0</td><td>2010</td><td><strong>Bluetooth Low Energy introduced</strong> (GATT, advertising, 1 Mbit/s)</td></tr><tr><td>4.1</td><td>2013</td><td>LE connection parameter updates, coexistence with LTE, LE and Classic at once</td></tr><tr><td>4.2</td><td>2014</td><td>LE Secure Connections (ECDH), Data Length Extension (up to 251-byte payload), privacy, IPv6 support</td></tr><tr><td>5.0</td><td>2016</td><td><strong>LE 2M PHY</strong> (double speed), <strong>LE Coded PHY</strong> (125 and 500 kbit/s, about 4x range), advertising extensions (up to 255 bytes) and 8x broadcast capacity</td></tr><tr><td>5.1</td><td>2019</td><td>Direction finding (AoA and AoD), GATT caching</td></tr><tr><td>5.2</td><td>2020</td><td>LE Audio basis: isochronous channels, EATT (enhanced ATT), LE Power Control</td></tr><tr><td>5.3</td><td>2021</td><td>Connection subrating, channel classification enhancements, periodic advertising improvements</td></tr><tr><td>5.4</td><td>2023</td><td>Periodic Advertising with Responses (PAwR, for electronic shelf labels), encrypted advertising data</td></tr><tr><td>6.0</td><td>2024</td><td>Channel Sounding (centimetre-level distance measurement), ISO adaptation layer improvements, more LE Audio features</td></tr><tr><td>6.x updates</td><td>2025 onward</td><td>Further refinements; check bluetooth.com for the newest core specification</td></tr></table></div><p>Related: <strong>Bluetooth Mesh</strong> (2017, many-to-many on top of BLE advertising, used in lighting) and <strong>LE Audio</strong> with the LC3 codec and Auracast broadcast audio. Each version is backward compatible; two devices use the highest feature set they both support.</p><h3>Chip support</h3><div class="tw"><table><tr><th>Chip</th><th>Classic</th><th>BLE</th></tr><tr><td>ESP32 (original)</td><td>yes</td><td>BLE 4.2</td></tr><tr><td>ESP32-S3, ESP32-C3</td><td>no</td><td>BLE 5.0</td></tr><tr><td>ESP32-C6, ESP32-H2</td><td>no</td><td>BLE 5.x (H2: also 802.15.4)</td></tr><tr><td>nRF52 series</td><td>no</td><td>BLE 5.x</td></tr><tr><td>STM32WB</td><td>no</td><td>BLE 5.x</td></tr></table></div><h3>GATT structure</h3><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 652 82" role="img" aria-label="GATT hierarchy" style="min-width:652px;max-width:652px"><text class="wl" x="8.0" y="14.0" text-anchor="start">A GATT server is a table of attributes, each with a handle and a UUID</text><rect class="wb " x="8" y="20" width="116" height="48" rx="4"/><text class="wf1" x="66.0" y="43.0" text-anchor="middle">Profile</text><text class="wf2" x="66.0" y="56.0" text-anchor="middle">Heart Rate</text><rect class="wb b" x="128" y="20" width="104" height="48" rx="4"/><text class="wf1" x="180.0" y="43.0" text-anchor="middle">Service</text><text class="wf2" x="180.0" y="56.0" text-anchor="middle">0x180D</text><rect class="wb " x="236" y="20" width="188" height="48" rx="4"/><text class="wf1" x="330.0" y="43.0" text-anchor="middle">Characteristic</text><text class="wf2" x="330.0" y="56.0" text-anchor="middle">0x2A37 Measurement</text><rect class="wb b" x="428" y="20" width="80" height="48" rx="4"/><text class="wf1" x="468.0" y="43.0" text-anchor="middle">Value</text><text class="wf2" x="468.0" y="56.0" text-anchor="middle">bytes</text><rect class="wb " x="512" y="20" width="128" height="48" rx="4"/><text class="wf1" x="576.0" y="43.0" text-anchor="middle">Descriptor</text><text class="wf2" x="576.0" y="56.0" text-anchor="middle">CCCD 0x2902</text></svg></div><figcaption>Example: the Heart Rate service holds the Heart Rate Measurement characteristic. A client writes 0x0001 to the CCCD descriptor to turn on notifications.</figcaption></figure><div class="tw"><table><tr><th>UUID</th><th>Name</th></tr><tr><td>0x180F</td><td>Battery Service (characteristic 0x2A19 Battery Level, 0 to 100 percent)</td></tr><tr><td>0x180D</td><td>Heart Rate Service (0x2A37 measurement, notify)</td></tr><tr><td>0x181A</td><td>Environmental Sensing (temperature 0x2A6E, humidity 0x2A6F)</td></tr><tr><td>0x1800 / 0x1801</td><td>Generic Access / Generic Attribute (always present)</td></tr></table></div><h3>Advertising data and ATT</h3><ul><li>An advertising payload is a list of <strong>AD structures</strong>: length, type, data. Example: <code>02 01 06</code> = flags (LE general discoverable, no BR/EDR); <code>05 09 54 65 73 74</code> = complete local name "Test".</li><li>PDU types: ADV_IND (connectable), ADV_NONCONN_IND (beacon), ADV_SCAN_IND, SCAN_REQ / SCAN_RSP (extra 31 bytes), CONNECT_IND.</li><li><strong>ATT opcodes:</strong> Read Request 0x0A / Response 0x0B, Write Request 0x12 / Response 0x13, Write Command 0x52 (no reply), Notification 0x1B (no confirm), Indication 0x1D with Confirmation 0x1E.</li><li>Default <strong>ATT MTU is 23 bytes</strong>, so 20 bytes of payload; negotiate up to 517 for more. Data Length Extension raises the link-layer payload from 27 to 251 bytes.</li></ul><h3>Connection parameters</h3><div class="tw"><table><tr><th>Parameter</th><th>Unit</th><th>Range</th></tr><tr><td>Connection interval</td><td>1.25 ms</td><td>7.5 ms to 4 s</td></tr><tr><td>Peripheral (slave) latency</td><td>events</td><td>0 to 499</td></tr><tr><td>Supervision timeout</td><td>10 ms</td><td>100 ms to 32 s</td></tr></table></div><p>Rule: supervision timeout must be larger than (1 + latency) x interval x 2. Phones often accept 15 to 30 ms intervals; a sensor that sends once a second can use a long interval and latency to run for years on a coin cell.</p><h3>Security</h3><ul><li>Pairing methods: Just Works (no protection against active attackers), Passkey Entry, Numeric Comparison, Out of Band. <strong>LE Secure Connections</strong> (4.2 onward) use ECDH P-256; legacy pairing is weaker.</li><li><strong>Bonding</strong> stores the long-term key. <strong>Privacy</strong> uses resolvable private addresses that change about every 15 minutes so a tracker cannot follow the device.</li></ul><pre><code>#include &lt;BLEDevice.h&gt;
#include &lt;BLEServer.h&gt;
void setup() {
  BLEDevice::init(&quot;ESP32-BLE&quot;);
  BLEServer *srv = BLEDevice::createServer();
  BLEService *svc = srv-&gt;createService(&quot;180F&quot;);            // Battery Service
  BLECharacteristic *c = svc-&gt;createCharacteristic(&quot;2A19&quot;,
      BLECharacteristic::PROPERTY_READ | BLECharacteristic::PROPERTY_NOTIFY);
  uint8_t level = 87;
  c-&gt;setValue(&amp;level, 1);
  svc-&gt;start();
  BLEDevice::getAdvertising()-&gt;addServiceUUID(&quot;180F&quot;);
  BLEDevice::startAdvertising();
}
void loop() {}</code></pre><h3>Common problems</h3><ul><li>Short connection interval = fast but power hungry; long = slow but efficient.</li><li>Android limits scanning and has 20-byte default MTU until negotiated.</li><li>Phone caches the GATT table: change the service and the app still shows the old one.</li></ul><p><strong>Interview:</strong> BLE vs Classic? BLE has lower power and fast reconnect and is built around small GATT reads, writes and notifications; Classic streams audio and serial data and needs more power.</p><h2 id="mqtt">12. MQTT</h2><p>MQTT is a lightweight <strong>publish/subscribe</strong> protocol over TCP. Devices never talk to each other directly: they publish messages to <strong>topics</strong> on a <strong>broker</strong>, and the broker forwards them to every client subscribed to that topic.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Transport</td><td>TCP port 1883, TLS port 8883 (WebSockets also possible)</td></tr><tr><td>Topology</td><td>Star around a broker (Mosquitto, EMQX, HiveMQ, AWS IoT Core)</td></tr><tr><td>Topics</td><td>Hierarchical: <code>home/lab/temp</code>; <code>+</code> = one level, <code>#</code> = all remaining levels</td></tr><tr><td>Header</td><td>2 bytes minimum: type + flags, remaining length</td></tr><tr><td>QoS</td><td>0 at most once, 1 at least once, 2 exactly once</td></tr><tr><td>Used for</td><td>Telemetry, remote control, dashboards, smart home</td></tr></table></div><h3>How it works</h3><ul><li><strong>Control packets:</strong> CONNECT, CONNACK, PUBLISH, PUBACK, PUBREC, PUBREL, PUBCOMP, SUBSCRIBE, SUBACK, UNSUBSCRIBE, UNSUBACK, PINGREQ, PINGRESP, DISCONNECT.</li><li><strong>Retained message:</strong> the broker keeps the last value of a topic and gives it to new subscribers immediately.</li><li><strong>Last Will and Testament:</strong> at connect time the client registers a message the broker publishes if the client disappears without DISCONNECT (for example "offline").</li><li><strong>Keep-alive:</strong> the client must send something (or PINGREQ) within the keep-alive time, or the broker drops it.</li><li>MQTT 5 adds reason codes, shared subscriptions, message expiry and user properties. Arduino: PubSubClient; ESP-IDF: esp-mqtt.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 660 368" role="img" aria-label="MQTT publish and subscribe" style="min-width:660px;max-width:660px"><rect class="wb" x="40" y="6" width="120" height="26" rx="6"/><text class="wf1" x="100.0" y="23.0" text-anchor="middle">Sensor (pub)</text><line class="wlife" x1="100" x2="100" y1="32" y2="362"/><rect class="wb" x="270" y="6" width="120" height="26" rx="6"/><text class="wf1" x="330.0" y="23.0" text-anchor="middle">Broker</text><line class="wlife" x1="330" x2="330" y1="32" y2="362"/><rect class="wb" x="500" y="6" width="120" height="26" rx="6"/><text class="wf1" x="560.0" y="23.0" text-anchor="middle">Phone (sub)</text><line class="wlife" x1="560" x2="560" y1="32" y2="362"/><line class="wa r" x1="560" x2="330" y1="66" y2="66"/><polygon class="wah r" points="330,66 339,61.5 339,70.5"/><text class="wf1" x="445.0" y="60.0" text-anchor="middle">SUBSCRIBE home/+/temp</text><text class="wf2" x="445.0" y="79.0" text-anchor="middle">QoS 1</text><line class="wa" x1="330" x2="560" y1="104" y2="104"/><polygon class="wah" points="560,104 551,99.5 551,108.5"/><text class="wf1" x="445.0" y="98.0" text-anchor="middle">SUBACK</text><line class="wa" x1="100" x2="330" y1="142" y2="142"/><polygon class="wah" points="330,142 321,137.5 321,146.5"/><text class="wf1" x="215.0" y="136.0" text-anchor="middle">CONNECT</text><text class="wf2" x="215.0" y="155.0" text-anchor="middle">client id, keep-alive</text><line class="wa r" x1="330" x2="100" y1="180" y2="180"/><polygon class="wah r" points="100,180 109,175.5 109,184.5"/><text class="wf1" x="215.0" y="174.0" text-anchor="middle">CONNACK</text><line class="wa" x1="100" x2="330" y1="218" y2="218"/><polygon class="wah" points="330,218 321,213.5 321,222.5"/><text class="wf1" x="215.0" y="212.0" text-anchor="middle">PUBLISH home/lab/temp = 24.5</text><text class="wf2" x="215.0" y="231.0" text-anchor="middle">QoS 1</text><line class="wa r" x1="330" x2="100" y1="256" y2="256"/><polygon class="wah r" points="100,256 109,251.5 109,260.5"/><text class="wf1" x="215.0" y="250.0" text-anchor="middle">PUBACK</text><line class="wa" x1="330" x2="560" y1="294" y2="294"/><polygon class="wah" points="560,294 551,289.5 551,298.5"/><text class="wf1" x="445.0" y="288.0" text-anchor="middle">PUBLISH home/lab/temp = 24.5</text><line class="wa r" x1="560" x2="330" y1="332" y2="332"/><polygon class="wah r" points="330,332 339,327.5 339,336.5"/><text class="wf1" x="445.0" y="326.0" text-anchor="middle">PUBACK</text></svg></div><figcaption>A publisher and a subscriber never connect to each other. The broker matches topics and forwards messages.</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 420 404" role="img" aria-label="MQTT QoS levels" style="min-width:420px;max-width:420px"><rect class="wb" x="40" y="6" width="120" height="26" rx="6"/><text class="wf1" x="100.0" y="23.0" text-anchor="middle">Sender</text><line class="wlife" x1="100" x2="100" y1="32" y2="398"/><rect class="wb" x="260" y="6" width="120" height="26" rx="6"/><text class="wf1" x="320.0" y="23.0" text-anchor="middle">Receiver</text><line class="wlife" x1="320" x2="320" y1="32" y2="398"/><rect class="wb b" x="85" y="50" width="250" height="24" rx="12"/><text class="wf1" x="210.0" y="66.0" text-anchor="middle">QoS 0: at most once</text><line class="wa" x1="100" x2="320" y1="100" y2="100"/><polygon class="wah" points="320,100 311,95.5 311,104.5"/><text class="wf1" x="210.0" y="94.0" text-anchor="middle">PUBLISH</text><rect class="wb b" x="85" y="118" width="250" height="24" rx="12"/><text class="wf1" x="210.0" y="134.0" text-anchor="middle">QoS 1: at least once</text><line class="wa" x1="100" x2="320" y1="168" y2="168"/><polygon class="wah" points="320,168 311,163.5 311,172.5"/><text class="wf1" x="210.0" y="162.0" text-anchor="middle">PUBLISH</text><line class="wa r" x1="320" x2="100" y1="202" y2="202"/><polygon class="wah r" points="100,202 109,197.5 109,206.5"/><text class="wf1" x="210.0" y="196.0" text-anchor="middle">PUBACK</text><rect class="wb b" x="85" y="220" width="250" height="24" rx="12"/><text class="wf1" x="210.0" y="236.0" text-anchor="middle">QoS 2: exactly once</text><line class="wa" x1="100" x2="320" y1="270" y2="270"/><polygon class="wah" points="320,270 311,265.5 311,274.5"/><text class="wf1" x="210.0" y="264.0" text-anchor="middle">PUBLISH</text><line class="wa r" x1="320" x2="100" y1="304" y2="304"/><polygon class="wah r" points="100,304 109,299.5 109,308.5"/><text class="wf1" x="210.0" y="298.0" text-anchor="middle">PUBREC</text><line class="wa" x1="100" x2="320" y1="338" y2="338"/><polygon class="wah" points="320,338 311,333.5 311,342.5"/><text class="wf1" x="210.0" y="332.0" text-anchor="middle">PUBREL</text><line class="wa r" x1="320" x2="100" y1="372" y2="372"/><polygon class="wah r" points="100,372 109,367.5 109,376.5"/><text class="wf1" x="210.0" y="366.0" text-anchor="middle">PUBCOMP</text></svg></div><figcaption>QoS 2 uses a four-step handshake so the message is delivered once and only once.</figcaption></figure><h3>Packet format</h3><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 472 82" role="img" aria-label="MQTT PUBLISH bytes" style="min-width:472px;max-width:472px"><text class="wl" x="8.0" y="14.0" text-anchor="start">PUBLISH to topic &quot;a/b&quot;, payload &quot;hi&quot;, QoS 0, 9 bytes in total</text><rect class="wb " x="8" y="20" width="92" height="48" rx="4"/><text class="wf1" x="54.0" y="43.0" text-anchor="middle">0x30</text><text class="wf2" x="54.0" y="56.0" text-anchor="middle">PUBLISH, QoS 0</text><rect class="wb b" x="104" y="20" width="104" height="48" rx="4"/><text class="wf1" x="156.0" y="43.0" text-anchor="middle">0x07</text><text class="wf2" x="156.0" y="56.0" text-anchor="middle">remaining length</text><rect class="wb " x="212" y="20" width="86" height="48" rx="4"/><text class="wf1" x="255.0" y="43.0" text-anchor="middle">00 03</text><text class="wf2" x="255.0" y="56.0" text-anchor="middle">topic len</text><rect class="wb b" x="302" y="20" width="86" height="48" rx="4"/><text class="wf1" x="345.0" y="43.0" text-anchor="middle">61 2F 62</text><text class="wf2" x="345.0" y="56.0" text-anchor="middle">a/b</text><rect class="wb " x="392" y="20" width="68" height="48" rx="4"/><text class="wf1" x="426.0" y="43.0" text-anchor="middle">68 69</text><text class="wf2" x="426.0" y="56.0" text-anchor="middle">hi</text></svg></div><figcaption>Byte 1 holds the packet type (high 4 bits) and flags DUP, QoS (2 bits), RETAIN (low 4 bits). Remaining length counts the bytes after it: 2 + 3 + 2 = 7.</figcaption></figure><ul><li><strong>Remaining length</strong> is a variable-length number: 7 bits per byte, bit 7 set means another byte follows (1 to 4 bytes, up to 256 MB).</li><li>Packet types: CONNECT 1, CONNACK 2, PUBLISH 3, PUBACK 4, PUBREC 5, PUBREL 6, PUBCOMP 7, SUBSCRIBE 8, SUBACK 9, UNSUBSCRIBE 10, UNSUBACK 11, PINGREQ 12, PINGRESP 13, DISCONNECT 14 (MQTT 5 adds AUTH 15).</li></ul><h3>CONNECT in detail</h3><ul><li>Contents: protocol name "MQTT", protocol level (4 = v3.1.1, 5 = v5), connect flags (clean session, will flag, will QoS, will retain, password, user name), keep-alive in seconds, client ID, then optional will topic and message, user name, password.</li><li>CONNACK return codes (v3.1.1): 0 accepted, 1 bad protocol version, 2 identifier rejected, 3 server unavailable, 4 bad user name or password, 5 not authorised.</li></ul><h3>QoS and sessions</h3><div class="tw"><table><tr><th>QoS</th><th>Packets</th><th>Guarantee</th><th>Cost</th></tr><tr><td>0</td><td>PUBLISH</td><td>At most once; lost if the link drops</td><td>Lowest</td></tr><tr><td>1</td><td>PUBLISH, PUBACK</td><td>At least once; duplicates possible (DUP flag)</td><td>Medium</td></tr><tr><td>2</td><td>PUBLISH, PUBREC, PUBREL, PUBCOMP</td><td>Exactly once</td><td>Highest</td></tr></table></div><ul><li>The delivered QoS is the <strong>lower</strong> of the publisher QoS and the subscription QoS.</li><li>A <strong>persistent session</strong> (clean session = 0) keeps subscriptions and queued QoS 1/2 messages while the client is offline. Use a fixed client ID.</li><li>Topic rules: case-sensitive, no leading slash, no spaces, <code>$SYS/</code> is reserved for broker statistics. Good design: <code>site/device/measurement</code>.</li></ul><h3>Versions</h3><div class="tw"><table><tr><th>Version</th><th>Year</th><th>Notes</th></tr><tr><td>3.1</td><td>1999</td><td>Created by Andy Stanford-Clark (IBM) and Arlen Nipper</td></tr><tr><td>3.1.1</td><td>2014</td><td>OASIS standard, ISO/IEC 20922; most deployed</td></tr><tr><td>5.0</td><td>2019</td><td>Reason codes, user properties, shared subscriptions, message expiry, topic aliases, request/response</td></tr><tr><td>MQTT-SN</td><td></td><td>For UDP, Zigbee and other non-TCP networks</td></tr></table></div><h3>Try it</h3><pre><code>mosquitto_sub -h localhost -t &quot;home/#&quot; -v
mosquitto_pub -h localhost -t home/lab/temp -m 24.5 -q 1 -r</code></pre><pre><code>#include &lt;WiFi.h&gt;
#include &lt;PubSubClient.h&gt;
WiFiClient net;  PubSubClient client(net);
void setup() {
  client.setServer(&quot;192.168.1.50&quot;, 1883);
  // id, user, pass, will topic, will QoS, will retain, will message
  client.connect(&quot;esp32-1&quot;, &quot;user&quot;, &quot;pass&quot;, &quot;home/esp32/status&quot;, 1, true, &quot;offline&quot;);
  client.publish(&quot;home/lab/temp&quot;, &quot;24.5&quot;);
}
void loop() { client.loop(); }          // keep-alive and incoming messages</code></pre><h3>Common problems</h3><ul><li>Duplicate client IDs: two clients kick each other off the broker.</li><li>Using <code>#</code> subscriptions on a busy broker.</li><li>Forgetting to call the client loop, so keep-alive pings are never sent.</li></ul><p><strong>Interview:</strong> MQTT vs HTTP? MQTT keeps one connection open, has a 2-byte header, supports push, retained messages and QoS; HTTP is request/response with large headers.</p><h2 id="coap">13. CoAP (Constrained Application Protocol)</h2><p>CoAP is "HTTP for tiny devices". It has the same REST ideas (GET, POST, PUT, DELETE on URIs) but runs over <strong>UDP</strong> with a 4-byte binary header, so it fits sensors with a few KB of RAM and low-power links such as 6LoWPAN.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Transport</td><td>UDP port 5683; DTLS port 5684 for security</td></tr><tr><td>Model</td><td>Client/server REST; can map to HTTP through a proxy</td></tr><tr><td>Message types</td><td>CON (confirmable), NON (non-confirmable), ACK, RST</td></tr><tr><td>Codes</td><td>Request 0.01 GET, 0.02 POST, 0.03 PUT, 0.04 DELETE; response class.detail such as 2.05 Content, 4.04 Not Found, 5.00 Server Error</td></tr><tr><td>Reliability</td><td>CON is retransmitted until ACK: first timeout 2 to 3 s, doubled each time, up to 4 retries</td></tr><tr><td>Used for</td><td>Constrained IoT, LwM2M device management, Thread / Matter networks</td></tr></table></div><h3>How it works</h3><ul><li><strong>Message ID</strong> matches an ACK or RST to its message and detects duplicates; the <strong>token</strong> matches a response to its request.</li><li><strong>Piggybacked response:</strong> the ACK itself carries the answer. If the server needs time it sends an empty ACK first and the <strong>separate response</strong> later.</li><li><strong>Observe</strong> (RFC 7641): the client registers once and the server pushes a notification whenever the resource changes, like a light version of MQTT subscribe.</li><li><strong>Discovery:</strong> <code>GET /.well-known/core</code> returns the list of resources. <strong>Block-wise transfer</strong> (RFC 7959) splits large payloads.</li><li>Options carry the URI path, content format (for example CBOR or JSON) and more, encoded as small deltas.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 580 136" role="img" aria-label="CoAP message format" style="min-width:580px;max-width:580px"><text class="wl" x="8.0" y="14.0" text-anchor="start">CoAP message header (RFC 7252): 4 bytes + token + options + payload</text><rect class="wb " x="8" y="20" width="68" height="44" rx="4"/><text class="wf1" x="42.0" y="41.0" text-anchor="middle">Ver</text><text class="wf2" x="42.0" y="54.0" text-anchor="middle">2 bits</text><rect class="wb b" x="80" y="20" width="68" height="44" rx="4"/><text class="wf1" x="114.0" y="41.0" text-anchor="middle">T</text><text class="wf2" x="114.0" y="54.0" text-anchor="middle">2 bits</text><rect class="wb " x="152" y="20" width="92" height="44" rx="4"/><text class="wf1" x="198.0" y="41.0" text-anchor="middle">TKL</text><text class="wf2" x="198.0" y="54.0" text-anchor="middle">4 bits</text><rect class="wb b" x="248" y="20" width="128" height="44" rx="4"/><text class="wf1" x="312.0" y="41.0" text-anchor="middle">Code</text><text class="wf2" x="312.0" y="54.0" text-anchor="middle">8 bits</text><rect class="wb " x="380" y="20" width="188" height="44" rx="4"/><text class="wf1" x="474.0" y="41.0" text-anchor="middle">Message ID</text><text class="wf2" x="474.0" y="54.0" text-anchor="middle">16 bits</text><rect class="wb " x="8" y="78" width="140" height="44" rx="4"/><text class="wf1" x="78.0" y="99.0" text-anchor="middle">Token</text><text class="wf2" x="78.0" y="112.0" text-anchor="middle">0 to 8 B</text><rect class="wb b" x="152" y="78" width="152" height="44" rx="4"/><text class="wf1" x="228.0" y="99.0" text-anchor="middle">Options</text><text class="wf2" x="228.0" y="112.0" text-anchor="middle">Uri-Path ...</text><rect class="wb g" x="308" y="78" width="92" height="44" rx="4"/><text class="wf1" x="354.0" y="99.0" text-anchor="middle">0xFF</text><text class="wf2" x="354.0" y="112.0" text-anchor="middle">marker</text><rect class="wb " x="404" y="78" width="140" height="44" rx="4"/><text class="wf1" x="474.0" y="99.0" text-anchor="middle">Payload</text><text class="wf2" x="474.0" y="112.0" text-anchor="middle">if any</text></svg></div><figcaption>T: 0 = CON, 1 = NON, 2 = ACK, 3 = RST. Code 0.01 = GET, 2.05 = Content. The 0xFF byte separates options from the payload.</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 470 292" role="img" aria-label="CoAP request, retransmission and observe" style="min-width:470px;max-width:470px"><rect class="wb" x="40" y="6" width="120" height="26" rx="6"/><text class="wf1" x="100.0" y="23.0" text-anchor="middle">Client</text><line class="wlife" x1="100" x2="100" y1="32" y2="286"/><rect class="wb" x="310" y="6" width="120" height="26" rx="6"/><text class="wf1" x="370.0" y="23.0" text-anchor="middle">Server (sensor)</text><line class="wlife" x1="370" x2="370" y1="32" y2="286"/><line class="wa" x1="100" x2="262" y1="66" y2="66"/><text class="wl wh" x="270.0" y="70.0" text-anchor="middle">X</text><text class="wf1" x="235.0" y="60.0" text-anchor="middle">CON GET /temp</text><text class="wf2" x="235.0" y="79.0" text-anchor="middle">MID 0x7D34, token A1</text><rect class="wb b" x="58.2" y="88" width="353.6" height="24" rx="12"/><text class="wf1" x="235.0" y="104.0" text-anchor="middle">no ACK: wait about 2 to 3 s, retry (timeout doubles)</text><line class="wa" x1="100" x2="370" y1="142" y2="142"/><polygon class="wah" points="370,142 361,137.5 361,146.5"/><text class="wf1" x="235.0" y="136.0" text-anchor="middle">CON GET /temp (retry 1)</text><text class="wf2" x="235.0" y="155.0" text-anchor="middle">same MID 0x7D34</text><line class="wa r" x1="370" x2="100" y1="180" y2="180"/><polygon class="wah r" points="100,180 109,175.5 109,184.5"/><text class="wf1" x="235.0" y="174.0" text-anchor="middle">ACK 2.05 Content &quot;24.5&quot;</text><text class="wf2" x="235.0" y="193.0" text-anchor="middle">piggybacked, MID 0x7D34, token A1</text><line class="wa" x1="100" x2="370" y1="218" y2="218"/><polygon class="wah" points="370,218 361,213.5 361,222.5"/><text class="wf1" x="235.0" y="212.0" text-anchor="middle">CON GET /temp, Observe: 0</text><text class="wf2" x="235.0" y="231.0" text-anchor="middle">register for updates</text><line class="wa r" x1="370" x2="100" y1="256" y2="256"/><polygon class="wah r" points="100,256 109,251.5 109,260.5"/><text class="wf1" x="235.0" y="250.0" text-anchor="middle">NON 2.05 Content &quot;24.7&quot;</text><text class="wf2" x="235.0" y="269.0" text-anchor="middle">notification when the value changes</text></svg></div><figcaption>A lost request is retransmitted with the same Message ID; the answer is piggybacked on the ACK. Observe then streams updates.</figcaption></figure><h3>A message byte by byte</h3><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 636 82" role="img" aria-label="CoAP bytes" style="min-width:636px;max-width:636px"><text class="wl" x="8.0" y="14.0" text-anchor="start">CON GET /temp, Message ID 0x7D34, token A1: 10 bytes</text><rect class="wb " x="8" y="20" width="120" height="48" rx="4"/><text class="wf1" x="68.0" y="43.0" text-anchor="middle">0x41</text><text class="wf2" x="68.0" y="56.0" text-anchor="middle">Ver 01, CON, TKL 1</text><rect class="wb b" x="132" y="20" width="70.4" height="48" rx="4"/><text class="wf1" x="167.2" y="43.0" text-anchor="middle">0x01</text><text class="wf2" x="167.2" y="56.0" text-anchor="middle">GET</text><rect class="wb " x="206.4" y="20" width="95.2" height="48" rx="4"/><text class="wf1" x="254.0" y="43.0" text-anchor="middle">7D 34</text><text class="wf2" x="254.0" y="56.0" text-anchor="middle">Message ID</text><rect class="wb b" x="305.6" y="20" width="58" height="48" rx="4"/><text class="wf1" x="334.6" y="43.0" text-anchor="middle">A1</text><text class="wf2" x="334.6" y="56.0" text-anchor="middle">token</text><rect class="wb " x="367.6" y="20" width="132.4" height="48" rx="4"/><text class="wf1" x="433.8" y="43.0" text-anchor="middle">B4</text><text class="wf2" x="433.8" y="56.0" text-anchor="middle">Uri-Path, len 4</text><rect class="wb b" x="504" y="20" width="120" height="48" rx="4"/><text class="wf1" x="564.0" y="43.0" text-anchor="middle">74 65 6D 70</text><text class="wf2" x="564.0" y="56.0" text-anchor="middle">temp</text></svg></div><figcaption>The whole request is 10 bytes. The same request in HTTP is well over 100 bytes with headers.</figcaption></figure><h3>Codes, options and formats</h3><div class="tw"><table><tr><th>Code</th><th>Meaning</th><th>Nearest HTTP</th></tr><tr><td>0.01 to 0.04</td><td>GET, POST, PUT, DELETE</td><td>same</td></tr><tr><td>2.01 Created</td><td>resource created</td><td>201</td></tr><tr><td>2.02 Deleted</td><td>deleted</td><td>204</td></tr><tr><td>2.04 Changed</td><td>updated</td><td>204</td></tr><tr><td>2.05 Content</td><td>response with payload</td><td>200</td></tr><tr><td>4.04 Not Found</td><td>no such resource</td><td>404</td></tr><tr><td>4.05 Method Not Allowed</td><td>wrong method</td><td>405</td></tr><tr><td>5.00 Internal Server Error</td><td>server failure</td><td>500</td></tr></table></div><div class="tw"><table><tr><th>Option</th><th>Number</th><th>Use</th></tr><tr><td>Observe</td><td>6</td><td>Subscribe to changes</td></tr><tr><td>Uri-Path</td><td>11</td><td>One path segment per option</td></tr><tr><td>Content-Format</td><td>12</td><td>Payload type</td></tr><tr><td>Max-Age</td><td>14</td><td>How long a cached value is fresh</td></tr><tr><td>Uri-Query</td><td>15</td><td>Query parameter</td></tr><tr><td>Block2 / Block1</td><td>23 / 27</td><td>Block-wise transfer</td></tr><tr><td>ETag</td><td>4</td><td>Version tag for validation</td></tr></table></div><p>Content-Format IDs: 0 text/plain, 40 application/link-format, 42 octet-stream, 50 JSON, 60 CBOR (compact binary JSON).</p><h3>Reliability parameters</h3><ul><li>ACK_TIMEOUT 2 s, ACK_RANDOM_FACTOR 1.5, MAX_RETRANSMIT 4, NSTART 1 (one outstanding request per server).</li><li>The first timeout is random between 2 and 3 s, then it doubles: about 2 to 3 s, 4 to 6 s, 8 to 12 s, 16 to 24 s, so the sender gives up after about <strong>45 s</strong>.</li><li>NON messages are sent once with no retry, suitable for frequent readings where one lost value does not matter.</li></ul><h3>Security and extras</h3><ul><li><strong>CoAPS</strong> = CoAP over DTLS (UDP 5684) with pre-shared keys, raw public keys or certificates. <strong>OSCORE</strong> (RFC 8613) protects at the object level and survives proxies.</li><li><strong>CoAP over TCP and WebSockets</strong> (RFC 8323) helps where UDP is blocked. <strong>Multicast</strong> lets one request reach a whole group of devices.</li><li><strong>Resource directory</strong> and <code>/.well-known/core</code> help clients discover what a device offers. <strong>LwM2M</strong> builds device management on CoAP.</li><li>Try it with <code>coap-client -m get coap://192.168.1.60/temp</code> (libcoap) or the Copper add-on in Firefox-like tools.</li></ul><h3>Common problems</h3><ul><li>Firewalls and NAT often block UDP.</li><li>Reusing a Message ID too soon: the server treats the new request as a duplicate.</li><li>No built-in congestion control beyond the retransmission back-off.</li></ul><p><strong>Interview:</strong> CoAP vs MQTT? CoAP is request/response REST over UDP with optional observe; MQTT is broker-based publish/subscribe over TCP. CoAP suits very constrained links, MQTT suits many-to-many telemetry.</p><h1 id="part-c">Part C: Compare</h1><h2 id="comparison">14. Protocol Comparison and How to Choose</h2><p>Use this table for quick revision before an interview or when selecting a protocol.</p><div class="tw"><tabl
