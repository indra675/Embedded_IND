<h1 id="part-b-hands-on-programs">Part B: Hands-On Programs</h1>
<p>All code assumes <code>#include &quot;stm32f4xx.h&quot;</code> and the default 16 MHz clock. Bit position values are explained in comments. Check each register against your MCU reference manual.</p>
<h2 id="b1-project-setup-and-common-helpers">B1. Project Setup and Common Helpers</h2>
<p>Put these helpers in a shared header; later programs use them.</p>
<pre><code>#include &quot;stm32f4xx.h&quot;
#include &lt;stdint.h&gt;
#include &lt;stdbool.h&gt;
#include &lt;string.h&gt;</code></pre>
<pre><code>#define LED_PIN      5U                         /* PA5  */
#define LED_ON()     (GPIOA-&gt;BSRR = (1U &lt;&lt; LED_PIN))
#define LED_OFF()    (GPIOA-&gt;BSRR = (1U &lt;&lt; (LED_PIN + 16U)))
#define LED_TOGGLE() (GPIOA-&gt;ODR ^= (1U &lt;&lt; LED_PIN))</code></pre>
<pre><code>/* ----- 1 ms timebase using SysTick ----- */
static volatile uint32_t ms_ticks;</code></pre>
<pre><code>void SysTick_Handler(void) { ms_ticks++; }</code></pre>
<pre><code>static inline uint32_t millis(void) { return ms_ticks; }</code></pre>
<pre><code>void delay_ms(uint32_t d) {
    uint32_t start = millis();
    while ((uint32_t)(millis() - start) &lt; d) { }   /* safe across wrap-around */
}</code></pre>
<pre><code>void systick_init(void) {
    SysTick_Config(SystemCoreClock / 1000U);        /* 16 MHz / 1000 = 1 ms */
}</code></pre>
<ul>
<li><code>BSRR</code> writes are atomic: the lower 16 bits set pins, the upper 16 bits reset pins. No read-modify-write is needed.</li>
<li><code>SystemCoreClock</code> holds the CPU frequency (16000000 after reset). <code>SysTick_Config</code> also enables the SysTick interrupt.</li>
</ul>
<h2 id="b2-gpio-blink-led">B2. GPIO: Blink LED</h2>
<p><strong>Goal:</strong> configure a pin as output and toggle it. <strong>Concepts:</strong> enabling the peripheral clock, MODER fields, ODR vs BSRR.</p>
<pre><code>void led_init(void) {
    RCC-&gt;AHB1ENR |= RCC_AHB1ENR_GPIOAEN;           /* 1. clock for GPIOA        */
    GPIOA-&gt;MODER &amp;= ~(3U &lt;&lt; (LED_PIN * 2U));       /* 2. clear mode bits        */
    GPIOA-&gt;MODER |=  (1U &lt;&lt; (LED_PIN * 2U));       /*    01 = general output    */
    /* OTYPER default = push-pull, OSPEEDR default = low speed: fine for an LED */
}</code></pre>
<pre><code>int main(void) {
    systick_init();
    led_init();
    for (;;) {
        LED_TOGGLE();
        delay_ms(500);
    }
}</code></pre>
<ul>
<li>MODER uses two bits per pin: 00 input, 01 output, 10 alternate function, 11 analog.</li>
<li>Try: make the LED blink SOS in Morse; change to an external LED on another pin; blink at 5 Hz and verify the period with a logic analyzer.</li>
</ul>
<h2 id="b3-gpio-read-a-button-polling">B3. GPIO: Read a Button (polling)</h2>
<p><strong>Goal:</strong> LED follows the button. <strong>Concepts:</strong> input mode, IDR, active-low logic.</p>
<pre><code>void button_init(void) {
    RCC-&gt;AHB1ENR |= RCC_AHB1ENR_GPIOCEN;
    GPIOC-&gt;MODER &amp;= ~(3U &lt;&lt; (13U * 2U));          /* 00 = input                 */
    /* Nucleo has an external pull-up on PC13. For a plain pin enable one:
       GPIOC-&gt;PUPDR |= (1U &lt;&lt; (pin * 2U));  (01 = pull-up, 10 = pull-down)      */
}</code></pre>
<pre><code>static inline bool button_pressed(void) {
    return (GPIOC-&gt;IDR &amp; (1U &lt;&lt; 13U)) == 0U;      /* pressed = low              */
}</code></pre>
<pre><code>int main(void) {
    systick_init(); led_init(); button_init();
    for (;;) {
        if (button_pressed()) LED_ON(); else LED_OFF();
    }
}</code></pre>
<ul>
<li>A floating input reads random values. Always use a pull-up or pull-down (external or internal).</li>
<li>Try: toggle the LED on each press (detect the edge, not the level) and see how bouncing causes false toggles. This motivates B5.</li>
</ul>
<h2 id="b4-systick-millisecond-timebase-and-non-blocking-blink">B4. SysTick Millisecond Timebase and Non-Blocking Blink</h2>
<p><strong>Goal:</strong> run two periodic jobs without blocking delays. <strong>Concepts:</strong> free-running tick, wrap-safe comparison, cooperative scheduling.</p>
<pre><code>typedef struct {
    uint32_t period;
    uint32_t last;
    void (*run)(void);
} Job;</code></pre>
<pre><code>static void job_led(void)  { LED_TOGGLE(); }
static void job_heartbeat(void) { /* e.g. send &quot;alive&quot; over UART */ }</code></pre>
<pre><code>static Job jobs[] = {
    { 500U,  0U, job_led },
    { 2000U, 0U, job_heartbeat },
};</code></pre>
<pre><code>int main(void) {
    systick_init(); led_init();
    for (;;) {
        uint32_t now = millis();
        for (uint32_t i = 0; i &lt; sizeof jobs / sizeof jobs[0]; i++) {
            if ((uint32_t)(now - jobs[i].last) &gt;= jobs[i].period) {
                jobs[i].last += jobs[i].period;      /* keeps long-term accuracy */
                jobs[i].run();
            }
        }
    }
}</code></pre>
<ul>
<li>Using <code>last += period</code> instead of <code>last = now</code> avoids accumulating drift.</li>
<li>Each job must be short. A long job delays every other one: that is the limitation of a cooperative scheduler.</li>
</ul>
<h2 id="b5-external-interrupt-button-with-debounce">B5. External Interrupt (button) with Debounce</h2>
<p><strong>Goal:</strong> handle the button in an interrupt without bouncing. <strong>Concepts:</strong> EXTI, SYSCFG routing, NVIC, ISR flag handoff, debounce with time.</p>
<pre><code>static volatile bool button_event = false;
static volatile uint32_t last_press_ms = 0;</code></pre>
<pre><code>void button_irq_init(void) {
    RCC-&gt;AHB1ENR |= RCC_AHB1ENR_GPIOCEN;
    RCC-&gt;APB2ENR |= RCC_APB2ENR_SYSCFGEN;               /* needed for EXTI routing */</code></pre>
<pre><code>    GPIOC-&gt;MODER &amp;= ~(3U &lt;&lt; (13U * 2U));                /* PC13 input              */</code></pre>
<pre><code>    SYSCFG-&gt;EXTICR[3] &amp;= ~SYSCFG_EXTICR4_EXTI13;        /* EXTI13 &lt;- port C        */
    SYSCFG-&gt;EXTICR[3] |=  SYSCFG_EXTICR4_EXTI13_PC;</code></pre>
<pre><code>    EXTI-&gt;IMR  |= EXTI_IMR_MR13;                        /* unmask line 13          */
    EXTI-&gt;FTSR |= EXTI_FTSR_TR13;                       /* falling edge = press    */</code></pre>
<pre><code>    NVIC_SetPriority(EXTI15_10_IRQn, 2U);
    NVIC_EnableIRQ(EXTI15_10_IRQn);
}</code></pre>
<pre><code>void EXTI15_10_IRQHandler(void) {
    if (EXTI-&gt;PR &amp; EXTI_PR_PR13) {
        EXTI-&gt;PR = EXTI_PR_PR13;                        /* write 1 to clear flag   */
        uint32_t now = millis();
        if ((uint32_t)(now - last_press_ms) &gt; 50U) {    /* ignore bounces &lt; 50 ms  */
            last_press_ms = now;
            button_event = true;
        }
    }
}</code></pre>
<pre><code>int main(void) {
    systick_init(); led_init(); button_irq_init();
    for (;;) {
        if (button_event) {
            button_event = false;
            LED_TOGGLE();
        }
    }
}</code></pre>
<ul>
<li>The pending flag is write-1-to-clear. If you forget to clear it, the ISR fires continuously.</li>
<li>The ISR only sets a flag; the real work happens in main. This keeps the ISR short.</li>
<li>Try: count presses and print them over UART (after B8); add long-press detection using the press and release timestamps.</li>
</ul>
<h2 id="b6-timer-interrupt">B6. Timer Interrupt</h2>
<p><strong>Goal:</strong> toggle the LED exactly once per second from a hardware timer. <strong>Concepts:</strong> prescaler, auto-reload, update interrupt.</p>
<p>Calculation: timer clock 16 MHz, PSC = 15999 gives 1 kHz (1 ms per tick); ARR = 999 gives 1000 ticks = 1 second.</p>
<pre><code>void tim2_init(void) {
    RCC-&gt;APB1ENR |= RCC_APB1ENR_TIM2EN;
    TIM2-&gt;PSC  = 16000U - 1U;                 /* 16 MHz / 16000 = 1 kHz       */
    TIM2-&gt;ARR  = 1000U - 1U;                  /* 1000 ticks = 1 s             */
    TIM2-&gt;EGR  = TIM_EGR_UG;                  /* load prescaler/ARR now       */
    TIM2-&gt;SR   = 0U;                          /* clear flag caused by UG      */
    TIM2-&gt;DIER |= TIM_DIER_UIE;               /* update interrupt enable      */
    NVIC_EnableIRQ(TIM2_IRQn);
    TIM2-&gt;CR1  |= TIM_CR1_CEN;                /* start counting               */
}</code></pre>
<pre><code>void TIM2_IRQHandler(void) {
    if (TIM2-&gt;SR &amp; TIM_SR_UIF) {
        TIM2-&gt;SR &amp;= ~TIM_SR_UIF;              /* clear update flag            */
        LED_TOGGLE();
    }
}</code></pre>
<pre><code>int main(void) {
    led_init(); tim2_init();
    for (;;) { __WFI(); }                     /* sleep until the next interrupt */
}</code></pre>
<ul>
<li>Period = (PSC + 1) x (ARR + 1) / f_clk. Check with a logic analyzer.</li>
<li>Try: change the period at runtime from a button press; measure the ISR duration by toggling a second GPIO inside it.</li>
</ul>
<h2 id="b7-pwm-led-fade">B7. PWM: LED Fade</h2>
<p><strong>Goal:</strong> fade the on-board LED using PWM. <strong>Concepts:</strong> alternate function, output compare, duty cycle. PA5 is TIM2 channel 1 (alternate function 1).</p>
<pre><code>void pwm_init(void) {
    RCC-&gt;AHB1ENR |= RCC_AHB1ENR_GPIOAEN;
    RCC-&gt;APB1ENR |= RCC_APB1ENR_TIM2EN;</code></pre>
<pre><code>    GPIOA-&gt;MODER &amp;= ~(3U &lt;&lt; (5U * 2U));
    GPIOA-&gt;MODER |=  (2U &lt;&lt; (5U * 2U));       /* 10 = alternate function       */
    GPIOA-&gt;AFR[0] &amp;= ~(0xFU &lt;&lt; (5U * 4U));
    GPIOA-&gt;AFR[0] |=  (1U   &lt;&lt; (5U * 4U));    /* AF1 = TIM2_CH1                */</code></pre>
<pre><code>    TIM2-&gt;PSC   = 16U - 1U;                   /* 1 MHz timer clock             */
    TIM2-&gt;ARR   = 1000U - 1U;                 /* 1 kHz PWM frequency           */
    TIM2-&gt;CCMR1 = (6U &lt;&lt; 4) | (1U &lt;&lt; 3);      /* OC1M = 110 PWM mode 1, preload */
    TIM2-&gt;CCER |= TIM_CCER_CC1E;              /* enable channel 1 output       */
    TIM2-&gt;CR1  |= TIM_CR1_ARPE;
    TIM2-&gt;EGR   = TIM_EGR_UG;
    TIM2-&gt;CR1  |= TIM_CR1_CEN;
}</code></pre>
<pre><code>static inline void pwm_set_duty(uint16_t permille) {   /* 0..1000 */
    TIM2-&gt;CCR1 = permille;                     /* duty = CCR1 / (ARR + 1)       */
}</code></pre>
<pre><code>int main(void) {
    systick_init(); pwm_init();
    for (;;) {
        for (uint16_t d = 0; d &lt;= 1000; d += 5) { pwm_set_duty(d); delay_ms(5); }
        for (uint16_t d = 1000; d &gt; 0; d -= 5)  { pwm_set_duty(d); delay_ms(5); }
    }
}</code></pre>
<ul>
<li>Duty cycle = CCR / (ARR + 1). With ARR = 999, CCR = 250 gives 25 percent.</li>
<li>For a hobby servo use a 50 Hz period (20 ms) with a pulse of 1 to 2 ms: PSC = 15 (1 MHz), ARR = 19999, CCR = 1000 to 2000.</li>
<li>Human eyes see brightness non-linearly: a gamma lookup table makes fades look smoother.</li>
</ul>
<h2 id="b8-uart-transmit-echo-and-receive-interrupt">B8. UART: Transmit, Echo and Receive Interrupt</h2>
<p><strong>Goal:</strong> send text to the PC, echo typed characters, then receive with an interrupt and a ring buffer. Terminal: 115200, 8N1.</p>
<p>Baud calculation (oversampling by 16): USARTDIV = 16,000,000 / (16 x 115200) = 8.6806. Mantissa = 8, fraction = 0.6806 x 16 = 10.89, rounded to 11, so BRR = (8 &lt;&lt; 4) | 11 = 0x8B.</p>
<pre><code>void uart2_init(void) {
    RCC-&gt;AHB1ENR |= RCC_AHB1ENR_GPIOAEN;
    RCC-&gt;APB1ENR |= RCC_APB1ENR_USART2EN;</code></pre>
<pre><code>    /* PA2 = TX, PA3 = RX, alternate function 7 */
    GPIOA-&gt;MODER &amp;= ~((3U &lt;&lt; (2U * 2U)) | (3U &lt;&lt; (3U * 2U)));
    GPIOA-&gt;MODER |=  ((2U &lt;&lt; (2U * 2U)) | (2U &lt;&lt; (3U * 2U)));
    GPIOA-&gt;AFR[0] &amp;= ~((0xFU &lt;&lt; (2U * 4U)) | (0xFU &lt;&lt; (3U * 4U)));
    GPIOA-&gt;AFR[0] |=  ((7U   &lt;&lt; (2U * 4U)) | (7U   &lt;&lt; (3U * 4U)));</code></pre>
<pre><code>    USART2-&gt;BRR = 0x8BU;                                    /* 115200 @ 16 MHz */
    USART2-&gt;CR1 = USART_CR1_TE | USART_CR1_RE | USART_CR1_UE;
}</code></pre>
<pre><code>void uart_putc(char ch) {
    while (!(USART2-&gt;SR &amp; USART_SR_TXE)) { }                /* wait for empty  */
    USART2-&gt;DR = (uint8_t)ch;
}</code></pre>
<pre><code>void uart_puts(const char *s) { while (*s) uart_putc(*s++); }</code></pre>
<pre><code>void uart_put_u32(uint32_t v) {
    char buf[11]; int i = 0;
    if (v == 0U) { uart_putc(&#x27;0&#x27;); return; }
    while (v) { buf[i++] = (char)(&#x27;0&#x27; + v % 10U); v /= 10U; }
    while (i--) uart_putc(buf[i]);
}</code></pre>
<pre><code>/* Polling echo */
int main(void) {
    systick_init(); uart2_init();
    uart_puts(&quot;Hello from STM32\r\n&quot;);
    for (;;) {
        if (USART2-&gt;SR &amp; USART_SR_RXNE) {                   /* byte received   */
            uart_putc((char)USART2-&gt;DR);                    /* echo it back    */
        }
    }
}</code></pre>
<h3 id="receive-with-interrupt-and-ring-buffer">Receive with interrupt and ring buffer</h3>
<pre><code>#define RB_SIZE 64U                                         /* power of two    */
typedef struct {
    uint8_t buf[RB_SIZE];
    volatile uint16_t head, tail;
} RingBuf;</code></pre>
<pre><code>static RingBuf rx;</code></pre>
<pre><code>static int rb_put(RingBuf *rb, uint8_t v) {
    uint16_t next = (uint16_t)((rb-&gt;head + 1U) &amp; (RB_SIZE - 1U));
    if (next == rb-&gt;tail) return -1;                        /* full  */
    rb-&gt;buf[rb-&gt;head] = v; rb-&gt;head = next; return 0;
}</code></pre>
<pre><code>static int rb_get(RingBuf *rb, uint8_t *v) {
    if (rb-&gt;head == rb-&gt;tail) return -1;                    /* empty */
    *v = rb-&gt;buf[rb-&gt;tail];
    rb-&gt;tail = (uint16_t)((rb-&gt;tail + 1U) &amp; (RB_SIZE - 1U));
    return 0;
}</code></pre>
<pre><code>void uart2_rx_irq_enable(void) {
    USART2-&gt;CR1 |= USART_CR1_RXNEIE;                        /* interrupt on RXNE */
    NVIC_SetPriority(USART2_IRQn, 3U);
    NVIC_EnableIRQ(USART2_IRQn);
}</code></pre>
<pre><code>void USART2_IRQHandler(void) {
    if (USART2-&gt;SR &amp; USART_SR_RXNE) {
        uint8_t b = (uint8_t)USART2-&gt;DR;                    /* reading DR clears RXNE */
        (void)rb_put(&amp;rx, b);                               /* drop byte if full      */
    }
}</code></pre>
<ul>
<li>Reading <code>DR</code> clears the RXNE flag. Overrun errors (ORE) happen if bytes arrive faster than you read them.</li>
<li>The ring buffer has one producer (ISR) and one consumer (main), so it needs no lock. One slot is left empty to tell full from empty.</li>
<li>For transmit-heavy designs use a TX ring buffer with the TXE interrupt, or DMA.</li>
</ul>
<h2 id="b9-uart-command-shell">B9. UART Command Shell</h2>
<p><strong>Goal:</strong> type commands in a terminal to control the board: <code>led on</code>, <code>led off</code>, <code>adc</code> (after B10), <code>ticks</code>.</p>
<pre><code>static char    line[32];
static uint8_t line_len;</code></pre>
<pre><code>static void handle_command(const char *s) {
    if      (strcmp(s, &quot;led on&quot;)  == 0) { LED_ON();  uart_puts(&quot;OK\r\n&quot;); }
    else if (strcmp(s, &quot;led off&quot;) == 0) { LED_OFF(); uart_puts(&quot;OK\r\n&quot;); }
    else if (strcmp(s, &quot;ticks&quot;)   == 0) { uart_put_u32(millis()); uart_puts(&quot; ms\r\n&quot;); }
    else if (strcmp(s, &quot;adc&quot;)     == 0) { uart_put_u32(adc_read_mv()); uart_puts(&quot; mV\r\n&quot;); }
    else                                  { uart_puts(&quot;unknown command\r\n&quot;); }
}</code></pre>
<pre><code>void shell_poll(void) {
    uint8_t c;
    while (rb_get(&amp;rx, &amp;c) == 0) {
        if (c == &#x27;\r&#x27; || c == &#x27;\n&#x27;) {
            line[line_len] = &#x27;\0&#x27;;
            if (line_len) handle_command(line);
            line_len = 0;
            uart_puts(&quot;&gt; &quot;);
        } else if (line_len &lt; sizeof line - 1U) {
            line[line_len++] = (char)c;
            uart_putc((char)c);                             /* local echo */
        }                                                   /* else: ignore overflow */
    }
}</code></pre>
<pre><code>int main(void) {
    systick_init(); led_init(); uart2_init(); uart2_rx_irq_enable();
    uart_puts(&quot;Shell ready\r\n&gt; &quot;);
    for (;;) { shell_poll(); }
}</code></pre>
<ul>
<li>Never overflow the line buffer: check the length before every store.</li>
<li>Try: add a command table (name, handler function pointer), argument parsing (<code>pwm 250</code>), backspace handling, and help text.</li>
</ul>
<h2 id="b10-adc-read-a-potentiometer">B10. ADC: Read a Potentiometer</h2>
<p><strong>Goal:</strong> read PA0 (ADC1 channel 0) and convert to millivolts. Wire the potentiometer ends to 3.3 V and GND, and the wiper to PA0.</p>
<pre><code>void adc_init(void) {
    RCC-&gt;AHB1ENR |= RCC_AHB1ENR_GPIOAEN;
    RCC-&gt;APB2ENR |= RCC_APB2ENR_ADC1EN;</code></pre>
<pre><code>    GPIOA-&gt;MODER |= (3U &lt;&lt; (0U * 2U));         /* 11 = analog mode for PA0      */</code></pre>
<pre><code>    ADC1-&gt;SMPR2 = 7U;                          /* channel 0: longest sampling   */
    ADC1-&gt;SQR1  = 0U;                          /* 1 conversion in the sequence  */
    ADC1-&gt;SQR3  = 0U;                          /* first conversion = channel 0  */
    ADC1-&gt;CR2  |= ADC_CR2_ADON;                /* power on ADC                  */
}</code></pre>
<pre><code>uint16_t adc_read_raw(void) {
    ADC1-&gt;CR2 |= ADC_CR2_SWSTART;              /* start conversion              */
    while (!(ADC1-&gt;SR &amp; ADC_SR_EOC)) { }       /* wait end of conversion        */
    return (uint16_t)ADC1-&gt;DR;                 /* reading DR clears EOC         */
}</code></pre>
<pre><code>uint16_t adc_read_avg(uint8_t n) {             /* simple averaging              */
    uint32_t sum = 0;
    for (uint8_t i = 0; i &lt; n; i++) sum += adc_read_raw();
    return (uint16_t)(sum / n);
}</code></pre>
<pre><code>uint32_t adc_read_mv(void) {
    return ((uint32_t)adc_read_avg(16) * 3300U) / 4095U;   /* 12-bit, Vref 3.3 V */
}</code></pre>
<ul>
<li>12-bit ADC: 4096 levels, one step is about 0.8 mV at 3.3 V.</li>
<li>Use the largest sampling time for high-impedance sources such as a potentiometer. Add a small capacitor on the input to reduce noise.</li>
<li>Try: map the ADC value to PWM duty (B7) to make a dimmer; implement a moving-average filter (Part C3); log values over UART.</li>
</ul>
<h2 id="b11-spi-hardware-and-software">B11. SPI: Hardware and Software</h2>
<p><strong>Hardware SPI1 master</strong> (PA5 SCK, PA6 MISO, PA7 MOSI, alternate function 5; chip select on PB6 as a normal GPIO). On the Nucleo, PA5 is also the LED, so the LED will flicker: use SPI2 pins on PB13/PB14/PB15 (APB1) if that bothers you.</p>
<pre><code>void spi1_init(void) {
    RCC-&gt;AHB1ENR |= RCC_AHB1ENR_GPIOAEN | RCC_AHB1ENR_GPIOBEN;
    RCC-&gt;APB2ENR |= RCC_APB2ENR_SPI1EN;</code></pre>
<pre><code>    /* PA5, PA6, PA7 -&gt; alternate function 5 */
    GPIOA-&gt;MODER &amp;= ~((3U &lt;&lt; 10) | (3U &lt;&lt; 12) | (3U &lt;&lt; 14));
    GPIOA-&gt;MODER |=  ((2U &lt;&lt; 10) | (2U &lt;&lt; 12) | (2U &lt;&lt; 14));
    GPIOA-&gt;AFR[0] &amp;= ~((0xFU &lt;&lt; 20) | (0xFU &lt;&lt; 24) | (0xFU &lt;&lt; 28));
    GPIOA-&gt;AFR[0] |=  ((5U   &lt;&lt; 20) | (5U   &lt;&lt; 24) | (5U   &lt;&lt; 28));</code></pre>
<pre><code>    /* PB6 = chip select, output, idle high */
    GPIOB-&gt;MODER &amp;= ~(3U &lt;&lt; 12);  GPIOB-&gt;MODER |= (1U &lt;&lt; 12);
    GPIOB-&gt;BSRR = (1U &lt;&lt; 6);</code></pre>
<pre><code>    /* Master, software slave management, baud = fPCLK/16 = 1 MHz, mode 0 */
    SPI1-&gt;CR1 = SPI_CR1_MSTR | SPI_CR1_SSM | SPI_CR1_SSI | (3U &lt;&lt; 3);
    SPI1-&gt;CR1 |= SPI_CR1_SPE;                                 /* enable last */
}</code></pre>
<pre><code>uint8_t spi1_xfer(uint8_t tx) {
    while (!(SPI1-&gt;SR &amp; SPI_SR_TXE)) { }
    SPI1-&gt;DR = tx;
    while (!(SPI1-&gt;SR &amp; SPI_SR_RXNE)) { }
    return (uint8_t)SPI1-&gt;DR;
}</code></pre>
<pre><code>#define CS_LOW()   (GPIOB-&gt;BSRR = (1U &lt;&lt; (6U + 16U)))
#define CS_HIGH()  (GPIOB-&gt;BSRR = (1U &lt;&lt; 6U))</code></pre>
<pre><code>/* Example: read the JEDEC ID of an SPI flash (command 0x9F) */
void flash_read_id(uint8_t id[3]) {
    CS_LOW();
    (void)spi1_xfer(0x9F);
    id[0] = spi1_xfer(0xFF);
    id[1] = spi1_xfer(0xFF);
    id[2] = spi1_xfer(0xFF);
    while (SPI1-&gt;SR &amp; SPI_SR_BSY) { }                         /* wait until idle */
    CS_HIGH();
}</code></pre>
<p><strong>Software (bit-banged) SPI, mode 0</strong> works on any MCU; replace the macros with your GPIO operations.</p>
<pre><code>/* Provide: SCK_HIGH/LOW, MOSI_HIGH/LOW, MISO_READ, spi_delay() */
uint8_t soft_spi_xfer(uint8_t tx) {
    uint8_t rx = 0;
    for (int i = 7; i &gt;= 0; i--) {                 /* MSB first                    */
        if (tx &amp; (1U &lt;&lt; i)) MOSI_HIGH(); else MOSI_LOW();
        spi_delay();
        SCK_HIGH();                                /* rising edge: slave samples   */
        rx = (uint8_t)((rx &lt;&lt; 1) | (MISO_READ() ? 1U : 0U));
        spi_delay();
        SCK_LOW();                                 /* falling edge: next bit shifts */
    }
    return rx;
}</code></pre>
<ul>
<li>SPI is full duplex: every byte sent also receives a byte. To read, send a dummy byte (0xFF).</li>
<li>Mode (CPOL, CPHA) must match the device datasheet. Check clock polarity and sampling edge on a logic analyzer.</li>
<li>Always keep chip select high when idle and low only during a transaction.</li>
</ul>
<h2 id="b12-i2c-software-bit-banged-driver-and-sensor-read">B12. I2C: Software (Bit-Banged) Driver and Sensor Read</h2>
<p>A bit-banged I2C driver is a great way to understand the protocol and works on any MCU. Use two GPIO pins configured as open-drain with external 4.7 kOhm pull-ups to 3.3 V. Releasing a line means setting it high (the pull-up raises it); driving low pulls it down.</p>
<pre><code>/* Provide these for your pins (open-drain outputs, input readable):
   SDA_HIGH() SDA_LOW() SDA_READ()  SCL_HIGH() SCL_LOW()  i2c_delay()  */</code></pre>
<pre><code>static void i2c_start(void) {
    SDA_HIGH(); SCL_HIGH(); i2c_delay();
    SDA_LOW();  i2c_delay();                  /* SDA falls while SCL high = START */
    SCL_LOW();
}</code></pre>
<pre><code>static void i2c_stop(void) {
    SDA_LOW();  i2c_delay();
    SCL_HIGH(); i2c_delay();
    SDA_HIGH(); i2c_delay();                  /* SDA rises while SCL high = STOP  */
}</code></pre>
<pre><code>static bool i2c_write_byte(uint8_t b) {       /* returns true if slave ACKed      */
    for (int i = 7; i &gt;= 0; i--) {
        if (b &amp; (1U &lt;&lt; i)) SDA_HIGH(); else SDA_LOW();
        i2c_delay(); SCL_HIGH(); i2c_delay(); SCL_LOW();
    }
    SDA_HIGH();                               /* release SDA for the ACK bit      */
    i2c_delay(); SCL_HIGH(); i2c_delay();
    bool ack = (SDA_READ() == 0);             /* slave pulls SDA low to ACK       */
    SCL_LOW();
    return ack;
}</code></pre>
<pre><code>static uint8_t i2c_read_byte(bool ack) {
    uint8_t v = 0;
    SDA_HIGH();                               /* release SDA so slave can drive   */
    for (int i = 0; i &lt; 8; i++) {
        i2c_delay(); SCL_HIGH(); i2c_delay();
        v = (uint8_t)((v &lt;&lt; 1) | (SDA_READ() ? 1U : 0U));
        SCL_LOW();
    }
    if (ack) SDA_LOW(); else SDA_HIGH();      /* ACK to continue, NACK to end     */
    i2c_delay(); SCL_HIGH(); i2c_delay(); SCL_LOW();
    SDA_HIGH();
    return v;
}</code></pre>
<pre><code>/* Read one register: START, addr+W, reg, repeated START, addr+R, data, NACK, STOP */
bool i2c_read_reg(uint8_t addr7, uint8_t reg, uint8_t *out) {
    i2c_start();
    if (!i2c_write_byte((uint8_t)(addr7 &lt;&lt; 1)))      { i2c_stop(); return false; }
    if (!i2c_write_byte(reg))                        { i2c_stop(); return false; }
    i2c_start();                                     /* repeated start */
    if (!i2c_write_byte((uint8_t)((addr7 &lt;&lt; 1) | 1U))) { i2c_stop(); return false; }
    *out = i2c_read_byte(false);
    i2c_stop();
    return true;
}</code></pre>
<pre><code>/* Sensor check: MPU6050 at 7-bit address 0x68, WHO_AM_I register 0x75 returns 0x68 */
bool mpu_present(void) {
    uint8_t id = 0;
    return i2c_read_reg(0x68, 0x75, &amp;id) &amp;&amp; id == 0x68;
}</code></pre>
<ul>
<li>Frame order: START, 7-bit address plus R/W bit, ACK, data bytes with ACKs, STOP. The 7-bit address is shifted left by one before adding the R/W bit; many datasheets quote the 8-bit form, so check which one you are using.</li>
<li>If the bus hangs with SDA stuck low, toggle SCL up to nine times and send a STOP to release the slave.</li>
<li>Hardware I2C steps (instead of bit-banging): enable the GPIO and I2C clocks, set pins to alternate function open-drain with pull-ups, configure the peripheral clock and clock control registers (CCR/TRISE), enable the peripheral, then follow the START, address, data, STOP flag sequence. Many people use the vendor HAL for this after understanding the bit-banged version.</li>
<li>Always verify the first transaction with a logic analyzer protocol decoder.</li>
</ul>
<h2 id="b13-watchdog-and-low-power-sleep">B13. Watchdog and Low-Power Sleep</h2>
<h3 id="independent-watchdog-iwdg">Independent watchdog (IWDG)</h3>
<pre><code>void iwdg_init(void) {
    IWDG-&gt;KR  = 0x5555U;        /* unlock PR and RLR                            */
    IWDG-&gt;PR  = 3U;             /* prescaler /32: LSI (about 32 kHz) -&gt; 1 kHz   */
    IWDG-&gt;RLR = 1999U;          /* about 2 s timeout (LSI is only approximate)  */
    IWDG-&gt;KR  = 0xCCCCU;        /* start watchdog (cannot be stopped)           */
}
static inline void iwdg_kick(void) { IWDG-&gt;KR = 0xAAAAU; }</code></pre>
<pre><code>int main(void) {
    systick_init(); led_init(); iwdg_init();
    for (;;) {
        do_work();                       /* must finish well within 2 s         */
        iwdg_kick();                     /* only kick when the system is healthy */
    }
}</code></pre>
<ul>
<li>Test it: add an infinite loop that skips the kick and confirm the MCU resets. Read the reset flags in RCC-&gt;CSR to report &quot;watchdog reset&quot; at boot.</li>
<li>Kick from the main flow after checking that all critical tasks reported in, not from a timer ISR.</li>
</ul>
<h3 id="sleep-until-an-interrupt">Sleep until an interrupt</h3>
<pre><code>for (;;) {
    __WFI();                    /* CPU sleeps until any enabled interrupt       */
    process_events();           /* handle flags set by ISRs                     */
}</code></pre>
<ul>
<li>Lower power further by turning off unused peripheral clocks, reducing the clock speed, and using stop or standby modes with RTC or external pin wake-up (see the power chapter in the manual).</li>
</ul>
<h2 id="b14-freertos-tasks-queue-from-isr-mutex">B14. FreeRTOS: Tasks, Queue from ISR, Mutex</h2>
<pre><code>#include &quot;FreeRTOS.h&quot;
#include &quot;task.h&quot;
#include &quot;queue.h&quot;
#include &quot;semphr.h&quot;</code></pre>
<pre><code>static QueueHandle_t     rx_queue;
static SemaphoreHandle_t uart_mutex;</code></pre>
<pre><code>static void uart_print_safe(const char *s) {
    xSemaphoreTake(uart_mutex, portMAX_DELAY);       /* one task prints at a time */
    uart_puts(s);
    xSemaphoreGive(uart_mutex);
}</code></pre>
<pre><code>static void task_blink(void *arg) {
    (void)arg;
    for (;;) {
        LED_TOGGLE();
        vTaskDelay(pdMS_TO_TICKS(500));              /* blocks, lets others run   */
    }
}</code></pre>
<pre><code>static void task_rx(void *arg) {
    (void)arg;
    uint8_t b;
    for (;;) {
        if (xQueueReceive(rx_queue, &amp;b, portMAX_DELAY) == pdPASS) {
            uart_print_safe(&quot;got a byte\r\n&quot;);
        }
    }
}</code></pre>
<pre><code>void USART2_IRQHandler(void) {
    BaseType_t woken = pdFALSE;
    if (USART2-&gt;SR &amp; USART_SR_RXNE) {
        uint8_t b = (uint8_t)USART2-&gt;DR;
        xQueueSendFromISR(rx_queue, &amp;b, &amp;woken);     /* ISR-safe API only         */
    }
    portYIELD_FROM_ISR(woken);                       /* switch now if needed      */
}</code></pre>
<pre><code>int main(void) {
    __disable_irq();                                 /* stay quiet until the scheduler starts */
    NVIC_SetPriorityGrouping(0U);                    /* FreeRTOS wants all priority bits as preemption bits */
    led_init(); uart2_init();
    rx_queue   = xQueueCreate(32, sizeof(uint8_t)); /* create the queue BEFORE the RX interrupt can fire */
    uart_mutex = xSemaphoreCreateMutex();
    uart2_rx_irq_enable();
    NVIC_SetPriority(USART2_IRQn, 6U);               /* B8 used 3: too urgent for FromISR calls; use a value &gt;= configLIBRARY_MAX_SYSCALL_INTERRUPT_PRIORITY (5 in the CubeMX default) */</code></pre>
<pre><code>    xTaskCreate(task_blink, &quot;blink&quot;, 128, NULL, 1, NULL);
    xTaskCreate(task_rx,    &quot;rx&quot;,    256, NULL, 2, NULL);   /* higher priority    */
    vTaskStartScheduler();                           /* never returns             */
    for (;;) { }
}</code></pre>
<ul>
<li>Interrupts that call FreeRTOS &quot;FromISR&quot; functions must have a priority number that is not more urgent than <code>configMAX_SYSCALL_INTERRUPT_PRIORITY</code> (on Cortex-M a larger number is less urgent). The USART2 priority of 3 used in B8 is too urgent for FreeRTOS, so raise its number as shown above. Mistakes here cause random crashes.</li>
<li>Size each task stack with care (words, not bytes in FreeRTOS). Enable stack overflow checking during development.</li>
<li>Use queues to pass data, mutexes to protect shared resources, and binary semaphores to signal events from ISRs.</li>
<li>Try: add a third task that reads the ADC every 100 ms and sends results through a queue to a printing task; then deliberately create priority inversion and see how a mutex with priority inheritance helps.</li>
</ul>
<h2 id="b15-mini-project-sensor-logger-with-state-machine">B15. Mini Project: Sensor Logger with State Machine</h2>
<p>Combine everything: read the ADC every second, average it, log it over UART, and allow commands. A state machine controls the mode.</p>
<pre><code>typedef enum { ST_IDLE, ST_LOGGING, ST_ERROR } State;</code></pre>
<pre><code>static State state = ST_IDLE;
static uint32_t last_sample_ms;</code></pre>
<pre><code>static void on_command(const char *cmd) {
    if      (strcmp(cmd, &quot;start&quot;) == 0 &amp;&amp; state == ST_IDLE)    state = ST_LOGGING;
    else if (strcmp(cmd, &quot;stop&quot;)  == 0 &amp;&amp; state == ST_LOGGING) state = ST_IDLE;
    else if (strcmp(cmd, &quot;reset&quot;) == 0)                        state = ST_IDLE;
}</code></pre>
<pre><code>int main(void) {
    systick_init(); led_init(); uart2_init(); uart2_rx_irq_enable(); adc_init();
    iwdg_init();
    for (;;) {
        shell_poll();                                         /* parse commands    */
        switch (state) {
        case ST_IDLE:
            LED_OFF();
            break;
        case ST_LOGGING:
            if ((uint32_t)(millis() - last_sample_ms) &gt;= 1000U) {
                last_sample_ms += 1000U;
                uint32_t mv = adc_read_mv();
                uart_put_u32(millis()); uart_puts(&quot;,&quot;); uart_put_u32(mv); uart_puts(&quot;\r\n&quot;);
                LED_TOGGLE();
                if (mv &gt; 3200U) state = ST_ERROR;             /* out-of-range input */
            }
            break;
        case ST_ERROR:
            LED_ON();                                         /* solid LED = error  */
            break;
        }
        iwdg_kick();
    }
}</code></pre>
<ul>
<li>Extend: store the last 60 samples in a circular buffer and add a <code>dump</code> command; compute min, max and average; add a version string and a build timestamp; place calibration constants in a Flash page.</li>
</ul>

<h3 id="1-insert-a-value-into-a-bit-field">1. Insert a value into a bit field</h3>
<pre><code>uint32_t set_field(uint32_t reg, uint8_t pos, uint8_t width, uint32_t val) {
    uint32_t mask = ((1UL &lt;&lt; width) - 1UL) &lt;&lt; pos;

}</code></pre>

<pre><code>uint32_t swap_odd_even(uint32_t x) {

}</code></pre>
<h3 id="4-count-trailing-zeros-position-of-lowest-set-bit">4. Count trailing zeros (position of lowest set bit)</h3>
<pre><code>int ctz(uint32_t x) {
    if (x == 0) return 32;
    int n = 0;
    while (!(x &amp; 1U)) { x &gt;&gt;= 1; n++; }
    return n;               /* or use __builtin_ctz(x) on GCC */
}</code></pre>
<h3 id="5-round-up-to-the-next-power-of-two">5. Round up to the next power of two</h3>
<pre><code>uint32_t next_pow2(uint32_t x) {
    if (x == 0) return 1;
    x--;
    x |= x &gt;&gt; 1; x |= x &gt;&gt; 2; x |= x &gt;&gt; 4; x |= x &gt;&gt; 8; x |= x &gt;&gt; 16;
    return x + 1;
}</code></pre>
<h3 id="6-find-the-missing-number-1-n-1-with-one-missing-using-xor">6. Find the missing number (1..N+1 with one missing) using XOR</h3>
<pre><code>uint32_t missing(const uint32_t *a, uint32_t n) {   /* n elements, values 1..n+1 */
    uint32_t x = 0;
    for (uint32_t i = 1; i &lt;= n + 1; i++) x ^= i;
    for (uint32_t i = 0; i &lt; n; i++)      x ^= a[i];
    return x;
}</code></pre>
<h3 id="7-reverse-the-bits-of-a-32-bit-word">7. Reverse the bits of a 32-bit word</h3>
<pre><code>uint32_t rev32(uint32_t x) {
    x = ((x &gt;&gt; 1) &amp; 0x55555555UL) | ((x &amp; 0x55555555UL) &lt;&lt; 1);
    x = ((x &gt;&gt; 2) &amp; 0x33333333UL) | ((x &amp; 0x33333333UL) &lt;&lt; 2);
    x = ((x &gt;&gt; 4) &amp; 0x0F0F0F0FUL) | ((x &amp; 0x0F0F0F0FUL) &lt;&lt; 4);
    x = ((x &gt;&gt; 8) &amp; 0x00FF00FFUL) | ((x &amp; 0x00FF00FFUL) &lt;&lt; 8);

<h3 id="5-fixed-size-block-memory-pool-no-malloc">5. Fixed-size block memory pool (no malloc)</h3>
<pre><code>#define BLOCK_SIZE   32U             /* must be &gt;= sizeof(void *) */
#define BLOCK_COUNT  8U</code></pre>
<pre><code>static uint8_t pool[BLOCK_COUNT][BLOCK_SIZE] __attribute__((aligned(4)));
static void *free_list;</code></pre>
<pre><code>void pool_init(void) {
    free_list = NULL;
    for (uint32_t i = BLOCK_COUNT; i--; ) {
        *(void **)pool[i] = free_list;       /* store next pointer in the block */
        free_list = pool[i];
    }
}</code></pre>
<pre><code>void *pool_alloc(void) {
    void *p = free_list;
    if (p) free_list = *(void **)p;
    return p;                                /* NULL when exhausted             */
}</code></pre>
<pre><code>void pool_free(void *p) {
    *(void **)p = free_list;
    free_list = p;
}</code></pre>
<p>Allocation and free take constant time and cause no fragmentation. If used from several contexts, wrap alloc and free in a critical section.</p>
<h3 id="6-implement-itoa">6. Implement itoa</h3>
<pre><code>char *my_itoa(int32_t v, char *buf) {
    char tmp[12]; int i = 0, n = 0;
    uint32_t u = (v &lt; 0) ? (uint32_t)(-(int64_t)v) : (uint32_t)v;
    if (u == 0) tmp[i++] = &#x27;0&#x27;;
    while (u) { tmp[i++] = (char)(&#x27;0&#x27; + u % 10U); u /= 10U; }
    if (v &lt; 0) buf[n++] = &#x27;-&#x27;;
    while (i--) buf[n++] = tmp[i];
    buf[n] = &#x27;\0&#x27;;

}</code></pre>

<pre><code>Node *reverse(Node *h) {
    Node *prev = NULL;
    while (h) { Node *nx = h-&gt;next; h-&gt;next = prev; prev = h; h = nx; }

<h2 id="c3-embedded-design-problems">C3. Embedded Design Problems</h2>
<h3 id="1-moving-average-filter">1. Moving average filter</h3>
<pre><code>#define N 8U
typedef struct { uint16_t buf[N]; uint32_t sum; uint8_t idx, count; } MovAvg;</code></pre>
<pre><code>uint16_t movavg_update(MovAvg *m, uint16_t x) {
    m-&gt;sum -= m-&gt;buf[m-&gt;idx];                 /* remove oldest sample             */
    m-&gt;buf[m-&gt;idx] = x;
    m-&gt;sum += x;
    m-&gt;idx = (uint8_t)((m-&gt;idx + 1U) % N);
    if (m-&gt;count &lt; N) m-&gt;count++;
    return (uint16_t)(m-&gt;sum / m-&gt;count);
}</code></pre>
<h3 id="2-software-timers-with-callbacks">2. Software timers with callbacks</h3>
<pre><code>typedef struct {

    bool     repeat, active;
    void   (*cb)(void);
} SwTimer;</code></pre>
<pre><code>void swtimer_poll(SwTimer *t, uint32_t now) {
    if (!t-&gt;active) return;
    if ((uint32_t)(now - t-&gt;last) &gt;= t-&gt;period) {
        t-&gt;last += t-&gt;period;
        if (!t-&gt;repeat) t-&gt;active = false;
        t-&gt;cb();

}</code></pre>
<h3 id="3-parse-a-uart-frame-with-a-state-machine">3. Parse a UART frame with a state machine</h3>
<p>Frame format: start byte 0xAA, length byte (payload size), payload bytes, checksum (XOR of length and all payload bytes).</p>
<pre><code>typedef enum { S_START, S_LEN, S_DATA, S_CHK } PState;</code></pre>
<pre><code>typedef struct {
    PState  st;
    uint8_t len, idx, chk;
    uint8_t data[32];
} Parser;</code></pre>
<pre><code>/* returns true when a complete, valid frame is in p-&gt;data[0..len-1] */
bool parser_feed(Parser *p, uint8_t b) {
    switch (p-&gt;st) {
    case S_START:
        if (b == 0xAAU) p-&gt;st = S_LEN;
        break;
    case S_LEN:
        /* reject bad length */
        if (b == 0U || b &gt; sizeof p-&gt;data) { p-&gt;st = S_START; break; }
        p-&gt;len = b; p-&gt;idx = 0; p-&gt;chk = b; p-&gt;st = S_DATA;
        break;
    case S_DATA:
        p-&gt;data[p-&gt;idx++] = b;
        p-&gt;chk ^= b;
        if (p-&gt;idx == p-&gt;len) p-&gt;st = S_CHK;
        break;
    case S_CHK:
        p-&gt;st = S_START;
        return (b == p-&gt;chk);
    }
    return false;
}</code></pre>
<p>Points interviewers like: resynchronize on errors, bound-check the length, do not block, and process one byte at a time so it works from an ISR or a DMA buffer.</p>
<h3 id="4-switch-debounce-with-a-shift-register">4. Switch debounce with a shift register</h3>
<pre><code>/* call every 1 ms with the raw pin state */
bool debounce(bool raw) {
    static uint8_t hist = 0;
    static bool state = false;
    hist = (uint8_t)((hist &lt;&lt; 1) | (raw ? 1U : 0U));
    if (hist == 0xFFU) state = true;          /* 8 consecutive ones  */
    else if (hist == 0x00U) state = false;    /* 8 consecutive zeros */
    return state;
}</code></pre>
<h3 id="5-safely-share-a-32-bit-counter-between-isr-and-main-on-an-8-16-bit-mcu">5. Safely share a 32-bit counter between ISR and main on an 8/16-bit MCU</h3>
<pre><code>static volatile uint32_t counter;             /* incremented in an ISR            */</code></pre>
<pre><code>uint32_t counter_read(void) {
    uint32_t v;
    uint32_t pm = __get_PRIMASK();            /* AVR: save SREG instead           */
    __disable_irq();
    v = counter;                              /* multi-byte read is not atomic    */
    __set_PRIMASK(pm);
    return v;
}</code></pre>
<p>Alternative without disabling interrupts: read twice until both reads are equal.</p>
<h3 id="6-average-adc-samples-without-overflow">6. Average ADC samples without overflow</h3>
<pre><code>uint16_t avg_u16(const uint16_t *a, uint32_t n) {
    uint32_t sum = 0;                         /* 32-bit accumulator avoids overflow */
    for (uint32_t i = 0; i &lt; n; i++) sum += a[i];
    return (uint16_t)(sum / n);
}</code></pre>
<h3 id="7-crc-16-ccitt-polynomial-0x1021">7. CRC-16 (CCITT, polynomial 0x1021)</h3>
<pre><code>uint16_t crc16_ccitt(const uint8_t *d, size_t n) {
    uint16_t crc = 0xFFFFU;
    while (n--) {
        crc ^= (uint16_t)(*d++) &lt;&lt; 8;
        for (int i = 0; i &lt; 8; i++)
            crc = (crc &amp; 0x8000U) ? (uint16_t)((crc &lt;&lt; 1) ^ 0x1021U) : (uint16_t)(crc &lt;&lt; 1);
    }
    return crc;
}</code></pre>
<h2 id="c4-predict-the-output">C4. Predict the Output</h2>
<div class="tw"><table><tr><th><strong>Snippet</strong></th><th><strong>Answer and reason</strong></th></tr><tr><td><code>uint8_t x = 255; x++;</code></td><td>x becomes 0 (unsigned wrap-around)</td></tr><tr><td><code>unsigned i = 3; if (i - 5 &gt; 0)</code></td><td>True: i - 5 wraps to a huge unsigned value</td></tr><tr><td><code>#define SQ(x) x*x</code> then <code>SQ(2+3)</code></td><td>11, because it expands to 2+3*2+3</td></tr><tr><td><code>-1 &gt; 1U</code></td><td>True: -1 converts to unsigned (4294967295)</td></tr><tr><td><code>sizeof(&#x27;a&#x27;)</code> in C</td><td>4 (character constants are int in C; 1 in C++)</td></tr><tr><td><code>int a = 5; a = a++ + ++a;</code></td><td>Undefined behavior (unsequenced modifications)</td></tr><tr><td><code>printf(&quot;%d %d&quot;, 5/2, -5/2)</code></td><td>2 and -2 (integer division truncates toward zero)</td></tr><tr><td><code>-5 % 2</code></td><td>-1 (sign follows the dividend)</td></tr><tr><td><code>0.1 + 0.2 == 0.3</code></td><td>False (binary floating-point rounding)</td></tr><tr><td><code>uint8_t a = 200, b = 100; a + b &gt; 255</code></td><td>True: promoted to int, sum is 300</td></tr><tr><td><code>uint16_t x = 0xFFFF; (x + 1)</code></td><td>65536 (int). Only 0 if stored back into a uint16_t</td></tr><tr><td><code>char s[] = &quot;hi&quot;; sizeof(s) and strlen(s)</code></td><td>3 and 2 (sizeof counts the null terminator)</td></tr><tr><td><code>void f(int a[10]) { sizeof(a); }</code></td><td>Size of a pointer (4 or 8), not 40</td></tr><tr><td><code>char *p = &quot;abc&quot;; p[0] = &#x27;x&#x27;;</code></td><td>Undefined behavior: string literal is read-only</td></tr><tr><td><code>int x = 7; x &lt;&lt; 33;</code></td><td>Undefined behavior: shift count at least the type width</td></tr><tr><td><code>(int8_t)200</code> (on typical compilers)</td><td>-56 (implementation-defined conversion)</td></tr><tr><td><code>volatile int v; int a = v + v;</code></td><td>Two separate reads of v are performed</td></tr></table></div>
<h2 id="c5-how-to-approach-a-coding-round">C5. How to Approach a Coding Round</h2>
<ul>
<li>Restate the problem and confirm input ranges, types, and whether it runs in an ISR, on a tiny MCU, or with an OS.</li>
<li>Ask about constraints: no malloc, limited RAM, no floating point, thread safety.</li>
<li>State your plan before coding. Write clean C with fixed-width types and clear names.</li>
<li>Handle edge cases out loud: zero length, NULL pointers, buffer full or empty, wrap-around, overflow.</li>
<li>Test with a small example by hand, including at least one edge case.</li>
<li>Explain complexity and memory use. Mention how you would test it on hardware (logic analyzer, unit tests on PC).</li>
<li>If you get stuck, talk through what you know and try a simpler version first. Interviewers value reasoning as much as the final answer.</li>
<li>Be ready to explain every line of anything on your resume. Bring one project you can explain end to end: hardware, firmware architecture, a bug you debugged, and what you learned.</li>
</ul></template>

<template id="book-web"><p><strong>HTML and CSS From Zero</strong></p>
<p>Structure and style of web pages</p>
<p><em>Start here if you know nothing. Every idea has an everyday example.</em></p>
<h2 id="web-history">1. Who Invented the Web, HTML and CSS, and Why</h2>
<p><strong>The Internet and the Web are not the same thing.</strong> The Internet is the <em>road network</em>: cables and rules (TCP/IP) that move data between computers. The Web is the <em>shops on those roads</em>: pages you can open and link together. The road existed for 20 years before the shops.</p>
<p><strong>The problem (1989):</strong> Tim Berners-Lee, a British engineer at CERN (Switzerland), watched scientists lose documents because every computer stored files differently and each needed its own program. He combined two old ideas, <em>hypertext</em> (text with clickable links) and the <em>Internet</em>, and invented three things that still run the web today: <strong>URL</strong> (an address for a page), <strong>HTTP</strong> (how a browser asks for it) and <strong>HTML</strong> (how the page is written).</p>
<p><strong>Why CSS came later:</strong> Early HTML mixed meaning and looks, with tags like <code>&lt;font color=red&gt;</code> repeated on every line. Changing the colour of a 100-page site meant editing 100 pages. In 1994 Håkon Wium Lie (also at CERN) proposed <strong>CSS</strong> so that one file could control the look of every page. HTML says <em>what</em> it is, CSS says <em>how it looks</em>.</p>
<div class="tw"><table><tr><th>Year</th><th>Event</th><th>Who</th></tr>
<tr><td>1969</td><td>ARPANET sends its first message (the seed of the Internet)</td><td>UCLA to Stanford Research Institute</td></tr>
<tr><td>1983</td><td>TCP/IP becomes the standard language of the network</td><td>ARPANET engineers</td></tr>
<tr><td>1989</td><td>Proposal for a linked information system</td><td>Tim Berners-Lee, CERN</td></tr>
<tr><td>1990</td><td>First browser (WorldWideWeb) and first web server</td><td>Tim Berners-Lee</td></tr>
<tr><td>1991</td><td>First website goes public; HTML described with about 18 tags</td><td>Tim Berners-Lee</td></tr>
<tr><td>1993</td><td>Mosaic, the first popular browser showing images inline</td><td>Marc Andreessen, Eric Bina (NCSA)</td></tr>
<tr><td>1994</td><td>W3C founded to keep web standards; CSS proposed</td><td>Berners-Lee; Håkon Wium Lie</td></tr>
<tr><td>1995</td><td>HTML 2.0, the first official HTML standard</td><td>IETF</td></tr>
<tr><td>1996</td><td>CSS Level 1</td><td>W3C</td></tr>
<tr><td>1997</td><td>HTML 4 (forms, tables, style hooks)</td><td>W3C</td></tr>
<tr><td>2014</td><td>HTML5 becomes an official recommendation (video, canvas, no plug-ins)</td><td>W3C / WHATWG</td></tr>
<tr><td>2017</td><td>CSS Grid works in all major browsers</td><td>Browser makers</td></tr>
</table></div>
<p><strong>Remember:</strong> the web was <em>given away free</em>. CERN released the technology royalty-free in 1993, which is a big reason it spread.</p>
<h2 id="how-web-works">2. How a Web Page Works</h2>
<p>Think of a web page as a <strong>house</strong>. <strong>HTML</strong> is the walls and rooms (structure). <strong>CSS</strong> is the paint and furniture (looks). <strong>JavaScript</strong> is the electricity (things that move and react). The <strong>browser</strong> (Chrome, Edge) reads your files and builds the house on screen.</p>
<div class="tw"><table><tr><th>Language</th><th>Job</th><th>Example</th></tr>
<tr><td>HTML</td><td>Says what is on the page</td><td>A heading, a button, an image</td></tr>
<tr><td>CSS</td><td>Says how it looks</td><td>Red text, centered layout</td></tr>
<tr><td>JavaScript</td><td>Says what it does</td><td>Show a message when a button is clicked</td></tr>
</table></div>
<p>To try anything below: save the code in a file named <code>index.html</code> and double-click it. No installation needed.</p>
<h2 id="html-skeleton">3. HTML Skeleton and Common Tags</h2>
<p>HTML uses <strong>tags</strong> in pairs: an opening tag, content, a closing tag. Tags can sit inside other tags, like boxes inside boxes.</p>
<pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;utf-8&quot;&gt;
  &lt;title&gt;My First Page&lt;/title&gt;   &lt;!-- text on the browser tab --&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello, IoT!&lt;/h1&gt;            &lt;!-- biggest heading --&gt;
  &lt;p&gt;This is a paragraph.&lt;/p&gt;
  &lt;a href=&quot;https://example.com&quot;&gt;A link&lt;/a&gt;
  &lt;img src=&quot;photo.jpg&quot; alt=&quot;A photo&quot;&gt;
  &lt;ul&gt;&lt;li&gt;Item 1&lt;/li&gt;&lt;li&gt;Item 2&lt;/li&gt;&lt;/ul&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
<div class="tw"><table><tr><th>Tag</th><th>Meaning</th></tr>
<tr><td>&lt;h1&gt; to &lt;h6&gt;</td><td>Headings, big to small</td></tr>
<tr><td>&lt;p&gt;</td><td>Paragraph</td></tr>
<tr><td>&lt;a href&gt;</td><td>Link</td></tr>
<tr><td>&lt;img&gt;</td><td>Image (no closing tag)</td></tr>
<tr><td>&lt;ul&gt; / &lt;ol&gt; / &lt;li&gt;</td><td>Bullet list / numbered list / item</td></tr>
<tr><td>&lt;div&gt;</td><td>Generic box to group things</td></tr>
<tr><td>&lt;table&gt;</td><td>Rows and columns of data</td></tr>
</table></div>
<h2 id="forms">4. Forms and Buttons</h2>
<p>Forms collect input. This is how you would type a Wi-Fi name or a sensor limit into an IoT dashboard.</p>
<pre><code>&lt;label&gt;Name &lt;input id=&quot;nm&quot; type=&quot;text&quot; placeholder=&quot;Your name&quot;&gt;&lt;/label&gt;
&lt;label&gt;Limit &lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot;&gt;&lt;/label&gt;
&lt;select&gt;&lt;option&gt;Fan&lt;/option&gt;&lt;option&gt;Light&lt;/option&gt;&lt;/select&gt;
&lt;button id=&quot;go&quot;&gt;Send&lt;/button&gt;</code></pre>
<h2 id="css-basics">5. CSS Basics: Selectors and the Box Model</h2>
<p>A CSS rule has a <strong>selector</strong> (who to style) and <strong>declarations</strong> (what to change).</p>
<pre><code>h1 { color: tomato; font-size: 32px; }   /* every h1 */
.card { background: #eee; padding: 16px; } /* class: &lt;div class=&quot;card&quot;&gt; */
#title { text-align: center; }             /* id:    &lt;h1 id=&quot;title&quot;&gt; */
button:hover { background: orange; }       /* when mouse is over */</code></pre>
<p>Every element is a box with four layers. Picture a <strong>framed photo</strong>: the photo is the <em>content</em>, the white border inside the frame is <em>padding</em>, the frame itself is the <em>border</em>, and the gap to the next frame on the wall is the <em>margin</em>.</p>
<pre><code>.card {
  padding: 16px;            /* inside space */
  border: 2px solid navy;
  margin: 12px;             /* outside space */
  border-radius: 12px;
}
* { box-sizing: border-box; }  /* makes width include padding: saves headaches */</code></pre>
<h2 id="layout">6. Layout: Flexbox and Grid</h2>
<p><strong>Flexbox</strong> lines items up in a row or column (like books on a shelf). <strong>Grid</strong> makes rows and columns together (like an egg tray).</p>
<pre><code>.row  { display: flex; gap: 12px; justify-content: space-between; align-items: center; }
.cards{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 600px) {          /* phone screens */
  .cards { grid-template-columns: 1fr; }
}</code></pre>
<p>The <code>@media</code> block is how one page works on both a phone and a laptop. This is called <strong>responsive design</strong>.</p>
<h2 id="link-css-js">7. Putting HTML, CSS and JS Together</h2>
<pre><code>&lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;   &lt;!-- in &lt;head&gt; --&gt;
&lt;script src=&quot;app.js&quot;&gt;&lt;/script&gt;              &lt;!-- just before &lt;/body&gt; --&gt;</code></pre>
<p>Real projects keep three files: <code>index.html</code>, <code>style.css</code>, <code>app.js</code>. This site puts all three in one file for easy hosting, but the ideas are the same.</p>
<h2 id="web-under-hood">8. Under the Hood: What Happens When You Open a Page</h2>
<p>You type <code>https://example.com</code> and press Enter. In under a second this happens:</p>
<div class="tw"><table><tr><th>Step</th><th>What happens</th><th>Everyday analogy</th></tr>
<tr><td>1. DNS lookup</td><td>Browser asks a DNS server for the number (IP address) behind the name</td><td>Looking up a shop in a phone book</td></tr>
<tr><td>2. TCP connection</td><td>Browser opens a reliable channel to that IP</td><td>Dialling and the shop picking up</td></tr>
<tr><td>3. TLS handshake (https)</td><td>Both sides agree on a secret key so nobody can listen</td><td>Agreeing on a secret code</td></tr>
<tr><td>4. HTTP request</td><td>Browser asks for the page</td><td>Placing your order</td></tr>
<tr><td>5. HTTP response</td><td>Server sends HTML (status 200 means OK)</td><td>The shop hands over the parcel</td></tr>
<tr><td>6. Parse and build</td><td>HTML becomes the DOM tree, CSS becomes style rules</td><td>Reading the plan and the paint list</td></tr>
<tr><td>7. Layout and paint</td><td>Browser works out sizes and positions, then draws pixels</td><td>Building and painting the house</td></tr>
<tr><td>8. Run JavaScript</td><td>Scripts run and may change the page</td><td>Switching on the electricity</td></tr>
</table></div>
<pre><code>GET / HTTP/1.1                 &lt;- request line: method, path, version
Host: example.com              &lt;- which website on this server
Accept: text/html

HTTP/1.1 200 OK                &lt;- response: 200 = success, 404 = not found, 500 = server error
Content-Type: text/html

&lt;!DOCTYPE html&gt;&lt;html&gt;...&lt;/html&gt;</code></pre>
<p><strong>Why the browser loads CSS first:</strong> without styles it would draw the page, then redraw it. Put CSS in <code>&lt;head&gt;</code> and JS at the end of <code>&lt;body&gt;</code> so the page appears quickly.</p>

<template id="book-js"><p><strong>JavaScript From Zero</strong></p>
<p>Make pages react, talk to servers, and show IoT data</p>
<p><em>Start here if you know nothing. Every idea has an everyday example.</em></p>
<h2 id="js-history">1. Who Invented JavaScript, and Why</h2>
<p><strong>The problem (1995):</strong> Early web pages were <em>static</em> like a printed poster. Even checking that a form field was filled needed a round trip to the server over a slow dial-up line. Netscape, the biggest browser company, wanted a small language that web designers (not only programmers) could use inside the browser.</p>
<p><strong>The invention:</strong> In May 1995 <strong>Brendan Eich</strong> built the first version at Netscape in about <strong>10 days</strong>. It was called <em>Mocha</em>, then <em>LiveScript</em>, then renamed <strong>JavaScript</strong> because Java was the famous language at the time. <strong>JavaScript has nothing to do with Java.</strong> They are different languages, like "car" and "carpet".</p>
<p><strong>Standardising:</strong> Microsoft copied it as JScript, and the two versions behaved differently. In 1997 the language was standardised by ECMA as <strong>ECMAScript</strong> (ES), so every browser follows the same rules. When someone says "ES6", they mean the 2015 version.</p>
<div class="tw"><table><tr><th>Year</th><th>Event</th><th>Who / what</th></tr>
<tr><td>1995</td><td>JavaScript created in about 10 days</td><td>Brendan Eich, Netscape</td></tr>
<tr><td>1997</td><td>ECMAScript 1 standard (ECMA-262)</td><td>ECMA</td></tr>
<tr><td>1999</td><td>XMLHttpRequest lets a page fetch data without reloading</td><td>Microsoft (Outlook Web Access)</td></tr>
<tr><td>2001</td><td>JSON data format described and promoted</td><td>Douglas Crockford</td></tr>
<tr><td>2005</td><td>The name AJAX is coined; Gmail and Maps show the idea</td><td>Jesse James Garrett</td></tr>
<tr><td>2006</td><td>jQuery makes browser code easier</td><td>John Resig</td></tr>
<tr><td>2008</td><td>V8, a very fast JS engine, ships in Chrome</td><td>Google</td></tr>
<tr><td>2009</td><td>Node.js: JavaScript runs on servers; ES5 released</td><td>Ryan Dahl</td></tr>
<tr><td>2015</td><td>ES6/ES2015: let, const, arrow functions, classes, promises</td><td>ECMA</td></tr>
<tr><td>2017</td><td>async/await arrives (ES2017)</td><td>ECMA</td></tr>
</table></div>
<p><strong>Why it matters for IoT:</strong> Node.js (2009) put the same language on both the browser and the server, so one person can build a whole dashboard: page, server and device data, all in JavaScript.</p>
<h2 id="js-intro">2. What JavaScript Is and Variables</h2>
<p>JavaScript runs inside the browser and also on servers (Node.js). A <strong>variable</strong> is a labelled box that holds a value. Use <code>const</code> if the value will not change, <code>let</code> if it will.</p>
<pre><code>const name = &quot;Indra&quot;;     // text (string)
let temp = 28.5;          // number
let fanOn = false;        // true / false (boolean)
const pins = [4, 5, 18];  // array: a list
const sensor = { id: &quot;dht11&quot;, pin: 4 };  // object: named fields
console.log(name, temp);  // print in browser console (F12)</code></pre>
<h2 id="js-logic">3. Decisions and Loops</h2>
<pre><code>if (temp &gt; 30) {
  console.log(&quot;Too hot&quot;);
} else if (temp &gt; 25) {
  console.log(&quot;Warm&quot;);
} else {
  console.log(&quot;Fine&quot;);
}
for (let i = 0; i &lt; 3; i++) console.log(&quot;Reading&quot;, i);
pins.forEach(p =&gt; console.log(&quot;pin&quot;, p));</code></pre>
<p>Same idea as C: <code>if</code>, <code>for</code>, <code>while</code>. Big difference: JS has no types to declare, and use <code>===</code> (strict equal) instead of <code>==</code>.</p>
<h2 id="js-functions">4. Functions, Arrays and Objects</h2>
<pre><code>function toF(c) { return c * 9 / 5 + 32; }
const toK = c =&gt; c + 273.15;          // arrow function, short form
const temps = [22, 30, 27];
const hot = temps.filter(t =&gt; t &gt; 25);   // [30, 27]
const f   = temps.map(toF);              // convert every item
console.log(sensor.id, sensor[&quot;pin&quot;]);</code></pre>
<h2 id="dom">5. The DOM: Changing the Page with JavaScript</h2>
<p>The browser turns your HTML into a tree of objects called the <strong>DOM</strong>. JS can find an element, change it, and react to <strong>events</strong> (click, typing, timers).</p>
<pre><code>&lt;h1 id=&quot;temp&quot;&gt;--&lt;/h1&gt;
&lt;button id=&quot;btn&quot;&gt;Refresh&lt;/button&gt;
&lt;script&gt;
  const out = document.getElementById(&quot;temp&quot;);
  document.getElementById(&quot;btn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    out.textContent = (20 + Math.random() * 10).toFixed(1) + &quot; °C&quot;;
    out.style.color = &quot;tomato&quot;;
  });
&lt;/script&gt;</code></pre>
<p>This is a fake sensor display. In a real IoT dashboard the number would come from your ESP32 instead of <code>Math.random()</code>.</p>
<h2 id="fetch">6. fetch, JSON and async/await</h2>
<p><strong>JSON</strong> is the text format devices and servers use to swap data, like <code>{"temp":27.4,"fan":true}</code>. <code>fetch</code> asks a server for data. It takes time, so we <code>await</code> the answer (like waiting for a parcel without freezing the whole house).</p>
<pre><code>async function load() {
  try {
    const r = await fetch(&quot;/api/data&quot;);       // GET request
    const d = await r.json();                 // text -&gt; object
    document.getElementById(&quot;temp&quot;).textContent = d.temp;
  } catch (e) { console.log(&quot;Network error&quot;, e); }
}
setInterval(load, 2000);                      // repeat every 2 seconds

await fetch(&quot;/api/fan&quot;, {                     // send data (POST)
  method: &quot;POST&quot;,
  headers: { &quot;Content-Type&quot;: &quot;application/json&quot; },
  body: JSON.stringify({ on: true })
});</code></pre>
<h2 id="node-server">7. A Tiny Node.js Server</h2>
<p>Node.js lets JavaScript run on a computer as a server. A server waits for requests and sends back answers. This is the same pattern your ESP32 uses when it hosts a web page.</p>
<pre><code>const http = require(&quot;http&quot;);
http.createServer((req, res) =&gt; {
  if (req.url === &quot;/api/data&quot;) {
    res.writeHead(200, { &quot;Content-Type&quot;: &quot;application/json&quot; });
    res.end(JSON.stringify({ temp: 27.4 }));
  } else {
    res.writeHead(404); res.end(&quot;Not found&quot;);
  }
}).listen(3000);   // run: node server.js, open http://localhost:3000/api/data</code></pre>
<h2 id="js-under-hood">8. Under the Hood: How JavaScript Actually Runs</h2>
<p>A JavaScript <strong>engine</strong> (Chrome and Node use <strong>V8</strong>) reads your text, turns it into machine code and runs it. JS is <strong>single-threaded</strong>: it does one thing at a time. Imagine <strong>one cook</strong> with a stack of order tickets. Slow jobs (timers, network, button clicks) are handed to helpers outside the kitchen. When a helper finishes, the result waits in a queue and the cook picks it up only when the current job is done. The cook checking the queue again and again is the <strong>event loop</strong>.</p>
<pre><code>console.log(1);
setTimeout(() =&gt; console.log(2), 0);        // helper: put in the task queue
Promise.resolve().then(() =&gt; console.log(3)); // promise queue: runs before timers
console.log(4);
// Output: 1 4 3 2</code></pre>
<ul>
<li><strong>Call stack:</strong> where the cook is working right now.</li>
<li><strong>Web APIs:</strong> helpers (timers, fetch, DOM events) provided by the browser, not by JS itself.</li>
<li><strong>Queues:</strong> finished work waiting its turn. Promises (<code>await</code>) get a faster line than timers.</li>
<li><strong>Lesson:</strong> never write a loop that runs for seconds, because the whole page freezes while the cook is busy.</li>
</ul>

<template id="book-iot"><p><strong>IoT From Zero</strong></p>
<p>Sensors, networks, MQTT, ESP boards and dashboards</p>
<p><em>Start here if you know nothing. Every idea has an everyday example.</em></p>
<h2 id="iot-history">1. Who Invented IoT and Its Building Blocks, and Why</h2>
<p><strong>The idea:</strong> Computers first connected to people, then to each other (Internet), and finally to <em>things</em>. IoT is not one invention but several pieces that became cheap enough at the same time: small chips, Wi-Fi, and cloud servers.</p>
<p><strong>The first connected "thing" (early 1980s):</strong> Programmers at Carnegie Mellon University were tired of walking to a Coke machine only to find it empty or the bottles warm. They wired its lights to a computer so they could check the stock and temperature over the network from their desks. That is IoT in its simplest form: <em>sense, send, check remotely</em>.</p>
<p><strong>The name (1999):</strong> Kevin Ashton, a Procter and Gamble manager who co-founded the MIT Auto-ID Center to work on RFID tags and supply chains, used the phrase <strong>"Internet of Things"</strong> in a presentation. His point: computers knew only what humans typed in, so let the things report for themselves.</p>
<p><strong>MQTT (1999):</strong> Andy Stanford-Clark (IBM) and Arlen Nipper invented it to monitor oil pipelines over slow, expensive satellite links, so it had to be tiny and power-saving. That is exactly why sensors love it today.</p>

<p><strong>Why the ESP chips changed everything:</strong> before 2014 adding Wi-Fi to a project cost thousands of rupees. Espressif made a Wi-Fi microcontroller for the price of a coffee, so students and small companies could build IoT products.</p>
<h2 id="iot-what">2. What IoT Is</h2>
<p><strong>Internet of Things</strong> means everyday objects with a small computer and a network connection, so they can send data or take commands. Think of a <strong>smart bin</strong> that tells you when it is full. Every IoT system has four layers:</p>
<div class="tw"><table><tr><th>Layer</th><th>Job</th><th>Your examples</th></tr>
<tr><td>1. Sense / Act</td><td>Measure the world, or move something</td><td>DHT11, MQ-135, soil probe, relay, servo</td></tr>
<tr><td>2. Device</td><td>Small computer that reads and decides</td><td>ESP8266, ESP32, Arduino</td></tr>
<tr><td>3. Network</td><td>Carries data</td><td>Wi-Fi, Bluetooth, LoRa, MQTT / HTTP</td></tr>
<tr><td>4. Cloud + App</td><td>Stores, shows, alerts</td><td>Blynk, Supabase, web dashboard, Telegram bot</td></tr>
</table></div>
<h2 id="sensors">3. Sensors and Actuators</h2>
<p>A <strong>sensor</strong> is an input (ears and eyes). An <strong>actuator</strong> is an output (hands and voice).</p>
<div class="tw"><table><tr><th>Type</th><th>Examples</th><th>Signal</th></tr>
<tr><td>Digital sensor</td><td>IR obstacle, PIR motion, button</td><td>HIGH / LOW</td></tr>
<tr><td>Analog sensor</td><td>Soil moisture, MQ-135, LDR</td><td>Voltage 0 to 3.3 V, read by ADC</td></tr>
<tr><td>Bus sensor</td><td>DHT11 (single-wire), BMP280 (I2C)</td><td>Digital data frames</td></tr>
<tr><td>Actuator</td><td>LED, buzzer, relay, servo, pump</td><td>You write HIGH / LOW or PWM</td></tr>
</table></div>
<p><strong>Important:</strong> ESP boards use 3.3 V logic. A relay or pump needs its own supply and a driver (relay module, L298), never power it straight from a GPIO pin.</p>
<h2 id="connectivity">4. Connectivity Options</h2>
<div class="tw"><table><tr><th>Tech</th><th>Range</th><th>Speed</th><th>Power</th><th>Best for</th></tr>
<tr><td>Wi-Fi</td><td>~50 m</td><td>High</td><td>High</td><td>Dashboards at home, campus</td></tr>
<tr><td>Bluetooth LE</td><td>~10 to 50 m</td><td>Low</td><td>Very low</td><td>Phone to wearable</td></tr>
<tr><td>Zigbee</td><td>~10 to 100 m mesh</td><td>Low</td><td>Low</td><td>Smart home sensors</td></tr>
<tr><td>LoRa</td><td>2 to 15 km</td><td>Very low</td><td>Very low</td><td>Farms, water meters</td></tr>

</table></div>
<h2 id="iot-protocols">5. HTTP vs MQTT</h2>
<p><strong>HTTP</strong> is ask and answer: the device asks the server, the server replies, like phoning a shop each time. <strong>MQTT</strong> is publish and subscribe: devices drop messages on a <em>topic</em> at a broker, and anyone subscribed gets them, like a notice board you subscribe to. It is light and ideal for sensors.</p>
<div class="tw"><table><tr><th></th><th>HTTP</th><th>MQTT</th></tr>
<tr><td>Style</td><td>Request / response</td><td>Publish / subscribe</td></tr>
<tr><td>Connection</td><td>Opens and closes</td><td>Stays open</td></tr>
<tr><td>Overhead</td><td>Heavy headers</td><td>Tiny packets</td></tr>
<tr><td>Push to device</td><td>Hard (device must poll)</td><td>Easy (subscribe)</td></tr>
<tr><td>Typical use</td><td>REST APIs, web pages</td><td>Sensors, commands</td></tr>
</table></div>
<pre><code>Topic    : home/room1/temp        &lt;- device publishes &quot;27.4&quot;
Topic    : home/room1/fan/set     &lt;- device subscribes, gets &quot;ON&quot;
QoS 0/1/2: at most once / at least once / exactly once</code></pre>
<h2 id="esp-http">6. ESP8266/ESP32: Read a Sensor and Send It</h2>
<p>Steps: connect to Wi-Fi, read the sensor, send JSON to a server, repeat. This sketch posts a reading every 10 seconds (ESP32 shown; for ESP8266 use <code>ESP8266WiFi.h</code> and <code>ESP8266HTTPClient.h</code>).</p>
<pre><code>#include &lt;WiFi.h&gt;
#include &lt;HTTPClient.h&gt;

const char* ssid = &quot;YOUR_WIFI&quot;;
const char* pass = &quot;YOUR_PASSWORD&quot;;
const char* url  = &quot;http://YOUR_SERVER:3000/api/data&quot;;

void setup() {
  Serial.begin(115200);
  WiFi.begin(ssid, pass);
  while (WiFi.status() != WL_CONNECTED) { delay(500); Serial.print(&quot;.&quot;); }
  Serial.println(&quot;\nConnected&quot;);
}

void loop() {
  int raw = analogRead(34);                 // soil sensor on GPIO34
  String json = &quot;{\&quot;moisture\&quot;:&quot; + String(raw) + &quot;}&quot;;
  HTTPClient http;
  http.begin(url);
  http.addHeader(&quot;Content-Type&quot;, &quot;application/json&quot;);
  int code = http.POST(json);               // 200 means OK
  Serial.println(code);
  http.end();
  delay(10000);                             // wait 10 s
}</code></pre>
<p>Connect it to the web side: your Node server receives this POST, stores it, and your HTML page fetches and shows it. That is a full IoT system.</p>
<h2 id="iot-cloud">7. Dashboards, Security and Power</h2>
<ul>
<li><strong>Dashboards:</strong> Blynk (easiest), Supabase or Firebase (database + live updates), your own Node page, Telegram bot for alerts.</li>
<li><strong>Security:</strong> never hard-code real passwords in code you upload to GitHub. Use HTTPS or MQTT over TLS, change default passwords, and give each device its own key.</li>
<li><strong>Power:</strong> Wi-Fi uses lots of power. For battery devices, read, send, then use <code>deep sleep</code> (ESP32 can sleep at microamps) and wake on a timer.</li>
<li><strong>Reliability:</strong> retry when Wi-Fi drops, use a watchdog timer, and timestamp your data.</li>
</ul>
<h2 id="iot-interview">8. IoT Interview Questions</h2>
<ul>
<li><strong>What is IoT?</strong> Connected devices that sense, send data over a network and can be controlled remotely.</li>
<li><strong>Why MQTT over HTTP?</strong> Smaller packets, persistent connection, easy push to devices, works on weak networks.</li>
<li><strong>Wi-Fi vs LoRa?</strong> Wi-Fi is fast but short range and power hungry. LoRa is slow but travels kilometers on tiny power.</li>
<li><strong>What does an ADC do?</strong> Converts an analog voltage to a number (ESP32: 12-bit, 0 to 4095).</li>
<li><strong>How do you save battery?</strong> Deep sleep, send less often, turn off radios and sensors between readings.</li>
<li><strong>How do you secure a device?</strong> Unique credentials, TLS, no secrets in public code, signed firmware updates.</li>
</ul>
<h2 id="iot-under-hood">9. Under the Hood: The Journey of One Sensor Reading</h2>
<p>Follow one soil-moisture reading from the dirt to your phone:</p>
<div class="tw"><table><tr><th>Step</th><th>What happens</th></tr>
<tr><td>1. Sensor</td><td>Moisture changes the probe resistance, so the output voltage changes (say 1.8 V)</td></tr>
<tr><td>2. ADC</td><td>The ESP32 converts the voltage to a number: 12-bit means 0 to 4095</td></tr>
<tr><td>3. Code</td><td>Your program turns the number into JSON: <code>{"moisture":2230}</code></td></tr>
<tr><td>4. Wi-Fi join</td><td>The radio finds the router (SSID), proves the password (WPA2 handshake) and DHCP gives the board an IP address</td></tr>
<tr><td>5. DNS + TCP</td><td>The board looks up the server name and opens a connection</td></tr>
<tr><td>6. Send</td><td>HTTP POST or MQTT publish carries the JSON in small packets</td></tr>
<tr><td>7. Server</td><td>Stores it in a database and may trigger an alert (Telegram message)</td></tr>
<tr><td>8. Dashboard</td><td>The browser page fetches the latest value and updates the chart</td></tr>
</table></div>
<pre><code>int raw = analogRead(34);            // 0..4095 on ESP32
float volts = raw * 3.3 / 4095.0;      // convert to volts
int percent = map(raw, 3200, 1200, 0, 100); // calibrate: dry=3200, wet=1200
percent = constrain(percent, 0, 100);</code></pre>
<p><strong>Why calibrate?</strong> Every probe and soil is different. Measure the number in dry air and in a glass of water, then map those two points to 0% and 100%.</p>
