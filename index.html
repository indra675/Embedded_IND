<template id="book-rtos"><p><strong>RTOS From Basic to Advanced</strong></p>
<p>Real-time operating systems with FreeRTOS on ESP32</p>
<p><em>History, tasks, scheduling, queues, semaphores, interrupts, problems and a project</em></p>
<h2 id="rtos-history">1. Who Invented RTOS, and Why</h2>
<p><strong>The problem:</strong> Some machines must react within a fixed time or something breaks: an airbag, a pacemaker, a rocket. A normal program loop cannot promise that. Engineers needed software that <em>shares one processor between many jobs and always runs the most urgent job first</em>.</p>
<p><strong>First famous case, Apollo 11 (1969):</strong> The Apollo Guidance Computer, built at the MIT Instrumentation Lab, ran a priority-based "Executive". During the Moon landing it was overloaded and raised the 1201/1202 alarms. Because of priorities, it dropped low-priority work and kept the landing tasks running. That is an RTOS idea saving a mission.</p>
<p><strong>Theory:</strong> In 1973 C. L. Liu and James Layland published <strong>Rate-Monotonic Scheduling</strong>, the maths that proves when tasks will meet deadlines. In 1990 Sha, Rajkumar and Lehoczky published <strong>priority inheritance</strong>, the fix for priority inversion.</p>
<div class="tw"><table><tr><th>Year</th><th>Event</th><th>Who</th></tr>
<tr><td>1969</td><td>Priority-based Executive on Apollo Guidance Computer</td><td>MIT Instrumentation Lab</td></tr>
<tr><td>1973</td><td>Rate-Monotonic and EDF scheduling theory</td><td>Liu and Layland</td></tr>
<tr><td>1987</td><td>VxWorks released (later on Mars rovers)</td><td>Wind River</td></tr>
<tr><td>1990</td><td>Priority inheritance and ceiling protocols</td><td>Sha, Rajkumar, Lehoczky</td></tr>
<tr><td>1991</td><td>uC/OS, a small RTOS for microcontrollers</td><td>Jean Labrosse</td></tr>
<tr><td>1997</td><td>Mars Pathfinder resets from priority inversion, fixed remotely</td><td>NASA JPL</td></tr>
<tr><td>2003</td><td>FreeRTOS created; Amazon takes stewardship in 2017 (MIT licence)</td><td>Richard Barry</td></tr>
<tr><td>2016</td><td>Zephyr RTOS (Linux Foundation)</td><td>Linux Foundation, Wind River code</td></tr>
<tr><td>Today</td><td>ESP32 runs FreeRTOS underneath your Arduino code</td><td>Espressif</td></tr>
</table></div>
<h2 id="rtos-basics">2. Basics: What an RTOS Is</h2>
<p><strong>Bare-metal</strong> means one big <code>while(1)</code> loop doing everything in order, like <strong>one cook</strong> making one dish at a time. An <strong>RTOS</strong> is a <strong>kitchen manager</strong>: many cooks (tasks), each with a priority, and the manager (the <em>scheduler</em>) decides who uses the stove (the CPU) right now.</p>
<p><strong>Real-time does not mean fast.</strong> It means <em>predictable</em>: the answer must arrive before its <strong>deadline</strong>, every time.</p>
<div class="tw"><table><tr><th>Type</th><th>If the deadline is missed</th><th>Example</th></tr>
<tr><td>Hard real-time</td><td>System failure or danger</td><td>Airbag, pacemaker, ABS brakes</td></tr>
<tr><td>Firm real-time</td><td>Result is useless, but no disaster</td><td>Video frame, sensor sample</td></tr>
<tr><td>Soft real-time</td><td>Quality drops</td><td>Audio buffer, web dashboard update</td></tr>
</table></div>
<div class="tw"><table><tr><th></th><th>Super loop (bare-metal)</th><th>RTOS</th></tr>
<tr><td>Structure</td><td>One loop plus interrupts</td><td>Independent tasks</td></tr>
<tr><td>Timing</td><td>Depends on the slowest step</td><td>Controlled by priority and delay</td></tr>
<tr><td>Adding a feature</td><td>Can break timing of others</td><td>Add a new task</td></tr>
<tr><td>Cost</td><td>Lowest: no kernel, one shared stack</td><td>Kernel about 5 to 10 KB of Flash, plus a stack and TCB in RAM for every task</td></tr>
<tr><td>Best for</td><td>Very simple devices</td><td>Wi-Fi, sensors, UI and control together</td></tr>
</table></div>
<h2 id="rtos-tasks">3. Tasks and the Task States</h2>
<p>A <strong>task</strong> is a function that never returns, with its own <strong>stack</strong> (private memory) and a <strong>Task Control Block</strong> (TCB, its ID card with priority, state and saved registers). The kernel keeps each task in one of four states:</p>
<div class="tw"><table><tr><th>State</th><th>Meaning</th><th>Analogy</th></tr>
<tr><td>Running</td><td>Using the CPU now (one per core)</td><td>Cook at the stove</td></tr>
<tr><td>Ready</td><td>Wants the CPU, waiting its turn</td><td>Cook in the queue</td></tr>
<tr><td>Blocked</td><td>Waiting for time, a message or a semaphore</td><td>Cook waiting for the oven timer</td></tr>
<tr><td>Suspended</td><td>Paused until someone resumes it</td><td>Cook sent home</td></tr>
</table></div>
<p>A <strong>context switch</strong> saves the running task registers and loads the next ones. The CPU then continues the new task as if it never left. Done fast enough, it feels like everything runs at once.</p>
<pre><code>// ESP32 (Arduino core): two independent blinkers
void blinkTask(void *pv) {
  int pin = (int)(intptr_t)pv;           // parameter passed at creation
  pinMode(pin, OUTPUT);
  for (;;) {                             // a task never returns
    digitalWrite(pin, !digitalRead(pin));
    vTaskDelay(pdMS_TO_TICKS(500));      // BLOCK for 500 ms, CPU is free
  }
}
void setup() {
  //            function   name   stack(bytes) param       priority handle
  xTaskCreate(blinkTask, &quot;LED1&quot;, 2048, (void*)2, 1, NULL);
  xTaskCreate(blinkTask, &quot;LED2&quot;, 2048, (void*)4, 1, NULL);
}
void loop() {}</code></pre>
<h2 id="rtos-sched">4. Scheduling</h2>
<p>The <strong>scheduler</strong> runs at every <strong>tick</strong> (a timer interrupt, usually 1 ms) and whenever a task blocks or wakes. FreeRTOS rule: <strong>a higher priority number wins</strong>, and the <em>Idle task</em> (priority 0) runs when nobody else wants the CPU.</p>
<div class="tw"><table><tr><th>Method</th><th>Rule</th><th>Note</th></tr>
<tr><td>Preemptive priority</td><td>Higher priority task interrupts a lower one instantly</td><td>Default; gives fast response</td></tr>
<tr><td>Round robin (time slice)</td><td>Equal priority tasks take turns each tick</td><td>Fairness among equals</td></tr>
<tr><td>Cooperative</td><td>A task runs until it yields</td><td>Simple, but one greedy task blocks all</td></tr>
<tr><td>Rate Monotonic (RMS)</td><td>Shorter period gets higher priority</td><td>Safe if CPU use is below about 69% (n to infinity)</td></tr>
<tr><td>EDF</td><td>Earliest deadline runs first</td><td>Up to 100% use, harder to build</td></tr>
</table></div>
<p><strong>Rule of thumb:</strong> tasks that touch hardware or have tight deadlines get higher priority; tasks that wait on the network or the display get lower. A task that never blocks and has high priority starves everyone below it.</p>
<h2 id="rtos-time">5. Timing: Delays and Periodic Tasks</h2>
<p><code>vTaskDelay(100)</code> waits 100 ticks <em>after</em> your work, so the period drifts by the work time. <code>vTaskDelayUntil</code> keeps an exact period, like a metronome.</p>
<pre><code>TickType_t last = xTaskGetTickCount();
for (;;) {
  readSensorAndControl();                 // takes a few ms
  vTaskDelayUntil(&amp;last, pdMS_TO_TICKS(10)); // exactly every 10 ms
}</code></pre>
<p>Never use <code>delay()</code> busy-waiting in an RTOS task if you can block instead. Blocking hands the CPU to others. For timed callbacks without a task, use <strong>software timers</strong> (<code>xTimerCreate</code>).</p>
<h2 id="rtos-ipc">6. Communication and Synchronisation</h2>
<p>Tasks must not fight over shared variables. The RTOS gives safe tools:</p>
<div class="tw"><table><tr><th>Tool</th><th>Use it for</th><th>Analogy</th></tr>
<tr><td>Queue</td><td>Pass data between tasks (copy, FIFO)</td><td>Conveyor belt between cooks</td></tr>
<tr><td>Binary semaphore</td><td>Signal "event happened", often from an ISR</td><td>Doorbell</td></tr>
<tr><td>Counting semaphore</td><td>Count events or limit resources</td><td>Tokens for 3 free tables</td></tr>
<tr><td>Mutex</td><td>Protect a shared resource (one user at a time)</td><td>Bathroom key, with priority inheritance</td></tr>
<tr><td>Event group</td><td>Wait for several flags (bits) together</td><td>Checklist of ready items</td></tr>
<tr><td>Task notification</td><td>Fastest 1-to-1 signal, no object needed</td><td>Tap on the shoulder</td></tr>
</table></div>
<pre><code>QueueHandle_t q;
void producer(void *p) {
  for (;;) {
    int v = analogRead(34);
    xQueueSend(q, &amp;v, portMAX_DELAY);       // copies v into the queue
    vTaskDelay(pdMS_TO_TICKS(1000));
  }
}
void consumer(void *p) {
  int v;
  for (;;)
    if (xQueueReceive(q, &amp;v, portMAX_DELAY) == pdPASS)   // sleeps until data
      Serial.println(v);
}
void setup() {
  Serial.begin(115200);
  q = xQueueCreate(10, sizeof(int));        // 10 items
  xTaskCreate(producer, &quot;prod&quot;, 2048, NULL, 1, NULL);
  xTaskCreate(consumer, &quot;cons&quot;, 3072, NULL, 2, NULL);
}
void loop() {}</code></pre>
<pre><code>SemaphoreHandle_t m = xSemaphoreCreateMutex();
if (xSemaphoreTake(m, pdMS_TO_TICKS(100)) == pdTRUE) {  // wait up to 100 ms
  Serial.println(&quot;only one task prints at a time&quot;);
  xSemaphoreGive(m);                                     // always give back
}</code></pre>
<h2 id="rtos-isr">7. Interrupts and the ISR Rule</h2>
<p>An <strong>ISR</strong> must be tiny. Do the minimum, then <strong>wake a task</strong> to do the real work (this is called <em>deferred processing</em>). Inside an ISR you may only call functions ending in <code>FromISR</code>.</p>
<pre><code>SemaphoreHandle_t btnSem;
void IRAM_ATTR onButton() {                     // ISR: runs in microseconds
  BaseType_t hp = pdFALSE;
  xSemaphoreGiveFromISR(btnSem, &amp;hp);           // wake the task
  if (hp) portYIELD_FROM_ISR();                 // switch right away if it is more urgent
}
void ledTask(void *p) {
  for (;;)
    if (xSemaphoreTake(btnSem, portMAX_DELAY) == pdTRUE)
      digitalWrite(2, !digitalRead(2));         // heavy work lives in the task
}
void setup() {
  btnSem = xSemaphoreCreateBinary();
  pinMode(0, INPUT_PULLUP); pinMode(2, OUTPUT);
  attachInterrupt(0, onButton, FALLING);
  xTaskCreate(ledTask, &quot;led&quot;, 2048, NULL, 3, NULL);
}
void loop() {}</code></pre>
<h2 id="rtos-problems">8. Classic Problems and Fixes</h2>
<div class="tw"><table><tr><th>Problem</th><th>What happens</th><th>Fix</th></tr>
<tr><td>Race condition</td><td>Two tasks change the same variable and the result depends on timing</td><td>Mutex, queue, or only one owner task</td></tr>
<tr><td>Deadlock</td><td>Task A holds lock 1 and waits for 2, task B holds 2 and waits for 1</td><td>Always take locks in the same order; use timeouts</td></tr>
<tr><td>Priority inversion</td><td>Low task holds a mutex, high task waits, a medium task keeps preempting the low one</td><td>Mutex with priority inheritance (FreeRTOS mutexes have it, binary semaphores do not)</td></tr>
<tr><td>Starvation</td><td>A high-priority task never blocks, lower tasks never run</td><td>Make every task block or delay</td></tr>
<tr><td>Stack overflow</td><td>A task uses more stack than given and corrupts memory</td><td>Measure with the high-water mark; enable overflow checking</td></tr>
</table></div>
<p><strong>Deadlock needs all four:</strong> mutual exclusion, hold and wait, no preemption, circular wait. Remove any one and it cannot happen.</p>
<p><strong>Mars Pathfinder (1997):</strong> a low-priority weather task held a mutex, a medium task preempted it, and the high-priority bus task waited so long that a watchdog reset the computer again and again. NASA engineers enabled priority inheritance with a command sent from Earth and the problem was fixed.</p>
<h2 id="rtos-memory">9. Memory, Stack Sizing and Debugging</h2>
<ul>
<li><strong>Stack size:</strong> on ESP32 the number you pass to <code>xTaskCreate</code> is in <strong>bytes</strong>; in vanilla FreeRTOS it is in <strong>words</strong> (4 bytes on ARM Cortex-M).</li>
<li><strong>Measure, do not guess:</strong> <code>uxTaskGetStackHighWaterMark(NULL)</code> returns how much stack was never used. Keep a safety margin.</li>
<li><strong>Heap:</strong> FreeRTOS offers heap_1 to heap_5: heap_1 is the simplest and never frees, heap_4 and heap_5 merge neighbouring free blocks to limit fragmentation, and heap_5 can span several memory regions. In safety projects use <em>static allocation</em> (<code>xTaskCreateStatic</code>) so memory is fixed at build time.</li>
<li><strong>Avoid</strong> <code>malloc</code>/<code>String</code> inside fast loops; they cause fragmentation and unpredictable timing.</li>
<li><strong>Watchdog:</strong> a task that hangs gets caught by the task watchdog; feed it only from healthy code.</li>
</ul>
<pre><code>void monitor(void *p) {
  for (;;) {
    Serial.printf(&quot;stack left: %u bytes, free heap: %u\n&quot;,
                  uxTaskGetStackHighWaterMark(NULL), ESP.getFreeHeap());
    vTaskDelay(pdMS_TO_TICKS(5000));
  }
}</code></pre>
<h2 id="rtos-advanced">10. Advanced Topics</h2>
<ul>
<li><strong>Dual core (ESP32):</strong> <code>xTaskCreatePinnedToCore(fn,"name",4096,NULL,1,NULL,1)</code> pins a task to core 0 or 1. Wi-Fi runs on core 0, your Arduino <code>loop()</code> runs on core 1.</li>
<li><strong>How a switch really happens (Cortex-M):</strong> the SysTick timer fires every tick and requests <strong>PendSV</strong>, the lowest-priority exception. PendSV saves the old task registers and restores the next task, so context switches never interrupt a real ISR.</li>
<li><strong>Interrupt priorities:</strong> on Cortex-M, ISRs above <code>configMAX_SYSCALL_INTERRUPT_PRIORITY</code> must not call any RTOS function.</li>
<li><strong>Low power:</strong> tickless idle stops the tick when all tasks are blocked, and the chip sleeps until the next event.</li>
<li><strong>Latency and jitter:</strong> measure with a GPIO pin toggled on an oscilloscope: interrupt latency (event to ISR) and task latency (event to task start).</li>
<li><strong>Schedulability check (RMS):</strong> for n tasks, CPU use must stay below n(2^(1/n) - 1). For 3 tasks that is about 78%. Example: tasks need 20%, 25% and 30% = 75%, which is safe.</li>
<li><strong>Design patterns:</strong> ISR to queue to worker task; one owner task per hardware device (others send it requests); state machine inside a task; supervisor task watching the others.</li>
<li><strong>Other RTOSes:</strong> Zephyr (modern, many boards), ThreadX (now Eclipse ThreadX), uC/OS, VxWorks and QNX (industrial, automotive).</li>
</ul>
<h2 id="rtos-project">11. Mini Project: Three-Task Sensor Node</h2>
<p>Design first, code second. Tasks and priorities:</p>
<div class="tw"><table><tr><th>Task</th><th>Priority</th><th>Job</th><th>Talks via</th></tr>
<tr><td>Button ISR</td><td>Hardware</td><td>Signal a press</td><td>Binary semaphore</td></tr>
<tr><td>sensorTask</td><td>2</td><td>Read the sensor every second</td><td>Queue to sendTask</td></tr>
<tr><td>alertTask</td><td>3</td><td>Blink the alert LED on a button press</td><td>Semaphore</td></tr>
<tr><td>sendTask</td><td>1</td><td>Send readings to the server (slow Wi-Fi)</td><td>Queue</td></tr>
</table></div>
<p>Why this works: the slow network task has the <em>lowest</em> priority, so Wi-Fi delays never delay the sensor or the alert. This is the single biggest benefit of an RTOS. Combine the code from sections 6 and 7 and add the HTTP post from the IoT tab.</p>
<h2 id="rtos-interview">12. RTOS Interview Questions</h2>
<ul>
<li><strong>What is an RTOS?</strong> An OS whose scheduler guarantees tasks meet deadlines through priorities and predictable timing.</li>
<li><strong>Task vs thread vs ISR?</strong> A task is the RTOS unit of work with its own stack. An ISR is hardware-triggered and must be short.</li>
<li><strong>Semaphore vs mutex?</strong> A semaphore signals events and has no owner. A mutex protects a resource, has an owner, and supports priority inheritance.</li>
<li><strong>What is priority inversion?</strong> A high task is blocked by a low one holding a resource while a medium task preempts it. Fixed by priority inheritance or ceiling.</li>
<li><strong>What is a context switch?</strong> Saving one task CPU state and restoring another. It costs time, so avoid needless switching.</li>
<li><strong>Why not use delay() in a task?</strong> It wastes CPU. Use vTaskDelay so other tasks can run.</li>
<li><strong>How do you size a stack?</strong> Run, read the high-water mark, add a margin.</li>
<li><strong>Why use FromISR functions?</strong> Normal APIs may block or assume a task context, which an ISR does not have.</li>
<li><strong>How do you avoid deadlock?</strong> Lock in a fixed order, hold locks briefly, use timeouts.</li>
</ul>

/* ---------- multicolour syntax highlighting ---------- */
const W=a=>'\\b(?:'+a.join('|')+')\\b';
const TOK=[ // [css class, regex source] — first match wins at each position
 ['c','\\/\\*[\\s\\S]*?\\*\\/|\\/\\/.*'],
 ['s','"(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\''],
 ['h','(?<=^[ \\t]*#[ \\t]*include[ \\t]*)&lt;[^\\n&]*?>'],
 ['p','^[ \\t]*#[ \\t]*\\w+'],
 ['n','\\b0[xX][0-9a-fA-F]+[uUlL]*\\b|\\b0[bB][01]+[uUlL]*\\b|\\b\\d+\\.\\d+(?:[eE][+-]?\\d+)?[fFlL]?\\b|\\b\\d+[uUlLfF]*\\b'],
 ['l',W(['NULL','true','false','TRUE','FALSE','EOF'])],
 ['k',W(['if','else','for','while','do','switch','case','default','break','continue','return','goto'])],
 ['t',W(['void','char','short','int','long','float','double','signed','unsigned','bool','_Bool','FILE','size_t','ssize_t','ptrdiff_t','uintptr_t','intptr_t'])+'|\\b(?:u?int(?:_(?:fast|least))?\\d+_t|\\w+_t)\\b'],
 ['sc',W(['auto','const','static','extern','register','volatile','inline','restrict','typedef','struct','union','enum','sizeof'])],
 ['m','\\b[A-Z][A-Z0-9_]{2,}\\b'],
 ['f','\\b[A-Za-z_]\\w*(?=\\s*\\()'],
 ['a','(?<=\\.|->)[A-Za-z_]\\w*\\b'],
 ['o','&amp;&amp;|&amp;=?|&lt;&lt;=?|&lt;=?|>>=?|>=?|->|\\+\\+|--|[-+*\\/%=!|^~?]=?']
];
let HLRE;
try{HLRE=new RegExp(TOK.map(t=>'('+t[1]+')').join('|'),'gm')}
catch(e){for(let i=TOK.length;i--;)if(/^[ha]$/.test(TOK[i][0]))TOK.splice(i,1);HLRE=new RegExp(TOK.map(t=>'('+t[1]+')').join('|'),'gm')} // older browsers without lookbehind
function hl(src){
 return src.replace(HLRE,(...m)=>{for(let i=0;i<TOK.length;i++)if(m[i+1]!==undefined)return `<span class=${TOK[i][0]}>${m[0]}</span>`;return m[0]});

/* ---------- smooth scrolling (eased, interruptible) ---------- */
function smoothTo(y,done){
 halt&&halt();
 const max=D.scrollHeight-innerHeight;y=Math.max(0,Math.min(y,max));
 const s=scrollY,d=y-s;
 if(reduced||Math.abs(d)<4){scrollTo({top:y,behavior:'instant'});done&&done();return}
 const dur=Math.min(1000,Math.max(420,Math.abs(d)*.32)),t0=performance.now(),evs=['wheel','touchstart','keydown','pointerdown'];
 const off=()=>{cancelAnimationFrame(anim);evs.forEach(ev=>removeEventListener(ev,stop));halt=null};
 const stop=()=>{off();done&&done()};
 halt=off;evs.forEach(ev=>addEventListener(ev,stop,{passive:true}));
 const step=now=>{const t=Math.min(1,(now-t0)/dur),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;scrollTo({top:s+d*e,behavior:'instant'});if(t<1)anim=requestAnimationFrame(step);else{off();done&&done()}};
 anim=requestAnimationFrame(step);
}

/* ---------- reveal on scroll (opacity/transform only) ---------- */
function reveal(){

 const els=[...art.children];
 els.forEach(el=>{el.classList.add('rv');el.classList.remove('in');el.style.transition='';el.style.transitionDelay=''});

 rvIO=new IntersectionObserver(es=>{
  let i=0;
  es.forEach(e=>{
   const el=e.target,above=e.boundingClientRect.top<0;
   if(!e.isIntersecting&&!above)return;
   if(!e.isIntersecting&&above){el.style.transition='none'}else{el.style.transitionDelay=Math.min(i++*70,280)+'ms'}
   el.classList.add('in');rvIO.unobserve(el);

 },{rootMargin:'0px 0px -6% 0px',threshold:.01});
 els.forEach(el=>rvIO.observe(el));
}

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const syl=$('#syl');
syl.open=ls.get('syl')!=='0';
syl.addEventListener('toggle',()=>ls.set('syl',syl.open?'1':'0'));
syl.addEventListener('click',e=>{const a=e.target.closest('a[data-id]');if(!a)return;e.preventDefault();goTo(a.dataset.id)});
function renderSyl(b){
 const s=SYL[b.id];if(!s){syl.hidden=true;return}
 const n=s.g.reduce((x,g)=>x+g.u.length,0);
 syl.style.setProperty('--ac',pc(b.k));
 syl.innerHTML='<summary><b>Syllabus</b><span>'+n+' topics</span></summary><div class="sb">'
  +'<div class="sm"><div><h4>Before you start</h4><p>'+esc(s.pre)+'</p></div>'
  +'<div><h4>You will be able to</h4><ul>'+s.out.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'
  +'<div><h4>Next</h4><p>'+esc(s.next)+'</p></div></div>'
  +s.g.map(g=>'<h4>'+esc(g.t)+'</h4><ul class="su">'+g.u.map(u=>'<li><a href="#'+esc(u[0])+'" data-id="'+esc(u[0])+'"><i>'+esc(u[1])+'</i><b>'+esc(u[2])+'</b>'+(u[3]?'<small>'+esc(u[3])+'</small>':'')+'</a></li>').join('')+'</ul>').join('')
  +'</div>';
 syl.hidden=false;
}
function addPractice(){
 art.querySelectorAll('h2').forEach(h=>{
  let last=h;while(last.nextElementSibling&&!/^H[12]$/.test(last.nextElementSibling.tagName))last=last.nextElementSibling;
  const d=document.createElement('div');d.className='prac';
  d.innerHTML='<b>Practice</b><ul>'+tasks(h.textContent).map(t=>'<li>'+t+'</li>').join('')+'</ul><label><input type="checkbox" data-k="'+cur+':'+h.id+'"> Mark this section complete</label>';
  last.after(d);
 });
}
function upd(){
 const sum=id=>[...done].filter(k=>k.startsWith(id+':')).length;
 const n=Math.min(sum(cur),totals[cur]),t=totals[cur]||1;
 $('#pgi').style.transform=`scaleX(${n/t})`;$('#pgt').textContent=`${n}/${t} sections done \u00b7 ${Math.round(n/t*100)}%`;
 const A=BOOKS.reduce((x,b)=>x+Math.min(sum(b.id),totals[b.id]),0),T=BOOKS.reduce((x,b)=>x+totals[b.id],0);
 $('#all').textContent=Math.round(A/T*100)+'%';
 art.querySelectorAll('.prac input').forEach(i=>i.checked=done.has(i.dataset.k));
 syl.querySelectorAll('a[data-id]').forEach(a=>a.classList.toggle('ok',done.has(cur+':'+a.dataset.id)));
 Object.entries(links).forEach(([id,a])=>a.classList.toggle('ok',done.has(cur+':'+id)));
}
function save(){ls.set('done',JSON.stringify([...done]));upd()}
art.addEventListener('change',e=>{const i=e.target;if(!i.dataset.k)return;i.checked?done.add(i.dataset.k):done.delete(i.dataset.k);save()});

/* ---------- go ---------- */
openBook(ls.get('book')||'c',true).then(()=>{pill.classList.add('ready')});
</script>
<script>
/* ---------- F.R.I.D.A.Y study assistant ---------- */
(()=>{
const el=(t,a={},h='')=>Object.assign(document.createElement(t),a,h?{innerHTML:h}:{});
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const btn=el('button',{id:'fr-btn',title:'F.R.I.D.A.Y',ariaLabel:'Open FRIDAY assistant'},'F.R.I.D.A.Y'.slice(0,1)+'R');
const box=el('div',{id:'fr',role:'dialog',ariaLabel:'FRIDAY assistant'},
 `<header><b>F.R.I.D.A.Y</b><small id="fr-ctx"></small><button id="fr-spk" title="Speak answers" aria-pressed="false">🔇</button><button id="fr-clr" title="New chat">↺</button><button id="fr-x" title="Close">✕</button></header>
  <div id="fr-log"></div><div id="fr-chips"></div>
  <form><button type="button" class="mic" id="fr-mic" title="Speak">🎤</button><input id="fr-in" placeholder="Ask FRIDAY anything…" autocomplete="off"><button>➤</button></form>`);
const sel=el('div',{id:'fr-sel'},'Ask FRIDAY ✦');
document.body.append(btn,box,sel);
const log=box.querySelector('#fr-log'),inp=box.querySelector('#fr-in'),ctxEl=box.querySelector('#fr-ctx'),chips=box.querySelector('#fr-chips');
let hist=[],busy=false,speak=false;
const book=()=>BOOKS.find(b=>b.id===cur)||BOOKS[0];

/* what section is the learner reading? */
function section(){
 const hs=[...art.querySelectorAll('h2')];let h=hs[0];
 for(const x of hs){if(x.getBoundingClientRect().top<innerHeight*.4)h=x;else break}
 if(!h)return{title:'',text:art.innerText.slice(0,5000)};
 let t=h.innerText+'\n',n=h.nextElementSibling;
 while(n&&!/^H[12]$/.test(n.tagName)){t+=n.innerText+'\n';n=n.nextElementSibling}
 return{title:h.innerText,text:t.slice(0,6000),id:h.id};
}
function refresh(){
 const s=section();ctxEl.textContent=book().title+(s.title?' › '+s.title:'');
 chips.innerHTML='';
 [['Explain this section simply','Explain the section I am reading in simple words with an example.'],
  ['Quiz me','Give me 3 interview-style questions on this section, one at a time. Wait for my answer before the next.'],
  ['Summarise','Summarise this section in 5 bullet points.'],
  ['Study plan','Make me a 7-day study plan for '+book().title+'.']]
 .forEach(([l,p])=>chips.append(el('button',{type:'button',onclick:()=>ask(p)},l)));
}
function fmt(t){ // minimal markdown
 return esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre>'+c.replace(/\n$/,'')+'</pre>')
  .replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
}
function add(role,text,html){const m=el('div',{className:'fm '+role});html?m.innerHTML=html:m.textContent=text;log.append(m);log.scrollTop=log.scrollHeight;return m}
function say(t){if(!speak||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' code omitted ').replace(/[*`#]/g,''));speechSynthesis.speak(u)}

/* offline fallback: search the section text on the page */
function local(qs){
 const w=qs.toLowerCase().match(/[a-z0-9_+#]{3,}/g)||[];let best=[];
 art.querySelectorAll('h2').forEach(h=>{
  let t=h.innerText,n=h.nextElementSibling;while(n&&!/^H[12]$/.test(n.tagName)){t+=' '+n.innerText;n=n.nextElementSibling}
  const lo=t.toLowerCase(),sc=w.reduce((a,x)=>a+(lo.includes(x)?1:0)+(h.innerText.toLowerCase().includes(x)?2:0),0);
  if(sc)best.push([sc,h])});
 best.sort((a,b)=>b[0]-a[0]);
 if(!best.length)return"I couldn't find that in this tab. Try another tab, or ask me again with different words.";
 return"AI is offline right now, but these sections in this tab match:\n"+best.slice(0,4).map(([,h])=>'• '+h.innerText).join('\n');
}
function jump(title){const h=[...art.querySelectorAll('h2')].find(x=>x.innerText.trim()===title);if(h)h.scrollIntoView({behavior:'smooth'})}

async function ask(text){
 text=(text||inp.value).trim();if(!text||busy)return;inp.value='';busy=true;
 add('u',text);hist.push({role:'user',content:text});
 const m=add('b','…'),s=section();
 try{
  const r=await fetch('/api/friday',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({messages:hist.slice(-12),context:{book:book().title,section:s.title,text:s.text}})});
  if(!r.ok)throw new Error(r.status);
  const d=await r.json(),a=d.reply||'…';
  m.innerHTML=fmt(a);hist.push({role:'assistant',content:a});say(a);
 }catch(e){
  const a=local(text);m.textContent=a;hist.push({role:'assistant',content:a});
  m.innerHTML=fmt(a).replace(/• ([^\n]+)/g,(_,t)=>'• <a data-j="'+t+'">'+t+'</a>');
 }
 busy=false;log.scrollTop=log.scrollHeight;
}
log.addEventListener('click',e=>{const t=e.target.dataset?.j;if(t){jump(t);if(innerWidth<700)box.classList.remove('on')}});
function greet(){log.innerHTML='';hist=[];add('b',"Hello, I'm FRIDAY. I can see which topic you're reading, so ask me anything — or select any text on the page and tap “Ask FRIDAY”.")}
const open=v=>{box.classList.toggle('on',v);if(v){refresh();inp.focus()}};
btn.onclick=()=>open(!box.classList.contains('on'));
box.querySelector('#fr-x').onclick=()=>open(false);
box.querySelector('#fr-clr').onclick=greet;
box.querySelector('#fr-spk').onclick=e=>{speak=!speak;e.currentTarget.textContent=speak?'🔊':'🔇';e.currentTarget.setAttribute('aria-pressed',speak);if(!speak)speechSynthesis?.cancel()};
box.querySelector('form').onsubmit=e=>{e.preventDefault();ask()};
addEventListener('keydown',e=>{if(e.key==='Escape')open(false);if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&e.ctrlKey){e.preventDefault();open(true)}});

/* voice input */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=box.querySelector('#fr-mic');
if(!SR)mic.style.display='none';else mic.onclick=()=>{const r=new SR();r.lang='en-US';mic.classList.add('rec');
 r.onresult=e=>{inp.value=e.results[0][0].transcript;ask()};r.onend=()=>mic.classList.remove('rec');r.start()};

/* select text → ask */
let picked='';
document.addEventListener('selectionchange',()=>{
 const s=getSelection(),t=s.toString().trim();
 if(t.length<3||!art.contains(s.anchorNode)){sel.style.display='none';return}
 picked=t.slice(0,1500);const r=s.getRangeAt(0).getBoundingClientRect();
 sel.style.display='block';sel.style.top=(scrollY+r.top-40)+'px';sel.style.left=Math.max(8,Math.min(scrollX+r.left,innerWidth-130))+'px';
});
sel.onmousedown=e=>e.preventDefault();
sel.onclick=()=>{sel.style.display='none';open(true);ask('Explain this in simple words:\n"""'+picked+'"""')};

greet();refresh();
if(typeof openBook==='function'){const ob=openBook;window.openBook=async function(){const r=await ob.apply(this,arguments);if(box.classList.contains('on'))refresh();return r}}
})();
</script>
<script>
/* gloss: sheen sweeps + cursor-following highlight on glass cards */
(()=>{
 const add=(s,d)=>{const e=document.querySelector(s);if(!e||e.querySelector(':scope>.sheen'))return;const i=document.createElement('i');i.className='sheen';i.style.setProperty('--d',d||'0s');e.append(i);e.style.position=getComputedStyle(e).position==='static'?'relative':'';};
 ['#hero','.logo b','#top','#fr-btn'].forEach((s,k)=>add(s));
 document.querySelectorAll('.sheen').forEach((s,k)=>s.style.setProperty('animation-delay',k*1.3+'s'));
 let raf=0,ev;
 document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;ev=e;if(raf)return;
  raf=requestAnimationFrame(()=>{raf=0;const t=ev.target.closest&&ev.target.closest('header,aside,.prac,.tw');if(!t)return;
   const r=t.getBoundingClientRect();t.style.setProperty('--mx',ev.clientX-r.left+'px');t.style.setProperty('--my',ev.clientY-r.top+'px')});
 },{passive:true});
})();
</script>
<script>
/* FRIDAY: drag the orb or the chat header anywhere; positions are remembered */
(()=>{
 const orb=document.getElementById('fr-btn'),box=document.getElementById('fr');if(!orb||!box)return;
 const st=document.createElement('style');
 st.textContent='#fr-btn{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}#fr-btn.drag{animation:none!important;transition:none!important;cursor:grabbing;scale:1.08}#fr header{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}#fr.drag{transition:none;cursor:grabbing}#fr.drag header{cursor:grabbing}';
 document.head.append(st);
 const M=8,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
 const mobile=()=>innerWidth<=560;
 let op=get('fr-orb'),pp=get('fr-panel');

 function putOrb(){
  if(!op)return;
  const l=clamp(op.l,M,innerWidth-orb.offsetWidth-M),t=clamp(op.t,M,innerHeight-orb.offsetHeight-M);
  Object.assign(orb.style,{left:l+'px',top:t+'px',right:'auto',bottom:'auto',marginTop:'0'});
 }
 function putPanel(){
  if(mobile()){Object.assign(box.style,{left:'',top:'',right:'',bottom:'',transform:''});return}
  if(!box.classList.contains('on'))return;
  const w=box.offsetWidth,h=box.offsetHeight;let l,t;
  if(pp){l=pp.l;t=pp.t}
  else{
   const r=orb.getBoundingClientRect();
   l=r.left-w-12;if(l<M)l=r.right+12;
   t=r.top+r.height/2-h/2;
  }
  l=clamp(l,M,innerWidth-w-M);t=clamp(t,M,innerHeight-h-M);
  Object.assign(box.style,{left:l+'px',top:t+'px',right:'auto',bottom:'auto',transform:'none'});
 }
 putOrb();
 new MutationObserver(putPanel).observe(box,{attributes:true,attributeFilter:['class']});
 addEventListener('resize',()=>{putOrb();putPanel()});

 /* generic drag helper */
 function drag(handle,target,onMove,onEnd,skip){
  let sx,sy,ox,oy,id=null,moved=false;
  handle.addEventListener('pointerdown',e=>{
   if(e.button||(skip&&e.target.closest(skip)))return;
   const r=target.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;id=e.pointerId;moved=false;
   handle.setPointerCapture(id);
  });
  handle.addEventListener('pointermove',e=>{
   if(id!==e.pointerId)return;
   const dx=e.clientX-sx,dy=e.clientY-sy;
   if(!moved&&Math.hypot(dx,dy)<6)return;
   if(!moved){moved=true;target.classList.add('drag')}
   onMove(clamp(ox+dx,M,innerWidth-target.offsetWidth-M),clamp(oy+dy,M,innerHeight-target.offsetHeight-M));
  });
  const up=e=>{
   if(id!==e.pointerId)return;id=null;target.classList.remove('drag');
   if(moved){onEnd();handle.dataset.moved='1';setTimeout(()=>delete handle.dataset.moved,60)}
  };
  handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
 }

 drag(orb,orb,(l,t)=>{
  op={l,t};putOrb();if(!pp)putPanel();
 },()=>set('fr-orb',op));
 /* a drag must not count as a click (which would open/close the chat) */
 orb.addEventListener('click',e=>{if(orb.dataset.moved){e.stopImmediatePropagation();e.preventDefault()}},true);

 drag(box.querySelector('header'),box,(l,t)=>{
  if(mobile())return;pp={l,t};Object.assign(box.style,{left:l+'px',top:t+'px',right:'auto',bottom:'auto',transform:'none'});
 },()=>set('fr-panel',pp),'button');

 /* double-tap the chat header to reset both positions */
 box.querySelector('header').addEventListener('dblclick',e=>{
  if(e.target.closest('button'))return;
  op=pp=null;try{localStorage.removeItem('fr-orb');localStorage.removeItem('fr-panel')}catch(_){}
  Object.assign(orb.style,{left:'',top:'',right:'',bottom:'',marginTop:''});
  Object.assign(box.style,{left:'',top:'',right:'',bottom:'',transform:''});
  putPanel();
 });
 box.querySelector('header').title='Drag to move · double-click to reset';
})();
</script>
