e><tr><th>Protocol</th><th>Type</th><th>Medium</th><th>Topology</th><th>Speed</th><th>Best for</th></tr><tr><td>UART</td><td>Serial, async</td><td>2 wires + GND</td><td>Point to point</td><td>to ~1 Mbit/s</td><td>Debug, modules</td></tr><tr><td>SPI</td><td>Serial, sync</td><td>4 wires + CS per slave</td><td>1 master, n slaves</td><td>1 to 50+ Mbit/s</td><td>Flash, displays, ADC</td></tr><tr><td>I2C</td><td>Serial, sync</td><td>2 wires (open-drain)</td><td>Multi-master, addressed</td><td>0.1 to 3.4 Mbit/s</td><td>Sensors, RTC, EEPROM</td></tr><tr><td>CAN</td><td>Differential bus</td><td>Twisted pair</td><td>Multi-master</td><td>to 1 Mbit/s (FD 8)</td><td>Vehicles, industry</td></tr><tr><td>Modbus</td><td>Application, master/slave</td><td>RS-485 or TCP</td><td>1 master, 247 slaves</td><td>9.6 to 115 kbit/s</td><td>PLCs, meters</td></tr><tr><td>LIN</td><td>Single-wire bus</td><td>1 wire</td><td>1 master, 16 slaves</td><td>to 20 kbit/s</td><td>Car body parts</td></tr><tr><td>Wi-Fi</td><td>Wireless LAN</td><td>2.4 / 5 / 6 GHz</td><td>Star via AP</td><td>11 Mbit/s to Gbit/s</td><td>IP devices, video</td></tr><tr><td>TCP/IP</td><td>Network stack</td><td>Any link</td><td>Any</td><td>n/a</td><td>The internet</td></tr><tr><td>HTTP</td><td>Application over TCP</td><td>n/a</td><td>Client/server</td><td>n/a</td><td>REST, web, OTA</td></tr><tr><td>Bluetooth Classic</td><td>Wireless PAN</td><td>2.4 GHz hopping</td><td>Piconet 1 + 7</td><td>1 to 3 Mbit/s</td><td>Audio, serial (SPP)</td></tr><tr><td>BLE</td><td>Wireless PAN</td><td>2.4 GHz, 40 ch</td><td>Star, broadcast, mesh</td><td>125 kbit/s to 2 Mbit/s</td><td>Wearables, beacons</td></tr><tr><td>MQTT</td><td>Pub/sub over TCP</td><td>n/a</td><td>Star around broker</td><td>n/a</td><td>Telemetry</td></tr><tr><td>CoAP</td><td>REST over UDP</td><td>n/a</td><td>Client/server + observe</td><td>n/a</td><td>Constrained IoT</td></tr></table></div><ul><li><strong>Two chips on one board, simple:</strong> UART. Fast peripherals: SPI. Many slow sensors: I2C.</li><li><strong>Noisy, long, safety-relevant wiring:</strong> CAN (or RS-485 with Modbus). Cheap body electronics: LIN.</li><li><strong>Battery sensor talking to a phone:</strong> BLE. Audio or serial cable replacement: Bluetooth Classic.</li><li><strong>Needs bandwidth or direct internet:</strong> Wi-Fi with TCP/IP and HTTP. Many sensors reporting to the cloud: MQTT. Very small devices: CoAP.</li></ul></template>
<template id="book-micro"><p><strong>Microcontrollers</strong></p>
<p>Simple guide</p>
<p><em>Easy hardware guide</em></p>
<h1 id="part-a">Part A: The Basics</h1>
<h2 id="mpu-vs-mcu">1. Microprocessor vs Microcontroller</h2>
<p>A <strong>microprocessor (MPU)</strong> is only the brain (CPU). It needs separate memory, storage and ports. A <strong>microcontroller (MCU)</strong> is a tiny computer on one chip: CPU + memory + ports + timers. Think of an MPU as an engine and an MCU as a complete scooter.</p>
<div class="tw"><table><tr><th>Feature</th><th>Microprocessor</th><th>Microcontroller</th></tr>
<tr><td>Contains</td><td>CPU only</td><td>CPU + RAM + Flash + I/O + timers</td></tr>
<tr><td>Needs outside parts</td><td>Yes (RAM, storage, I/O chips)</td><td>Usually no</td></tr>
<tr><td>Speed</td><td>GHz</td><td>MHz (8 MHz to a few hundred MHz)</td></tr>
<tr><td>Power use</td><td>Watts</td><td>Milliwatts, can sleep on microamps</td></tr>
<tr><td>Cost</td><td>High</td><td>Low (from about $1)</td></tr>
<tr><td>Runs</td><td>Full OS (Linux, Windows)</td><td>One program, or a small RTOS</td></tr>
<tr><td>Examples</td><td>Intel Core, ARM Cortex-A (Raspberry Pi)</td><td>ATmega328P (Arduino), STM32, ESP32</td></tr>
<tr><td>Used in</td><td>Laptops, phones, Raspberry Pi</td><td>Washing machines, remotes, cars, drones</td></tr></table></div>
<h2 id="history">2. Who Invented What, and When</h2>
<div class="tw"><table><tr><th>What</th><th>Who</th><th>When</th></tr>
<tr><td>First microprocessor (Intel 4004)</td><td>Federico Faggin, Ted Hoff, Masatoshi Shima (Intel)</td><td>1971</td></tr>
<tr><td>First microcontroller (TMS1000)</td><td>Texas Instruments (Gary Boone, Michael Cochran)</td><td>1971 (sold 1974)</td></tr>
<tr><td>Intel 8051 (famous 8-bit MCU)</td><td>Intel</td><td>1980</td></tr>
<tr><td>PIC and AVR families</td><td>PIC: General Instrument (1976), later Microchip (1989); AVR: Atmel</td><td>1976 / 1996</td></tr>
<tr><td>Arduino</td><td>Massimo Banzi and team, Ivrea, Italy</td><td>2005</td></tr>
<tr><td>STM32 (ARM Cortex-M3)</td><td>STMicroelectronics</td><td>2007</td></tr>
<tr><td>ESP8266 (Wi-Fi chip)</td><td>Espressif Systems (China)</td><td>2014</td></tr>
<tr><td>ESP32 (Wi-Fi + Bluetooth)</td><td>Espressif Systems</td><td>2016</td></tr>
<tr><td>Raspberry Pi</td><td>Eben Upton, Raspberry Pi Foundation (UK)</td><td>2012</td></tr></table></div>
<p>Dates are the commonly quoted ones; check the maker's site if you need exact details for an exam.</p>
<h2 id="inside-mcu">3. What Is Inside a Microcontroller</h2>
<ul>
<li><strong>CPU:</strong> runs your instructions.</li>
<li><strong>Flash:</strong> stores your program; it stays when power is off.</li>
<li><strong>RAM (SRAM):</strong> stores variables while running; it is lost at power off.</li>
<li><strong>EEPROM:</strong> small memory for settings you want to keep.</li>
<li><strong>GPIO:</strong> pins you set as input (read a button) or output (turn on an LED).</li>
<li><strong>Timers:</strong> count time, make PWM (dimming, motor speed).</li>
<li><strong>ADC:</strong> turns a voltage (sensor) into a number.</li>
<li><strong>UART, SPI, I2C:</strong> ways to talk to other chips and sensors.</li>
<li><strong>Interrupt controller:</strong> lets hardware say "stop and handle me now".</li>
<li><strong>Clock and watchdog:</strong> the heartbeat, and a safety timer that resets a stuck chip.</li>
</ul>
<h3>Common pins</h3>
<div class="tw"><table><tr><th>Pin</th><th>Meaning</th></tr>
<tr><td>VCC / VDD / 3V3 / 5V</td><td>Power in</td></tr><tr><td>GND</td><td>Ground (0 V)</td></tr>
<tr><td>RESET</td><td>Restart the chip</td></tr><tr><td>XTAL</td><td>Connects the crystal (clock)</td></tr>
<tr><td>GPIO / Dx / Px</td><td>General input or output</td></tr><tr><td>A0, A1... (ADC)</td><td>Read analog voltage</td></tr>
<tr><td>TX / RX</td><td>Serial send / receive</td></tr><tr><td>SDA / SCL</td><td>I2C data / clock</td></tr>
<tr><td>MOSI / MISO / SCK / CS</td><td>SPI lines</td></tr></table></div>
<h2 id="voltage">4. Voltage and Power in Simple Words</h2>
<p><strong>Logic level</strong> is the voltage that means "1" on a pin. <strong>Input voltage</strong> is what powers the board. <strong>Output</strong> is what a pin gives out, and it can only supply a few milliamps, so use a transistor for motors and relays. Never put 5 V on a 3.3 V pin: it can kill the chip.</p>
<div class="tw"><table><tr><th>Board</th><th>Logic level</th><th>Power in</th><th>Pin current (approx.)</th></tr>
<tr><td>Arduino Uno</td><td>5 V</td><td>USB 5 V or 7-12 V on VIN</td><td>20 mA safe, 40 mA max</td></tr>
<tr><td>ESP8266</td><td>3.3 V</td><td>USB 5 V (board regulates to 3.3 V)</td><td>about 12 mA</td></tr>
<tr><td>ESP32</td><td>3.3 V</td><td>USB 5 V or 3.3 V pin</td><td>about 12 mA safe, 40 mA max</td></tr>
<tr><td>STM32 (Blue Pill)</td><td>3.3 V (many pins 5 V tolerant)</td><td>USB 5 V or 3.3 V</td><td>about 20 mA, 25 mA max</td></tr>
<tr><td>Raspberry Pi</td><td>3.3 V (not 5 V tolerant)</td><td>5 V, 2.5-3 A supply</td><td>about 16 mA per pin</td></tr></table></div>
<p>Values vary by exact board; read the datasheet before connecting anything big.</p>
<p>Pin diagrams and pin-by-pin tables for every board below are in <a class="xr" href="#read-pinout">Part C</a>.</p>
<h1 id="part-b">Part B: The Boards</h1>
<h2 id="arduino">5. Arduino (ATmega328P)</h2>
<p>The easiest start. Uno: 8-bit AVR, 16 MHz, 32 KB Flash, 2 KB RAM, 14 digital pins, 6 analog inputs (10-bit ADC, 0-1023). The Arduino is the board; the ATmega328P is its microcontroller.</p>
<pre><code>void setup() {
    pinMode(13, OUTPUT);
}
void loop() {
    digitalWrite(13, HIGH);
    delay(500);
    digitalWrite(13, LOW);
    delay(500);
}</code></pre>
<p class="xr-note">Pin diagram and pin table: <a class="xr" href="#pin-uno">section 13</a>.</p>
<h2 id="esp">6. ESP8266 and ESP32</h2>
<p>Cheap boards with built-in Wi-Fi, made for IoT (gadgets on the internet). The ESP32 is the bigger sibling.</p>
<div class="tw"><table><tr><th>Feature</th><th>ESP8266</th><th>ESP32</th></tr>
<tr><td>CPU</td><td>1 core, 80 MHz</td><td>2 cores, up to 240 MHz</td></tr>
<tr><td>Wireless</td><td>Wi-Fi</td><td>Wi-Fi + Bluetooth</td></tr>
<tr><td>Analog input</td><td>1 pin, 0-1 V, 10-bit</td><td>Many pins, 12-bit</td></tr>
<tr><td>Touch pins</td><td>No</td><td>Yes (capacitive)</td></tr>
<tr><td>RAM</td><td>about 80 KB</td><td>about 520 KB</td></tr>
<tr><td>Price</td><td>Lowest</td><td>Low</td></tr></table></div>
<pre><code>int v = touchRead(4);
if (v &lt; 30) {
    digitalWrite(2, HIGH);
}</code></pre>
<p class="xr-note">Pin diagrams and pin tables: <a class="xr" href="#pin-esp8266">ESP8266, section 14</a> and <a class="xr" href="#pin-esp32">ESP32, section 15</a>.</p>
<h2 id="stm32">7. STM32</h2>
<p>A big family of ARM Cortex-M chips from STMicroelectronics (32-bit, 3.3 V, 72 MHz on the F103 up to hundreds of MHz on others). It is used in real products and is the best choice for learning registers, timers, DMA and RTOS.</p>
<p class="xr-note">Pin diagram and pin table: <a class="xr" href="#pin-stm32">section 16</a>.</p>
<h2 id="pi">8. Raspberry Pi</h2>
<p>The Raspberry Pi 3/4/5 is a small <strong>computer</strong> (microprocessor, Linux, HDMI, USB). It is not a microcontroller. The <strong>Raspberry Pi Pico</strong> (RP2040 chip, 2021) is the microcontroller version. A Pi is great for cameras and AI; an MCU is better for fast, exact timing and battery life.</p>
<p class="xr-note">Pin diagrams: <a class="xr" href="#pin-pi">Raspberry Pi header, section 17</a> and <a class="xr" href="#pin-pico">Pico, section 18</a>.</p>
<h2 id="sensors">9. Built-in Sensors and How They Work</h2>
<div class="tw"><table><tr><th>Board</th><th>Built-in sensors</th></tr>
<tr><td>Arduino Uno</td><td>Internal temperature sensor on the chip (rough: needs calibration, can be about 10 degrees off); none on the board</td></tr>
<tr><td>ESP8266</td><td>None. Its ADC can read its own supply voltage</td></tr>
<tr><td>ESP32</td><td>Capacitive touch pins; internal temperature sensor; hall sensor on older chips</td></tr>
<tr><td>STM32</td><td>Internal temperature sensor and voltage reference on the ADC</td></tr>
<tr><td>Raspberry Pi</td><td>CPU temperature (command: vcgencmd measure_temp)</td></tr></table></div>
<p><strong>Capacitive touch:</strong> a pin and a metal pad hold a tiny electric charge. A finger adds capacitance, so the pad charges more slowly. The chip measures this time and gives a smaller number when touched.</p>
<p><strong>Analog sensors (ADC):</strong> the sensor gives a voltage. The ADC turns it into a number: value = voltage / reference x maximum count (1023 for 10-bit, 4095 for 12-bit).</p>
<h2 id="rtos">10. RTOS in Simple Words</h2>
<p>An RTOS (real-time operating system) lets you run several jobs ("tasks") at once, like blinking an LED while reading a sensor. A <strong>scheduler</strong> switches between tasks very fast. A <strong>queue</strong> passes data between tasks, a <strong>mutex</strong> stops two tasks using one thing at the same time, and a <strong>semaphore</strong> signals an event. FreeRTOS runs on ESP32 and STM32.</p>
<pre><code>void blinkTask(void *arg) {
    while (1) {
        digitalWrite(2, !digitalRead(2));
        vTaskDelay(500 / portTICK_PERIOD_MS);
    }
}
void setup() {
    pinMode(2, OUTPUT);
    xTaskCreate(blinkTask, "blink", 2048, NULL, 1, NULL);
}</code></pre>
<h2 id="temp-control">11. Temperature Control Project</h2>
<p>An LM35 sensor gives 10 mV per degree C (25 C = 0.25 V). Read it with the ADC, turn the fan on above 30 C, and off below 28 C. The gap (hysteresis) stops the fan from flickering.</p>
<pre><code>int raw = analogRead(A0);
float volts = raw * 5.0 / 1023.0;
float tempC = volts * 100.0;
if (tempC &gt; 30.0) {
    digitalWrite(FAN, HIGH);
} else if (tempC &lt; 28.0) {
    digitalWrite(FAN, LOW);
}</code></pre>
<h1 id="part-c">Part C: Pin Diagrams and Pin Descriptions</h1>
<h2 id="read-pinout">12. How to Read a Pinout</h2>
<p>A <strong>pinout</strong> is a map that says what each leg (pin) of a chip or board can do. Every diagram in this part uses the same colours, so learn them once.</p>
<div class="tw"><table><tr><th>Colour / tag</th><th>Pin type</th><th>Meaning</th></tr><tr><td>Power</td><td>VCC, VDD, 3V3, 5V, VIN</td><td>Supply voltage in or out. Check the number: 3.3 V and 5 V are not the same.</td></tr><tr><td>Ground</td><td>GND, VSS</td><td>0 V return path. All boards and sensors in a circuit must share one ground.</td></tr><tr><td>Digital GPIO</td><td>D2, PB5, GPIO4</td><td>Input or output pin: read a button (input) or drive an LED (output).</td></tr><tr><td>Analog / ADC / DAC</td><td>A0, ADC1, DAC1</td><td>Pin that can measure a voltage (ADC) or make one (DAC).</td></tr><tr><td>PWM / timer</td><td>OC0A, TIM2_CH1</td><td>Pin wired to a timer. It can make PWM (dimming, motor speed) or measure pulses.</td></tr><tr><td>I2C</td><td>SDA, SCL</td><td>Two-wire bus for sensors and displays. Needs pull-up resistors.</td></tr><tr><td>SPI</td><td>MOSI, MISO, SCK, CS</td><td>Four-wire fast bus for SD cards, displays and radios.</td></tr><tr><td>UART / CAN</td><td>TX, RX</td><td>Serial link: to a PC, GPS or Bluetooth module.</td></tr><tr><td>Special</td><td>RESET, BOOT, XTAL, SWDIO</td><td>Reset, boot-mode, clock, debug or USB pin. Use with care.</td></tr></table></div>
<h3>Three names for one pin</h3>
<p>The same pin often has <strong>three</strong> names, and mixing them up is the number one beginner mistake.</p>
<ul><li><strong>Physical pin number:</strong> the leg of the chip (pin 19 of the ATmega328P) or the position on a header (pin 12 of the Raspberry Pi header).</li><li><strong>Port / GPIO name:</strong> the chip's own name (<code>PB5</code>, <code>GPIO14</code>, <code>PA9</code>).</li><li><strong>Board label:</strong> what is printed on the board (<code>D13</code>, <code>D5</code>). This is what your code library usually uses.</li></ul>
<p>Example: on the Arduino Uno, <code>D13</code> (board label) is <code>PB5</code> (port name) and chip pin 19 (physical number). On the Raspberry Pi, <code>GPIO18</code> is physical pin 12, and a library may ask for either number (BCM or BOARD mode).</p>
<h3>Alternate functions (pin multiplexing)</h3>
<p>A chip has more peripherals than pins, so each pin can do several jobs. A register chooses the job. For example, <code>PB3</code> on the Uno is a plain GPIO, or SPI <code>MOSI</code>, or Timer2 PWM output <code>OC2A</code>. You pick one at a time; if two peripherals need the same pin, one of them has to move (on STM32 and ESP32 many can be moved with a remap or the GPIO matrix).</p>
<h3>Words you will meet</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr><tr><td>Input-only pin</td><td>Can read a signal but cannot drive it (ESP32 GPIO34 to 39). No internal pull-up either.</td></tr><tr><td>Strapping / boot pin</td><td>Read once at reset to choose the boot mode. Holding it at the wrong level at power-up stops the program from starting.</td></tr><tr><td>5 V tolerant (FT)</td><td>A pin that survives a 5 V input even though the chip runs at 3.3 V. Only if the datasheet says so; most 3.3 V pins are not.</td></tr><tr><td>Pull-up / pull-down</td><td>A resistor that holds an unused input at HIGH or LOW so it does not float. Many pins have a built-in one you can turn on.</td></tr><tr><td>Open-drain</td><td>Output that can only pull LOW; an outside pull-up makes the HIGH. Used by I2C.</td></tr><tr><td>Source / sink current</td><td>Current the pin pushes out (HIGH) or pulls in (LOW). Always small: milliamps.</td></tr></table></div>
<h3>Wiring checklist (use before every new circuit)</h3>
<ul><li>Find the <strong>exact board</strong> (Uno R3 or a clone, 30-pin or 38-pin ESP32). The header order differs between versions.</li><li>Check the <strong>logic level</strong> (5 V or 3.3 V) of the board and of every module.</li><li>Look up the pin you want in the function table: does it really do I2C, ADC, PWM?</li><li>Avoid <strong>strapping, flash, USB and debug pins</strong> unless you know what they do.</li><li>Keep each pin under its current limit; use a transistor or driver for motors, relays and LED strips.</li><li>Connect all grounds together.</li></ul>
<h2 id="pin-uno">13. Arduino Uno and ATmega328P Pinout</h2>
<p>The Uno has two layers of pin names. The <strong>ATmega328P chip</strong> (28-pin DIP) has ports <code>PB</code>, <code>PC</code>, <code>PD</code>. The <strong>Uno board</strong> relabels them as <code>D0</code> to <code>D13</code> and <code>A0</code> to <code>A5</code>. Chip first, then the board.</p>

C</span><span><i class="k-pm"></i>PWM / timer</span><span><i class="k-i2"></i>I2C</span><span><i class="k-sp"></i>SPI</span><span><i class="k-ur"></i>UART / CAN</span><span><i class="k-sx"></i>Special (reset, boot, clock, debug, USB)</span></div><figcaption>Top header (digital): SCL, SDA, AREF, GND, D13 to D8, then D7 to D0. Bottom headers: power (NC, IOREF, RESET, 3V3, 5V, GND, GND, VIN) and analog A0 to A5. <strong>PWM</strong> tags mark the pins printed with a ~ on the board. Scroll sideways on a phone.</figcaption></figure>
<h3>Pin description: all 28 chip pins</h3>
<div class="tw"><table><tr><th>Pin</th><th>Name</th><th>Uno label</th><th>Type</th><th>What it does</th></tr><tr><td>1</td><td>PC6 / RESET</td><td>RESET</td><td>Reset</td><td>Active-low reset. Pull it LOW and the chip restarts. A 10 k pull-up keeps it HIGH. The reset button and the USB auto-reset (used when uploading) pull it LOW.</td></tr><tr><td>2</td><td>PD0 / RXD</td><td>D0 (RX)</td><td>UART</td><td>Serial receive. Shared with the USB-to-serial chip, so remove wires from D0 and D1 while uploading.</td></tr><tr><td>3</td><td>PD1 / TXD</td><td>D1 (TX)</td><td>UART</td><td>Serial transmit. Used by <code>Serial.print()</code>.</td></tr><tr><td>4</td><td>PD2 / INT0</td><td>D2</td><td>Interrupt</td><td>External interrupt 0. <code>attachInterrupt(digitalPinToInterrupt(2), ...)</code>.</td></tr><tr><td>5</td><td>PD3 / INT1 / OC2B</td><td>D3 ~</td><td>Interrupt, PWM</td><td>External interrupt 1 and Timer2 PWM (channel B).</td></tr><tr><td>6</td><td>PD4 / T0 / XCK</td><td>D4</td><td>GPIO</td><td>Plain I/O. Also Timer0 external clock input and USART sync clock.</td></tr><tr><td>7</td><td>VCC</td><td>5V</td><td>Power</td><td>Digital supply. 4.5 to 5.5 V is needed to run at 16 MHz.</td></tr><tr><td>8</td><td>GND</td><td>GND</td><td>Ground</td><td>0 V.</td></tr><tr><td>9</td><td>PB6 / XTAL1</td><td>-</td><td>Clock</td><td>Crystal input (16 MHz crystal on the Uno). Free as a GPIO only if you use the internal oscillator.</td></tr><tr><td>10</td><td>PB7 / XTAL2</td><td>-</td><td>Clock</td><td>Other crystal pin.</td></tr><tr><td>11</td><td>PD5 / OC0B / T1</td><td>D5 ~</td><td>PWM</td><td>Timer0 PWM, about 980 Hz. Timer0 also keeps time for <code>millis()</code> and <code>delay()</code>.</td></tr><tr><td>12</td><td>PD6 / OC0A / AIN0</td><td>D6 ~</td><td>PWM</td><td>Timer0 PWM, about 980 Hz. Also the analog comparator positive input.</td></tr><tr><td>13</td><td>PD7 / AIN1</td><td>D7</td><td>GPIO</td><td>Plain I/O. Analog comparator negative input.</td></tr><tr><td>14</td><td>PB0 / ICP1 / CLKO</td><td>D8</td><td>GPIO</td><td>Timer1 input capture (measure pulse widths exactly). Can output the system clock.</td></tr><tr><td>15</td><td>PB1 / OC1A</td><td>D9 ~</td><td>PWM</td><td>Timer1 16-bit PWM. The Servo library uses Timer1.</td></tr><tr><td>16</td><td>PB2 / SS / OC1B</td><td>D10 ~</td><td>SPI, PWM</td><td>SPI slave-select. It must stay an OUTPUT or SPI master mode breaks.</td></tr><tr><td>17</td><td>PB3 / MOSI / OC2A</td><td>D11 ~</td><td>SPI, PWM</td><td>SPI data out (master to slave). Timer2 PWM.</td></tr><tr><td>18</td><td>PB4 / MISO</td><td>D12</td><td>SPI</td><td>SPI data in (slave to master).</td></tr><tr><td>19</td><td>PB5 / SCK</td><td>D13</td><td>SPI</td><td>SPI clock. Also drives the on-board LED marked L (through a buffer).</td></tr><tr><td>20</td><td>AVCC</td><td>5V</td><td>Power</td><td>Supply for the ADC. Connect to VCC (with a small filter for clean readings).</td></tr><tr><td>21</td><td>AREF</td><td>AREF</td><td>Analog</td><td>ADC reference input. Default reference is AVCC (5 V). Do not feed a voltage here unless the sketch calls <code>analogReference(EXTERNAL)</code>.</td></tr><tr><td>22</td><td>GND</td><td>GND</td><td>Ground</td><td>Analog ground.</td></tr><tr><td>23</td><td>PC0 / ADC0</td><td>A0</td><td>Analog</td><td>10-bit ADC input (0 to 1023). Can also be a digital pin (D14).</td></tr><tr><td>24</td><td>PC1 / ADC1</td><td>A1</td><td>Analog</td><td>ADC input (D15).</td></tr><tr><td>25</td><td>PC2 / ADC2</td><td>A2</td><td>Analog</td><td>ADC input (D16).</td></tr><tr><td>26</td><td>PC3 / ADC3</td><td>A3</td><td>Analog</td><td>ADC input (D17).</td></tr><tr><td>27</td><td>PC4 / ADC4 / SDA</td><td>A4</td><td>Analog, I2C</td><td>ADC input, or I2C data line (<code>Wire</code>).</td></tr><tr><td>28</td><td>PC5 / ADC5 / SCL</td><td>A5</td><td>Analog, I2C</td><td>ADC input, or I2C clock line (<code>Wire</code>).</td></tr></table></div>
<h3>Which pin does which job (Uno)</h3>
<div class="tw"><table><tr><th>Job</th><th>Pins</th><th>Notes</th></tr><tr><td>UART (Serial)</td><td>D0 RX, D1 TX</td><td>Shared with USB. Only one UART on the chip.</td></tr><tr><td>I2C (Wire)</td><td>A4 SDA, A5 SCL</td><td>The Uno R3 also repeats SDA and SCL on two header pins next to AREF.</td></tr><tr><td>SPI</td><td>D10 SS, D11 MOSI, D12 MISO, D13 SCK</td><td>Also on the 6-pin ICSP header: MISO, 5V, SCK, MOSI, RESET, GND.</td></tr><tr><td>External interrupts</td><td>D2 (INT0), D3 (INT1)</td><td>Any pin can use a pin-change interrupt (PCINT), with a little more code.</td></tr><tr><td>PWM (analogWrite)</td><td>D3, D5, D6, D9, D10, D11</td><td>D5 and D6 run at about 980 Hz, the others at about 490 Hz.</td></tr><tr><td>Timers</td><td>Timer0: D5 D6. Timer1: D9 D10. Timer2: D3 D11</td><td>Timer0 is used by <code>millis()</code>, Timer1 by Servo, Timer2 by <code>tone()</code>.</td></tr><tr><td>ADC</td><td>A0 to A5</td><td>10-bit, 6 channels, one converter shared by all (they read one at a time).</td></tr><tr><td>On-board LED</td><td>D13</td><td>LED marked L. Do not load D13 heavily if you also want the LED to work.</td></tr></table></div>
<h3>Pin rules and cautions (Uno)</h3>
<ul><li><strong>Current:</strong> 20 mA per pin is a safe design value, 40 mA is the absolute maximum, and all pins together must stay under 200 mA.</li><li><strong>3V3 pin:</strong> about 50 mA only. It cannot power a Wi-Fi module.</li><li><strong>VIN:</strong> the board expects 7 to 12 V here. The <code>5V</code> pin can also be used as an input if you have a clean regulated 5 V.</li><li><strong>A0 to A5 are also digital pins</strong> (numbers 14 to 19): <code>digitalWrite(A0, HIGH)</code> works.</li><li><strong>D0 and D1</strong> talk to the PC over USB. If a sensor is wired to them the upload can fail.</li><li><code>INPUT_PULLUP</code> turns on an internal 20 to 50 k resistor, so a button needs no outside resistor.</li></ul>
<p>The same blink, written with the chip's own names. It shows that <code>D13</code> really is bit 5 of port B:</p>
<pre><code>DDRB  |= (1 &lt;&lt; PB5);      // PB5 (D13) as output
while (1) {
    PORTB ^= (1 &lt;&lt; PB5);    // toggle PB5
    _delay_ms(500);
}</code></pre>
<h2 id="pin-esp8266">14. ESP8266 (NodeMCU) Pinout</h2>
<p>The bare ESP8266 chip is tiny and has few pins. Most people use a <strong>NodeMCU</strong> board (ESP-12E module on a board with USB). Each header pin has a <strong>board label</strong> (<code>D1</code>) and a <strong>GPIO number</strong> (<code>GPIO5</code>). Code written for the ESP8266 usually uses the <code>D</code> labels or the GPIO numbers; know both.</p>

<h3>Pin description</h3>
<div class="tw"><table><tr><th>Board label</th><th>GPIO</th><th>Functions</th><th>Notes</th></tr><tr><td>A0</td><td>ADC0 (TOUT)</td><td>Only ADC pin</td><td>10-bit (0 to 1023). The NodeMCU board has a divider so it reads <strong>0 to 3.3 V</strong>; the bare chip only reads 0 to 1.0 V.</td></tr><tr><td>D0</td><td>GPIO16</td><td>Plain I/O, wake from deep sleep, user LED</td><td>No PWM, no I2C, no interrupt. Connect to RST so the chip can wake itself from deep sleep. The board LED on this pin is active LOW.</td></tr><tr><td>D1</td><td>GPIO5</td><td>I2C SCL (default), PWM</td><td>Safe pin; a good first choice.</td></tr><tr><td>D2</td><td>GPIO4</td><td>I2C SDA (default), PWM</td><td>Safe pin.</td></tr><tr><td>D3</td><td>GPIO0</td><td>FLASH button, PWM</td><td><strong>Boot pin.</strong> LOW at reset enters flash (upload) mode. Pulled up on the board; do not hold it LOW at power-up.</td></tr><tr><td>D4</td><td>GPIO2</td><td>TXD1 (debug serial), blue LED</td><td><strong>Boot pin.</strong> Must be HIGH at reset. The blue LED on the module is active LOW.</td></tr><tr><td>D5</td><td>GPIO14</td><td>SPI SCK (HSPI), PWM</td><td>Safe pin.</td></tr><tr><td>D6</td><td>GPIO12</td><td>SPI MISO (HSPI), PWM</td><td>Safe pin.</td></tr><tr><td>D7</td><td>GPIO13</td><td>SPI MOSI (HSPI), RXD2</td><td>Safe pin.</td></tr><tr><td>D8</td><td>GPIO15</td><td>SPI CS (HSPI), TXD2</td><td><strong>Boot pin.</strong> Must be LOW at reset (the board has a pull-down). Do not wire a switch to 3V3 here.</td></tr><tr><td>RX</td><td>GPIO3</td><td>UART0 RXD</td><td>Shared with the USB serial chip (upload and <code>Serial</code>).</td></tr><tr><td>TX</td><td>GPIO1</td><td>UART0 TXD</td><td>Shared with USB. Prints boot messages at 74880 baud.</td></tr><tr><td>SD0 to SD3, CMD, CLK</td><td>GPIO6 to GPIO11</td><td>Connected to the flash chip</td><td><strong>Do not use.</strong> Touching them crashes the chip. SD2 and SD3 (GPIO9, GPIO10) sometimes work as GPIO in DIO flash mode, but avoid them.</td></tr><tr><td>EN</td><td>CH_PD</td><td>Chip enable</td><td>HIGH = chip runs, LOW = off. Already pulled up on the board.</td></tr><tr><td>RST</td><td>RESET</td><td>Reset</td><td>Pull LOW to restart.</td></tr><tr><td>3V3 / VIN / GND</td><td>-</td><td>Power</td><td>3V3 is the regulator output. VIN is the 5 V input (and USB 5 V). Logic is 3.3 V only.</td></tr></table></div>
<h3>Boot modes (set by GPIO0, GPIO2, GPIO15 at reset)</h3>
<div class="tw"><table><tr><th>GPIO15</th><th>GPIO0</th><th>GPIO2</th><th>Result</th></tr><tr><td>LOW</td><td>HIGH</td><td>HIGH</td><td><strong>Normal run:</strong> boot from flash (your program).</td></tr><tr><td>LOW</td><td>LOW</td><td>HIGH</td><td><strong>Flash mode:</strong> wait for a new program over serial (hold the FLASH button, tap RST).</td></tr><tr><td>HIGH</td><td>any</td><td>any</td><td>Boot from SD card (rare). The reason GPIO15 must be LOW.</td></tr></table></div>
<h3>Default bus pins (Arduino core)</h3>
<div class="tw"><table><tr><th>Bus</th><th>Pins</th></tr><tr><td>I2C <code>Wire</code></td><td>SDA = GPIO4 (D2), SCL = GPIO5 (D1). Software I2C, so <code>Wire.begin(sda, scl)</code> can move it to other pins.</td></tr><tr><td>SPI (hardware)</td><td>SCK = GPIO14, MISO = GPIO12, MOSI = GPIO13, CS = GPIO15.</td></tr><tr><td>UART0</td><td>TX = GPIO1, RX = GPIO3. <code>Serial.swap()</code> moves them to GPIO15 (TX) and GPIO13 (RX).</td></tr><tr><td>UART1</td><td>TX only, on GPIO2. Often used for debug output.</td></tr><tr><td>PWM</td><td>Software PWM on GPIO0 to GPIO15 (not GPIO16). Default 1 kHz, values 0 to 1023.</td></tr></table></div>
<h3>Pin rules and cautions (ESP8266)</h3>
<ul><li><strong>Only about 11 pins are really free:</strong> D0 to D8, RX and TX. The rest are flash or boot pins.</li><li><strong>3.3 V only.</strong> About 12 mA per pin is a safe design value.</li><li><strong>One ADC pin.</strong> To read many sensors use an external ADC (for example ADS1115 over I2C) or a multiplexer.</li><li>Wi-Fi sends short current bursts (about 300 mA). A weak USB cable or supply makes the chip reset at random.</li><li>Interrupts work on GPIO0 to GPIO15, not on GPIO16.</li></ul>
<h2 id="pin-esp32">15. ESP32 DevKit Pinout</h2>
<p>This diagram is the very common <strong>30-pin ESP32 DevKit (DOIT DevKit V1, ESP32-WROOM-32)</strong>. A 38-pin DevKitC has the same pins in another order, plus GPIO0, GPIO3 and a few more. The ESP32 has a <strong>GPIO matrix</strong>: most peripheral signals (UART, I2C, SPI, PWM) can be routed to almost any pin. The pins shown are only the defaults.</p>

<h3>Pin description</h3>
<div class="tw"><table><tr><th>Board label</th><th>GPIO</th><th>Functions</th><th>Notes</th></tr><tr><td>VP, VN</td><td>36, 39</td><td>ADC1 only</td><td><strong>Input only.</strong> No output, no internal pull-up or pull-down.</td></tr><tr><td>D34, D35</td><td>34, 35</td><td>ADC1 only</td><td><strong>Input only.</strong> Add an outside resistor for a button.</td></tr><tr><td>D32, D33</td><td>32, 33</td><td>ADC1, touch T9 / T8, RTC</td><td>Good analog pins that still work with Wi-Fi on.</td></tr><tr><td>D25, D26</td><td>25, 26</td><td>DAC1 / DAC2 (8-bit), ADC2</td><td>The only two true analog outputs.</td></tr><tr><td>D27</td><td>27</td><td>ADC2, touch T7</td><td>Free pin.</td></tr><tr><td>D14</td><td>14</td><td>ADC2, touch T6, HSPI CLK</td><td>Outputs a short PWM burst at boot on some boards.</td></tr><tr><td>D12</td><td>12</td><td>ADC2, touch T5, HSPI MISO</td><td><strong>Strapping pin (MTDI).</strong> HIGH at boot selects 1.8 V flash and the board will not start. Keep LOW or floating at power-up.</td></tr><tr><td>D13</td><td>13</td><td>ADC2, touch T4, HSPI MOSI</td><td>Free pin.</td></tr><tr><td>D23, D19, D18, D5</td><td>23, 19, 18, 5</td><td>VSPI: MOSI, MISO, SCK, CS</td><td>Default SPI bus. GPIO5 is a strapping pin (should be HIGH at boot, which it is by default).</td></tr><tr><td>D22, D21</td><td>22, 21</td><td>I2C: SCL, SDA</td><td>Default I2C (<code>Wire</code>). Add 4.7 k pull-ups to 3V3.</td></tr><tr><td>TX0, RX0</td><td>1, 3</td><td>UART0</td><td>Shared with the USB chip: upload and <code>Serial</code>. Prints boot log. Avoid for other uses.</td></tr><tr><td>TX2, RX2</td><td>17, 16</td><td>UART2 (<code>Serial2</code>)</td><td>Free serial port for GPS, modules and so on.</td></tr><tr><td>D4</td><td>4</td><td>ADC2, touch T0</td><td>Free pin.</td></tr><tr><td>D2</td><td>2</td><td>ADC2, touch T2, on-board LED</td><td><strong>Strapping pin.</strong> Must be LOW or floating to enter flash mode. Drives the blue LED on most boards.</td></tr><tr><td>D15</td><td>15</td><td>ADC2, touch T3, HSPI CS</td><td><strong>Strapping pin.</strong> LOW at boot silences the boot log. Prints boot text on UART0 if HIGH (default).</td></tr><tr><td>EN</td><td>CHIP_PU</td><td>Enable / reset</td><td>HIGH = run (pulled up), LOW = reset. The EN button pulls it LOW.</td></tr><tr><td>VIN, 3V3, GND</td><td>-</td><td>Power</td><td>VIN is the 5 V pin (USB 5 V, or feed 5 V here). 3V3 is the regulator output. Logic is 3.3 V only.</td></tr></table></div>
<h3>GPIO groups worth remembering</h3>
<div class="tw"><table><tr><th>Group</th><th>GPIO numbers</th><th>What to know</th></tr><tr><td>Input only</td><td>34, 35, 36, 39</td><td>No output driver, no software pull-up or pull-down.</td></tr><tr><td>Connected to flash</td><td>6, 7, 8, 9, 10, 11</td><td><strong>Never use.</strong> Not even exposed on the 30-pin board.</td></tr><tr><td>Strapping pins</td><td>0, 2, 5, 12, 15</td><td>Read at reset. GPIO0 LOW = flash mode, GPIO2 LOW or open for flash mode, GPIO5 HIGH, GPIO12 LOW, GPIO15 HIGH (LOW mutes boot log).</td></tr><tr><td>ADC1 (use with Wi-Fi)</td><td>32, 33, 34, 35, 36, 39</td><td>12-bit. Safe while Wi-Fi is running.</td></tr><tr><td>ADC2 (not with Wi-Fi)</td><td>0, 2, 4, 12, 13, 14, 15, 25, 26, 27</td><td>The Wi-Fi driver uses ADC2, so <code>analogRead</code> on these fails while Wi-Fi is on.</td></tr><tr><td>Touch</td><td>4, 0, 2, 15, 13, 12, 14, 27, 33, 32 (T0 to T9)</td><td>Capacitive touch input (see section 9).</td></tr><tr><td>DAC</td><td>25, 26</td><td>8-bit analog output, 0 to 3.3 V.</td></tr><tr><td>RTC / deep-sleep wake</td><td>0, 2, 4, 12 to 15, 25 to 27, 32 to 39</td><td>Can wake the chip from deep sleep.</td></tr></table></div>
<h3>Default bus pins (Arduino-ESP32)</h3>
<div class="tw"><table><tr><th>Bus</th><th>Pins</th><th>Notes</th></tr><tr><td>UART0 (<code>Serial</code>)</td><td>TX 1, RX 3</td><td>USB serial.</td></tr><tr><td>UART2 (<code>Serial2</code>)</td><td>TX 17, RX 16</td><td>Move with <code>Serial2.begin(9600, SERIAL_8N1, rx, tx)</code>.</td></tr><tr><td>I2C (<code>Wire</code>)</td><td>SDA 21, SCL 22</td><td>Move with <code>Wire.begin(sda, scl)</code>. Two I2C buses.</td></tr><tr><td>SPI VSPI</td><td>SCK 18, MISO 19, MOSI 23, CS 5</td><td>The usual SPI bus.</td></tr><tr><td>SPI HSPI</td><td>SCK 14, MISO 12, MOSI 13, CS 15</td><td>Second bus. GPIO12 and GPIO15 are strapping pins, so be careful.</td></tr><tr><td>PWM (LEDC)</td><td>Any output pin</td><td>16 channels, you choose frequency and resolution.</td></tr></table></div>
<pre><code>Wire.begin(21, 22);                          // I2C on the default pins
Serial2.begin(9600, SERIAL_8N1, 16, 17);     // UART2: RX = 16, TX = 17
int v = analogRead(34);                      // ADC1 pin, safe with Wi-Fi
dacWrite(25, 128);                           // about 1.65 V on DAC1</code></pre>
<h3>Pin rules and cautions (ESP32)</h3>
<ul><li><strong>3.3 V only.</strong> About 12 mA per pin is a safe design value; 40 mA is the absolute maximum.</li><li>The ADC reads 0 to about 3.3 V and is <strong>not linear near both ends</strong>. Calibrate if you need accuracy.</li><li>Pins D34, D35, VP and VN cannot be outputs, so you cannot light an LED from them.</li><li>Powering a project from VIN while USB is connected: use a diode, or only one source at a time.</li></ul>
<h2 id="pin-stm32">16. STM32F103 (Blue Pill) Pinout</h2>
<p>The Blue Pill carries an <strong>STM32F103C8T6</strong>: ARM Cortex-M3, 72 MHz, 64 KB Flash, 20 KB RAM, in a 48-pin LQFP package. STM32 pins are named by port and number: <code>PA0</code> is bit 0 of port A. Port A, B, C each have up to 16 pins. Chip first, then the board.</p>

<h3>Pin description</h3>
<div class="tw"><table><tr><th>Pin (LQFP)</th><th>Name</th><th>Main functions</th><th>5 V tolerant?</th><th>Notes</th></tr><tr><td>1</td><td>VBAT</td><td>Backup supply</td><td>-</td><td>Coin cell for the RTC and backup registers; tie to 3V3 if unused. Marked VB on the board.</td></tr><tr><td>2</td><td>PC13</td><td>GPIO, TAMPER, RTC</td><td>No</td><td>Drives the <strong>on-board LED (active LOW)</strong>. Weak pin: 3 mA and 2 MHz only.</td></tr><tr><td>3, 4</td><td>PC14, PC15</td><td>32.768 kHz crystal (OSC32)</td><td>No</td><td>Free GPIO only if no RTC crystal is used. Also weak pins.</td></tr><tr><td>5, 6</td><td>PD0, PD1</td><td>8 MHz crystal (OSC_IN / OUT)</td><td>-</td><td>Crystal pins. Not on the Blue Pill headers.</td></tr><tr><td>7</td><td>NRST</td><td>Reset</td><td>-</td><td>LOW resets the chip. Marked R on the board.</td></tr><tr><td>8, 9</td><td>VSSA, VDDA</td><td>Analog supply</td><td>-</td><td>Supply for the ADC. VDDA is the ADC reference, so ADC range is 0 to 3.3 V.</td></tr><tr><td>10</td><td>PA0</td><td>ADC0, TIM2_CH1, WKUP, USART2_CTS</td><td>No</td><td>WKUP can wake the chip from Standby.</td></tr><tr><td>11 to 13</td><td>PA1, PA2, PA3</td><td>ADC1 to 3, TIM2 CH2 to 4, USART2 RTS / TX / RX</td><td>No</td><td>USART2 sits here (PA2 = TX, PA3 = RX).</td></tr><tr><td>14 to 17</td><td>PA4 to PA7</td><td>ADC4 to 7, <strong>SPI1</strong> (NSS, SCK, MISO, MOSI)</td><td>No</td><td>PA6 and PA7 also give TIM3 CH1 and CH2.</td></tr><tr><td>18, 19</td><td>PB0, PB1</td><td>ADC8, ADC9, TIM3 CH3 / CH4</td><td>No</td><td>Last two ADC pins.</td></tr><tr><td>20</td><td>PB2</td><td>BOOT1</td><td>Yes</td><td>Boot selection with BOOT0. After boot it is a normal GPIO. Not on the Blue Pill header (jumper).</td></tr><tr><td>21, 22</td><td>PB10, PB11</td><td><strong>I2C2</strong> SCL / SDA, <strong>USART3</strong> TX / RX</td><td>Yes</td><td>I2C2 and USART3 share these pins; use one at a time.</td></tr><tr><td>25 to 28</td><td>PB12 to PB15</td><td><strong>SPI2</strong> NSS, SCK, MISO, MOSI; TIM1 CH1N to CH3N</td><td>Yes</td><td>Second SPI bus. PB13 to PB15 are the complementary PWM outputs of TIM1.</td></tr><tr><td>29</td><td>PA8</td><td>TIM1_CH1, MCO, USART1_CK</td><td>Yes</td><td>MCO can output the system clock.</td></tr><tr><td>30, 31</td><td>PA9, PA10</td><td><strong>USART1</strong> TX / RX; TIM1 CH2 / CH3</td><td>Yes</td><td>The serial port used by the built-in UART bootloader.</td></tr><tr><td>32, 33</td><td>PA11, PA12</td><td><strong>USB</strong> DM / DP, <strong>CAN</strong> RX / TX, TIM1 CH4</td><td>Yes</td><td>USB and CAN share these pins: not both at once. Many clone boards fit a wrong 10 k pull-up on PA12 (should be 1.5 k), so USB may not enumerate.</td></tr><tr><td>34, 37</td><td>PA13, PA14</td><td><strong>SWDIO, SWCLK</strong> (debug)</td><td>Yes</td><td>Used by the ST-Link. If you reuse them as GPIO you lose the debugger.</td></tr><tr><td>38, 39, 40</td><td>PA15, PB3, PB4</td><td>JTDI, JTDO / SWO, NJTRST</td><td>Yes</td><td>Start up as JTAG pins. Disable JTAG (keep SWD) with the AFIO remap to use them as GPIO.</td></tr><tr><td>41</td><td>PB5</td><td>GPIO, I2C1_SMBA</td><td>No</td><td>Free pin. Not 5 V tolerant.</td></tr><tr><td>42, 43</td><td>PB6, PB7</td><td><strong>I2C1</strong> SCL / SDA; TIM4 CH1 / CH2</td><td>Yes</td><td>Default I2C pins on most libraries.</td></tr><tr><td>44</td><td>BOOT0</td><td>Boot selection</td><td>-</td><td>See the boot modes below.</td></tr><tr><td>45, 46</td><td>PB8, PB9</td><td>TIM4 CH3 / CH4; remapped I2C1 / CAN</td><td>Yes</td><td>Alternate pins for I2C1 and CAN after a remap.</td></tr><tr><td>23, 24, 35, 36, 47, 48</td><td>VSS / VDD</td><td>Power</td><td>-</td><td>Three pairs of 3.3 V and ground. On the Blue Pill they are all connected for you.</td></tr></table></div>

GPIOC->CRH   &amp;= ~(0xFu &lt;&lt; 20);          // clear MODE13 and CNF13
GPIOC->CRH   |=  (0x2u &lt;&lt; 20);          // PC13: output 2 MHz, push-pull
GPIOC->ODR   ^=  (1u &lt;&lt; 13);            // toggle the LED (active LOW)</code></pre>
<h3>Pin rules and cautions (STM32 Blue Pill)</h3>
<ul><li><strong>3.3 V logic.</strong> Pins marked "Yes" above (FT = 5 V tolerant) can take a 5 V input, but only while the chip is powered and with the internal pull resistors off. <strong>PA0 to PA7, PB0, PB1, PB5 and PC13 to PC15 are not 5 V tolerant.</strong> Check the datasheet table for your exact chip.</li><li>About 20 mA per pin is safe, 25 mA is the absolute maximum, and all pins together must stay under about 150 mA.</li><li>The 5V pin is connected to USB 5 V; a regulator makes the 3V3. Do not power from 5V and 3V3 at the same time.</li><li>Do not reuse PA13 and PA14 casually. If you lose SWD, hold BOOT0 HIGH and reset to recover.</li></ul>
<h2 id="pin-pi">17. Raspberry Pi 40-Pin Header</h2>
<p>The Raspberry Pi 3, 4 and 5 (and the Zero) share the same 40-pin header. It is a <strong>computer's</strong> GPIO header, not a microcontroller pinout, but it is where you connect LEDs, sensors and HATs. Pins run in pairs: odd pins on the left (pin 1 has the square pad), even pins on the right.</p>

<h3>Pin description</h3>
<div class="tw"><table><tr><th>Physical pin(s)</th><th>Name</th><th>Function</th><th>Notes</th></tr><tr><td>1, 17</td><td>3V3</td><td>3.3 V power out</td><td>Small current only (the board shares it with the chip). Power sensors, not motors.</td></tr><tr><td>2, 4</td><td>5V</td><td>5 V power</td><td>Wired to the Pi's own 5 V input, so the current is whatever the power supply can give. Never connect a 5 V signal to a GPIO.</td></tr><tr><td>6, 9, 14, 20, 25, 30, 34, 39</td><td>GND</td><td>Ground</td><td>Eight ground pins; use the nearest one.</td></tr><tr><td>3, 5</td><td>GPIO2, GPIO3</td><td>I2C1: SDA1, SCL1</td><td>Fixed 1.8 k pull-ups to 3.3 V are on the board, so no extra resistors are needed.</td></tr><tr><td>8, 10</td><td>GPIO14, GPIO15</td><td>UART0: TXD0, RXD0</td><td>Serial port. Turn off the login console first with <code>raspi-config</code>.</td></tr><tr><td>19, 21, 23, 24, 26</td><td>GPIO10, 9, 11, 8, 7</td><td>SPI0: MOSI, MISO, SCLK, CE0, CE1</td><td>First SPI bus. Enable it in <code>raspi-config</code>.</td></tr><tr><td>35, 38, 40, 36</td><td>GPIO19, 20, 21, 16</td><td>SPI1: MISO, MOSI, SCLK, CE0</td><td>Second SPI bus (auxiliary).</td></tr><tr><td>12, 32, 33, 35</td><td>GPIO18, 12, 13, 19</td><td>Hardware PWM: PWM0, PWM0, PWM1, PWM1</td><td>Only 2 PWM channels exist, shared by these pins. Use them for servos and audio.</td></tr><tr><td>12, 35, 38, 40</td><td>GPIO18, 19, 20, 21</td><td>PCM / I2S audio</td><td>Digital audio to DACs and microphones.</td></tr><tr><td>7</td><td>GPIO4</td><td>GPCLK0, 1-Wire default</td><td>Default pin for DS18B20 temperature sensors.</td></tr><tr><td>27, 28</td><td>GPIO0, GPIO1</td><td>ID_SD, ID_SC (HAT EEPROM)</td><td><strong>Reserved.</strong> Used to identify HATs. Leave unconnected.</td></tr><tr><td>11, 13, 15, 16, 18, 22, 29, 31, 37</td><td>GPIO17, 27, 22, 23, 24, 25, 5, 6, 26</td><td>Plain GPIO</td><td>Free pins for buttons, LEDs, relays.</td></tr></table></div>
<h3>Numbering: BOARD or BCM?</h3>
<div class="tw"><table><tr><th>Mode</th><th>Meaning</th><th>Name of the 6th pin down the left column</th></tr><tr><td>BOARD</td><td>Physical pin number (1 to 40).</td><td>11</td></tr><tr><td>BCM</td><td>The chip's GPIO number (the name in the diagram).</td><td>17 (GPIO17)</td></tr></table></div>
<p>Write down which mode you use. <code>GPIO.setmode(GPIO.BCM)</code> and <code>GPIO.setmode(GPIO.BOARD)</code> give different pins for the same number.</p>
<h3>Pin rules and cautions (Raspberry Pi)</h3>
<ul><li><strong>3.3 V only; not 5 V tolerant.</strong> A 5 V signal can kill the pin or the whole chip. Use a level shifter or a voltage divider.</li><li>About 16 mA per pin is the design limit, and about 50 mA across all pins. Use a transistor for anything bigger than an LED.</li><li><strong>No ADC.</strong> The Pi cannot read analog voltages. Add an MCP3008 (SPI) or ADS1115 (I2C).</li><li>Most models pull GPIO0 to GPIO8 up and GPIO9 to GPIO27 down at start-up, so an output may glitch briefly at boot.</li><li>The Raspberry Pi 5 does not support the old <code>RPi.GPIO</code> library; use <code>gpiozero</code> or <code>lgpio</code>.</li><li>The command <code>pinout</code> prints this diagram in the terminal of your own Pi.</li></ul>
<h2 id="pin-pico">18. Raspberry Pi Pico (RP2040) Pinout</h2>
<p>The <strong>Pico</strong> is the real microcontroller from the Raspberry Pi family: dual-core Cortex-M0+, 133 MHz, 264 KB RAM, 2 MB Flash, 3.3 V. The pin numbers (1 to 40) run down the left side and up the right side. Its GPIO are called <code>GP0</code> to <code>GP28</code> (not the BCM numbers of the big Pi).</p>

<h3>Pin description</h3>
<div class="tw"><table><tr><th>Pin(s)</th><th>Name</th><th>Function</th><th>Notes</th></tr><tr><td>1 to 2, 4 to 7, 9 to 12, 14 to 17, 19 to 22, 24 to 27, 29</td><td>GP0 to GP22</td><td>Digital GPIO with UART, I2C, SPI and PWM options</td><td>3.3 V only. Drive strength 2, 4, 8 or 12 mA (set in software). Keep each pin under 12 mA.</td></tr><tr><td>31, 32, 34</td><td>GP26, GP27, GP28</td><td>ADC0, ADC1, ADC2 (12-bit) or GPIO</td><td>The only three ADC pins on the header. A fourth, ADC3, reads the board's VSYS voltage and ADC4 is the internal temperature sensor.</td></tr><tr><td>35</td><td>ADC_VREF</td><td>ADC reference input</td><td>Connected to 3V3 through a filter. Feed a clean 3.0 V here for better ADC accuracy.</td></tr><tr><td>33</td><td>AGND</td><td>Analog ground</td><td>Use as the ground for analog sensors.</td></tr><tr><td>36</td><td>3V3 (OUT)</td><td>3.3 V regulator output</td><td>Powers small parts. The regulator is small, so use an outside supply for motors and LED strips.</td></tr><tr><td>37</td><td>3V3_EN</td><td>Regulator enable</td><td>Pull LOW to switch the 3.3 V rail off. It is pulled up by default.</td></tr><tr><td>39</td><td>VSYS</td><td>Main supply input (1.8 to 5.5 V)</td><td>Feed a battery or regulator here. A diode joins it to VBUS.</td></tr><tr><td>40</td><td>VBUS</td><td>USB 5 V</td><td>5 V from the USB cable. Only present when USB is plugged in.</td></tr><tr><td>30</td><td>RUN</td><td>Reset</td><td>Pull LOW to reset the chip.</td></tr><tr><td>3, 8, 13, 18, 23, 28, 38</td><td>GND</td><td>Ground</td><td>Seven digital ground pins.</td></tr><tr><td>-</td><td>GP25</td><td>On-board LED</td><td>Not on the header. (On the Pico W the LED is on the wireless chip instead.)</td></tr><tr><td>-</td><td>BOOTSEL button</td><td>USB mass-storage boot mode</td><td>Hold it while plugging in USB; the Pico appears as a drive and you drag a <code>.uf2</code> file onto it.</td></tr></table></div>
<h3>How the Pico pin mux works</h3>
<p>Every function repeats in a fixed pattern, so you can work out the pins without a table:</p>
<div class="tw"><table><tr><th>Peripheral</th><th>Pins</th><th>Rule</th></tr><tr><td>UART0 / UART1</td><td>TX: GP0, 12, 16, 28 / GP4, 8, 20. RX: GP1, 13, 17 / GP5, 9, 21</td><td>Pins in groups of 4 repeat the same signal.</td></tr><tr><td>I2C0 / I2C1</td><td>I2C0 SDA: 0, 4, 8, 12, 16, 20, 28; SCL: 1, 5, 9, 13, 17, 21. I2C1 SDA: 2, 6, 10, 14, 18, 22, 26; SCL: 3, 7, 11, 15, 19, 27</td><td>SDA pins are even, SCL pins are odd. Pick an SDA / SCL pair of the same bus (for example GP4 and GP5).</td></tr><tr><td>SPI0 / SPI1</td><td>SPI0 RX / CSn / SCK / TX: GP0 to GP3, GP4 to GP7, GP16 to GP19, GP20 to GP22. SPI1: GP8 to GP11, GP12 to GP15, GP26 to GP28</td><td>Each group of four follows RX, CSn, SCK, TX.</td></tr><tr><td>PWM</td><td>All GPIO. Slice number = (GPn / 2) mod 8; even pins are channel A, odd are B</td><td>8 slices x 2 channels = 16 PWM outputs. GP0 and GP16 share slice 0 (same frequency).</td></tr><tr><td>PIO</td><td>Any GPIO</td><td>8 tiny programmable state machines that can create custom protocols (WS2812 LEDs, VGA).</td></tr></table></div>
<pre><code>gpio_init(25);                 // Pico C SDK: the on-board LED
gpio_set_dir(25, GPIO_OUT);
gpio_put(25, 1);               // LED on</code></pre>
<h3>Pin rules and cautions (Pico)</h3>
<ul><li><strong>3.3 V only.</strong> GPIO are not 5 V tolerant.</li><li>26 usable GPIO in all: GP0 to GP22 and GP26 to GP28. GP23, GP24 and GP29 are used inside the board.</li><li>Only three analog pins. Do not use GP26 to GP28 as digital pins if you need ADC later.</li><li>Power from VSYS (not VBUS) for a battery, so the USB diode can protect the cable.</li></ul>
<h2 id="pin-compare">19. Pinout Comparison and Wiring Checklist</h2>
<p>A single table for exams and interviews. Numbers are for the specific board in this part of the guide.</p>

td><td>RUN (pin 30)</td></tr><tr><td>Boot / flash pin</td><td>None (bootloader on reset)</td><td>GPIO0 (FLASH button)</td><td>GPIO0 (BOOT button)</td><td>BOOT0 jumper</td><td>None (SD card)</td><td>BOOTSEL button</td></tr><tr><td>Pins to avoid</td><td>D0, D1 while uploading</td><td>GPIO0, 2, 15 at boot; GPIO6 to 11</td><td>GPIO6 to 11; strapping 0, 2, 5, 12, 15</td><td>PA11, PA12 (USB), PA13, PA14 (SWD), PC13 to PC15</td><td>GPIO0, GPIO1 (HAT ID)</td><td>GP23, 24, 29 (internal)</td></tr></table></div>
<h3>Final wiring checklist</h3>
<ul><li>Same ground everywhere.</li><li>Right voltage: never 5 V into a 3.3 V pin (ESP, STM32 Blue Pill unless FT, Pi, Pico).</li><li>The pin really supports the peripheral you need (ADC, PWM, I2C).</li><li>Not a flash, strapping, USB, debug or reserved pin.</li><li>Current: motors, relays, buzzers and LED strips go through a transistor or driver.</li><li>I2C has pull-up resistors; buttons have a pull-up or pull-down (or use <code>INPUT_PULLUP</code>).</li></ul>
<h1 id="part-d">Part D: Interview Questions</h1>
<h2 id="interview">20. Interview Questions with Short Answers</h2>
<ul>
<li><strong>MPU vs MCU?</strong> An MPU is a CPU only and needs external parts. An MCU has CPU, memory and I/O on one chip.</li>
<li><strong>What is the ESP32?</strong> A low-cost Wi-Fi + Bluetooth dual-core MCU from Espressif, 3.3 V logic.</li>
<li><strong>ESP8266 vs ESP32?</strong> ESP32 has two cores, Bluetooth, more pins, touch sensing and more RAM.</li>
<li><strong>Arduino vs STM32?</strong> Arduino Uno is 8-bit, 5 V and beginner friendly. STM32 is 32-bit ARM, faster and used in products.</li>
<li><strong>Is Raspberry Pi a microcontroller?</strong> No. It is a single-board computer with a microprocessor running Linux.</li>
<li><strong>Why 3.3 V logic?</strong> Lower power and heat, and it suits modern fast chips.</li>
<li><strong>Why can't a pin drive a motor?</strong> It supplies only milliamps. Use a transistor or driver.</li>
<li><strong>What is an RTOS and when do you need one?</strong> It runs multiple tasks with deadlines; use it when many jobs must run on time.</li>
<li><strong>Flash vs RAM?</strong> Flash keeps the program with power off. RAM holds variables and is lost at power off.</li>
<li><strong>What is a watchdog timer?</strong> A timer that resets the chip if the program hangs.</li>
<li><strong>Pin number vs GPIO number?</strong> The pin number is the physical leg or header position. The GPIO number is the chip's own name for it (GPIO18 is physical pin 12 on a Raspberry Pi). Board labels such as D5 are a third name.</li>
<li><strong>What is pin multiplexing?</strong> One pin can do several jobs (GPIO, UART, SPI, PWM). A register selects the job (alternate function), so two peripherals cannot use the same pin at once.</li>
<li><strong>Which Arduino Uno pins are I2C, SPI and UART?</strong> I2C: A4 (SDA) and A5 (SCL). SPI: D10 (SS), D11 (MOSI), D12 (MISO), D13 (SCK). UART: D0 (RX) and D1 (TX).</li>
<li><strong>What are strapping pins on the ESP32 and ESP8266?</strong> Pins read once at reset to choose the boot mode (ESP32: GPIO0, 2, 5, 12, 15. ESP8266: GPIO0, 2, 15). A wrong level at power-up stops the program from starting.</li>
<li><strong>Why can't you use GPIO6 to GPIO11 on an ESP32?</strong> They are wired to the on-board SPI flash that holds your program. Using them crashes the chip.</li>
<li><strong>Why does analogRead fail on some ESP32 pins when Wi-Fi is on?</strong> Those pins belong to ADC2, which the Wi-Fi driver uses. Use ADC1 pins (GPIO32 to 39).</li>
<li><strong>How do you know if an STM32 pin is 5 V tolerant?</strong> The datasheet pin table marks it "FT". On the Blue Pill, PA0 to PA7, PB0, PB1, PB5 and PC13 to PC15 are not.</li>
<li><strong>Why is the STM32 Blue Pill LED on PC13 "backwards"?</strong> It is wired to 3.3 V, so the pin must go LOW to turn it on (active LOW).</li>
<li><strong>Is it safe to connect a 5 V sensor output to a Raspberry Pi GPIO?</strong> No. Raspberry Pi pins are 3.3 V only. Use a level shifter or a divider.</li>
</ul></template>

<h1 id="part-a-detailed-guide">Part A: Detailed Guide</h1>
<h2 id="c-history">0. Who Invented C, and Why</h2>
<p><strong>The problem (late 1960s):</strong> Operating systems were written in assembly language, which is different for every machine, so a program written for one computer had to be rewritten completely for another. Ken Thompson and Dennis Ritchie at Bell Labs wanted to write <strong>Unix</strong> in a language that was close to the hardware but still portable.</p>
<p><strong>The steps:</strong> Martin Richards made <strong>BCPL</strong> (1967). Ken Thompson shrank it into <strong>B</strong> (about 1969). B had no data types, which was a problem on newer machines. <strong>Dennis Ritchie</strong> added types and structures and finished <strong>C</strong> around <strong>1972</strong>. In 1973 Unix was rewritten in C, proving that an entire operating system could be portable.</p>
<div class="tw"><table><tr><th>Year</th><th>Event</th><th>Who</th></tr>
<tr><td>1967</td><td>BCPL</td><td>Martin Richards</td></tr>
<tr><td>about 1969</td><td>B language</td><td>Ken Thompson</td></tr>
<tr><td>1972</td><td>C created at Bell Labs</td><td>Dennis Ritchie</td></tr>
<tr><td>1978</td><td>"The C Programming Language" book (K&amp;R C)</td><td>Kernighan and Ritchie</td></tr>
<tr><td>1979 / 1985</td><td>C++ (C with classes) begins / is released</td><td>Bjarne Stroustrup</td></tr>
<tr><td>1989 / 1990</td><td>ANSI C (C89), then ISO C90, the first official standard</td><td>ANSI / ISO</td></tr>
<tr><td>1999, 2011, 2017, 2024</td><td>C99, C11, C17 and C23 (published 2024) add new features and fixes</td><td>ISO</td></tr>
</table></div>
<p><strong>Why C still rules embedded systems:</strong> it gives direct access to memory and registers, produces tiny fast programs, needs no operating system, and the same code can be recompiled for AVR, ARM, ESP32 and more.</p>

<h2 id="1-how-c-works">1. How C Works</h2>
<p>C is a compiled, procedural, low-level language. Source code goes through four stages: preprocessing (<code>#include</code>, <code>#define</code>), compilation (to assembly), assembly (to an object file), and linking (to an executable).</p>
<pre><code>#include &lt;stdio.h&gt;</code></pre>
<pre><code>int main(void) {
    printf(&quot;Hello, C\n&quot;);
    return 0;
}</code></pre>
<p>Compile with <code>gcc -Wall -Wextra -g main.c -o main</code>. Always turn warnings on and take them seriously.</p>
<h2 id="2-data-types-and-operators">2. Data Types and Operators</h2>
<ul>
<li>Integers: <code>char</code>, <code>short</code>, <code>int</code>, <code>long</code>, <code>long long</code>, each <code>signed</code> or <code>unsigned</code>. Use <code>&lt;stdint.h&gt;</code> (<code>int32_t</code>, <code>uint8_t</code>) when exact size matters.</li>
<li>Floating point: <code>float</code>, <code>double</code>. Never compare with <code>==</code>; compare with a small tolerance.</li>
<li>Sizes are implementation-defined. Typical 64-bit: char 1, short 2, int 4, long 8 (Linux/macOS), float 4, double 8, pointer 8. Use <code>sizeof</code>.</li>
<li>Integer promotion: <code>char</code> and <code>short</code> are promoted to <code>int</code> in expressions. Mixing signed and unsigned converts the signed value to unsigned, a classic bug (<code>-1 &lt; 1u</code> is false).</li>
<li>Signed overflow is undefined behavior. Unsigned overflow wraps around.</li>
<li>Integer division truncates toward zero. <code>%</code> takes the sign of the left operand.</li>
<li><code>&amp;&amp;</code> and <code>||</code> short-circuit. Mixing up <code>=</code> and <code>==</code> is a frequent mistake.</li>
<li>Precedence trap: <code>a &amp; b == c</code> parses as <code>a &amp; (b == c)</code>. Use parentheses.</li>
</ul>
<h2 id="3-control-flow">3. Control Flow</h2>
<p><code>if/else</code>, <code>switch</code> (needs <code>break</code> or it falls through; case labels must be integer constants), <code>for</code>, <code>while</code>, <code>do-while</code>, <code>break</code>, <code>continue</code>, and <code>goto</code> (rare, mostly for cleanup in error paths).</p>
<h2 id="4-functions">4. Functions</h2>
<ul>
<li>C is always pass by value. To modify the caller&#x27;s variable, pass a pointer.</li>
<li>Declare prototypes in headers; define functions in .c files.</li>
<li>Arrays decay to pointers when passed, so also pass the length.</li>
<li>Recursion uses the stack; each call has a stack frame. Very deep recursion causes stack overflow.</li>
<li>Use <code>int main(void)</code> or <code>int main(int argc, char *argv[])</code>. Never <code>void main()</code>.</li>
<li>Variadic functions (like <code>printf</code>) use <code>&lt;stdarg.h&gt;</code>: <code>va_list</code>, <code>va_start</code>, <code>va_arg</code>, <code>va_end</code>.</li>
</ul>
<h2 id="5-arrays-and-strings">5. Arrays and Strings</h2>
<pre><code>int a[5] = {1, 2, 3};      // remaining elements are zero
int b[] = {1, 2, 3, 4};    // size deduced as 4
char s1[] = &quot;hello&quot;;       // modifiable copy, 6 bytes
char *s2 = &quot;hello&quot;;        // points to read-only literal</code></pre>
<ul>
<li>A string is a <code>char</code> array ending with <code>&#x27;\0&#x27;</code>.</li>
<li><code>sizeof(arr)</code> gives total bytes only where <code>arr</code> is a real array, not a function parameter.</li>
<li>Out-of-bounds access is undefined behavior; C does no bounds checking.</li>
<li>Key functions: <code>strlen</code>, <code>strcmp</code>, <code>strcpy</code>, <code>strncpy</code>, <code>strcat</code>, <code>strstr</code>, <code>strchr</code>, <code>memcpy</code>, <code>memmove</code>, <code>memset</code>. Use <code>memmove</code> if regions overlap.</li>
<li><code>strncpy</code> does not always null-terminate. Prefer <code>snprintf</code> for safe formatting.</li>
<li>Never use <code>gets()</code>. Use <code>fgets()</code>.</li>
<li>2D arrays are stored row-major: <code>int m[3][4]</code> is 12 contiguous ints.</li>
</ul>
<h2 id="6-pointers-the-heart-of-c">6. Pointers (the Heart of C)</h2>
<p>A pointer stores a memory address.</p>
<pre><code>int x = 10;
int *p = &amp;x;     // p holds the address of x
*p = 20;         // x is now 20
int **pp = &amp;p;   // pointer to pointer</code></pre>
<p><strong>Key rules</strong></p>
<ul>
<li>Pointer arithmetic scales by element size: <code>p + 1</code> advances by <code>sizeof(*p)</code> bytes.</li>
<li><code>a[i]</code> is exactly <code>*(a + i)</code>.</li>
<li>An array name is not a pointer, but it decays to one in most expressions (exceptions: <code>sizeof</code> and <code>&amp;</code>).</li>
<li><code>void *</code> is a generic pointer; you cannot dereference it or do arithmetic on it directly.</li>
<li>Dereferencing <code>NULL</code> crashes (segmentation fault). Always check the return of <code>malloc</code> and <code>fopen</code>.</li>
<li>Pointer subtraction gives the element count between two pointers (type <code>ptrdiff_t</code>).</li>
</ul>
<p><strong>const with pointers</strong> (read right to left)</p>
<ul>
<li><code>const int *p</code>: value is read-only, pointer can move.</li>
<li><code>int *const p</code>: pointer is fixed, value can change.</li>
<li><code>const int *const p</code>: both fixed.</li>
</ul>
<p><strong>Pointer expressions interviewers love</strong></p>
<ul>
<li><code>*p++</code>: use the value, then increment the pointer.</li>
<li><code>(*p)++</code>: increment the value.</li>
<li><code>*++p</code>: increment the pointer, then use the value.</li>
<li><code>++*p</code>: increment the value, then use it.</li>
</ul>
<p>Pointer to array vs array of pointers: <code>int (*p)[5]</code> is a pointer to an array of 5 ints; <code>int *p[5]</code> is an array of 5 int pointers.</p>
<h2 id="7-dynamic-memory">7. Dynamic Memory</h2>
<pre><code>int *p = malloc(n * sizeof *p);
if (p == NULL) { /* handle failure */ }</code></pre>
<pre><code>int *q = realloc(p, 2 * n * sizeof *p);
if (q == NULL) { free(p); /* handle failure */ }
else p = q;</code></pre>
<pre><code>free(p);
p = NULL;</code></pre>
<ul>
<li><code>malloc</code> returns uninitialized memory. <code>calloc(n, size)</code> zero-initializes.</li>
<li><code>realloc</code> may move the block, so assign its result to a temporary first.</li>
<li>Every <code>malloc</code> needs exactly one <code>free</code>.</li>
<li>Memory bugs: leak (never freed), dangling pointer (use after free), double free, buffer overflow, uninitialized read, wild pointer (never initialized).</li>
<li>Never return a pointer to a local variable; it lives on the stack and dies when the function returns.</li>
<li>Stack: automatic, fast, limited size, holds locals. Heap: manual, larger, slower, persists until freed. Also: data segment (initialized globals), BSS (uninitialized globals, zeroed), text segment (code).</li>
</ul>
<h2 id="8-structs-unions-enums-typedef">8. Structs, Unions, Enums, typedef</h2>
<pre><code>typedef struct {
    int id;
    char name[32];
} Student;</code></pre>
<pre><code>Student s = { .id = 1, .name = &quot;Asha&quot; };
Student *ps = &amp;s;
ps-&gt;id = 2;          // same as (*ps).id</code></pre>
<ul>
<li>Structs are copied by value on assignment and when passed to functions.</li>
<li>Padding: the compiler inserts bytes so members align. <code>sizeof</code> a struct can exceed the sum of its members. Order members from largest to smallest to reduce size. Use <code>offsetof</code> to inspect.</li>
<li>A union shares one memory block among its members; its size equals the largest member. Reading a member other than the one last written reinterprets the bytes: allowed in C, but the result is machine dependent and may be a trap value.</li>
<li><code>enum</code> constants are integers starting at 0.</li>
<li>Bit-fields (<code>unsigned flag : 1;</code>) pack bits, but their layout is implementation-defined.</li>
<li>Flexible array member: <code>struct { int n; int data[]; }</code> allocated with <code>malloc(sizeof(struct) + n * sizeof(int))</code>.</li>
</ul>
<h2 id="9-storage-classes-and-qualifiers">9. Storage Classes and Qualifiers</h2>
<ul>
<li><code>auto</code>: default for locals.</li>
<li><code>static</code> local: initialized once, keeps its value across calls, lives in the data segment.</li>
<li><code>static</code> global or function: visible only inside that file (internal linkage).</li>
<li><code>extern</code>: declares a variable or function defined in another file.</li>
<li><code>register</code>: a hint, mostly ignored; you cannot take its address.</li>
<li><code>const</code>: read-only. In C, a <code>const</code> variable is not a compile-time constant.</li>
<li><code>volatile</code>: the value may change unexpectedly (hardware registers, interrupt handlers), so the compiler must not optimize reads away. It does not give thread safety.</li>
<li><code>restrict</code>: a promise that a pointer is the only access to that memory, enabling optimizations.</li>
<li><code>inline</code>: a suggestion to inline a function.</li>
</ul>
<h2 id="10-preprocessor">10. Preprocessor</h2>
<pre><code>#define PI 3.14159
#define SQUARE(x) ((x) * (x))
#define MAX(a, b) ((a) &gt; (b) ? (a) : (b))</code></pre>
<pre><code>#ifndef MYHEADER_H
#define MYHEADER_H
/* declarations */
#endif</code></pre>
<ul>
<li>Macros are text substitution with no type checking. <code>SQUARE(i++)</code> evaluates <code>i++</code> twice (bug). Always parenthesize arguments and the whole body.</li>
<li><code>#</code> stringifies an argument; <code>##</code> pastes tokens.</li>
<li>Include guards (or <code>#pragma once</code>) prevent double inclusion.</li>
<li><code>#include &lt;file&gt;</code> searches system paths; <code>#include &quot;file&quot;</code> searches the local directory first.</li>
<li>Conditional compilation: <code>#if</code>, <code>#ifdef</code>, <code>#else</code>, <code>#endif</code>. Predefined: <code>__FILE__</code>, <code>__LINE__</code>, <code>__func__</code>.</li>
<li>Prefer <code>const</code> and <code>enum</code> over macros for constants, and <code>static inline</code> over function-like macros.</li>
</ul>
<h2 id="11-file-i-o">11. File I/O</h2>
<pre><code>FILE *f = fopen(&quot;data.txt&quot;, &quot;r&quot;);
if (!f) { perror(&quot;fopen&quot;); return 1; }
char line[256];
while (fgets(line, sizeof line, f)) {
    printf(&quot;%s&quot;, line);
}
fclose(f);</code></pre>
<ul>
<li>Modes: <code>r</code>, <code>w</code> (truncates), <code>a</code> (append), <code>r+</code>, <code>w+</code>, <code>a+</code>; add <code>b</code> for binary.</li>
<li>Functions: <code>fprintf</code>, <code>fscanf</code>, <code>fgets</code>, <code>fputs</code>, <code>fread</code>, <code>fwrite</code>, <code>fseek</code>, <code>ftell</code>, <code>rewind</code>, <code>feof</code>, <code>fflush</code>.</li>
<li>Do not loop on <code>while (!feof(f))</code>; check the return value of the read instead.</li>
<li><code>stdin</code>, <code>stdout</code>, <code>stderr</code> are always open. <code>stdout</code> is buffered; <code>stderr</code> is not.</li>
<li><code>scanf</code> returns the number of items read; always check it. <code>%s</code> without a width can overflow, so use <code>%31s</code>.</li>
</ul>
<h2 id="12-bitwise-operations">12. Bitwise Operations</h2>
<pre><code>x &amp; (1u &lt;&lt; n)       // test bit n
x |= (1u &lt;&lt; n);     // set bit n
x &amp;= ~(1u &lt;&lt; n);    // clear bit n
x ^= (1u &lt;&lt; n);     // toggle bit n
x &amp; (x - 1)         // clear lowest set bit
x &amp; -x              // isolate lowest set bit
(x &amp; (x - 1)) == 0  // power of two (x &gt; 0)</code></pre>
<ul>
<li>Count set bits: loop with <code>x &amp;= x - 1</code> (Brian Kernighan&#x27;s method).</li>
<li>Right shift of negative signed values is implementation-defined; shifting by the width or more is undefined.</li>
<li>Swap without a temp: <code>a ^= b; b ^= a; a ^= b;</code> (fails if both refer to the same variable).</li>
<li>Endianness check: <code>int n = 1; *(char *)&amp;n == 1</code> means little endian.</li>
</ul>
<h2 id="13-function-pointers-and-callbacks">13. Function Pointers and Callbacks</h2>
<pre><code>int add(int a, int b) { return a + b; }
int (*op)(int, int) = add;
int r = op(2, 3);</code></pre>
<pre><code>qsort(arr, n, sizeof arr[0], cmp);   // cmp is a callback</code></pre>
<p>Uses: callbacks, dispatch tables, simple polymorphism, plugin-style design.</p>
<h2 id="14-undefined-behavior">14. Undefined Behavior</h2>
<ul>
<li><strong>Undefined:</strong> out-of-bounds access, null dereference, signed overflow, use after free, modifying a string literal, unsequenced modification (<code>i = i++ + ++i</code>), reading uninitialized variables, using the value of a non-void function that lacks a return.</li>
<li><strong>Unspecified:</strong> order of evaluation of function arguments.</li>
<li><strong>Implementation-defined:</strong> size of int, signedness of plain char, struct padding.</li>
<li>With undefined behavior anything can happen, including appearing to work.</li>
</ul>
<h2 id="15-data-structures-to-implement">15. Data Structures to Implement</h2>
<p>Do each of these at least once, with full memory management:</p>
<ul>
<li>Dynamic array (vector) with resize</li>
<li>Singly and doubly linked list (insert, delete, reverse, find middle, detect cycle)</li>
<li>Stack and queue (array and linked-list versions)</li>
<li>Circular buffer</li>
<li>Hash table with chaining</li>
<li>Binary search tree (insert, search, delete, traversals)</li>
<li>Min-heap / priority queue</li>
<li>String library: <code>strlen</code>, <code>strcpy</code>, <code>strcmp</code>, <code>strstr</code>, <code>atoi</code>, <code>itoa</code>, <code>memcpy</code>, <code>memmove</code></li>
</ul>
<h2 id="16-interview-questions-with-answers">16. Interview Questions with Answers</h2>
<p><strong>Difference between malloc and calloc? </strong><code>calloc</code> takes count and size and zeroes the memory; <code>malloc</code> takes total bytes and leaves it uninitialized.</p>
<p><strong>What is a dangling pointer? </strong>A pointer to memory that has been freed or gone out of scope. Fix: set it to <code>NULL</code> after <code>free</code>; never return addresses of locals.</p>
<p><strong>What is a memory leak? </strong>Heap memory that was allocated but never freed and is no longer reachable.</p>
<p><strong>Stack vs heap? </strong>Stack is automatic, fast, small, with LIFO frames. Heap is manual, flexible, larger, and can fragment.</p>
<p><strong>What does static do? </strong>Local: persists between calls. Global or function: limits visibility to the file.</p>
<p><strong>const vs #define? </strong><code>const</code> has a type and scope and shows in the debugger; <code>#define</code> is untyped text replacement.</p>
<p><strong>Array vs pointer? </strong>An array is a block of storage; a pointer is a variable holding an address. Arrays decay to pointers, but <code>sizeof</code> and <code>&amp;</code> treat them differently.</p>
<p><strong>Why is a write to a string literal a bug? </strong><code>char *s = &quot;abc&quot;; s[0] = &#x27;x&#x27;;</code> modifies a string literal, which is undefined behavior. Use <code>char s[] = &quot;abc&quot;;</code> instead.</p>
<p><strong>What is void pointer? </strong>A generic pointer; it must be cast before dereferencing. <code>malloc</code> returns it.</p>
<p><strong>struct vs union? </strong>Struct members have separate storage; union members overlap in the same memory.</p>
<p><strong>What is a segmentation fault? </strong>Access to memory the process may not touch: null or wild pointers, stack overflow, writing read-only memory.</p>
<p><strong>What is volatile for? </strong>It stops the compiler from caching or optimizing away reads of a variable that can change outside normal program flow.</p>
<p><strong>i++ vs ++i? </strong>Both increment; the value of the expression differs (old value vs new value).</p>
<p><strong>Common macro pitfalls? </strong>Double evaluation of arguments and missing parentheses.</p>
<p><strong>When is sizeof evaluated? </strong>At compile time (except for variable-length arrays).</p>
<p><strong>How do you avoid buffer overflow? </strong>Check lengths, use <code>fgets</code>, <code>snprintf</code>, and <code>strncpy</code> with explicit termination, and validate all input sizes.</p>
<p><strong>What is memory alignment? </strong>Hardware prefers data at addresses that are multiples of its size; compilers pad structs for this.</p>
<p><strong>What if you free the same pointer twice? </strong>Undefined behavior; usually heap corruption or a crash.</p>
<p><strong>memcpy vs memmove? </strong><code>memmove</code> handles overlapping regions correctly; <code>memcpy</code> does not.</p>
<p><strong>What is a reentrant function? </strong>One that is safe to call again before a previous call finishes (no static or global state). Required for interrupt handlers and threads.</p>
<p><strong>What is the difference between a macro and an inline function? </strong>A macro is expanded by the preprocessor with no type checking; an inline function is type-checked and evaluates its arguments once.</p>
<p><strong>What is a null pointer vs an uninitialized pointer? </strong>A null pointer deliberately points to nothing and can be tested. An uninitialized pointer holds a garbage address and cannot be tested safely.</p>
<p><strong>What are the different memory segments of a C program? </strong>Text (code), initialized data, BSS (zero-initialized data), heap, and stack.</p>
<p><strong>What does extern do? </strong>It declares that a variable or function is defined in another translation unit, without allocating storage.</p>

<h2 id="b6-bit-manipulation-tricks">B6. Bit Manipulation Tricks</h2>
<pre><code>x &amp; (1u &lt;&lt; n)          // test bit n
x |  (1u &lt;&lt; n)         // set bit n
x &amp; ~(1u &lt;&lt; n)         // clear bit n
x ^  (1u &lt;&lt; n)         // toggle bit n
x &amp; (x - 1)            // clear lowest set bit
x &amp; -x                 // isolate lowest set bit
(x &amp; (x - 1)) == 0     // power of two (x &gt; 0)
x &lt;&lt; k                 // multiply by 2^k
x &gt;&gt; k                 // divide by 2^k (unsigned)
(x &gt;&gt; n) &amp; 1u          // extract bit n
(x &gt;&gt; p) &amp; ((1u &lt;&lt; w) - 1)   // extract w bits starting at bit p</code></pre>
<pre><code>// Count set bits (Kernighan)
int count = 0;
while (x) { x &amp;= x - 1; count++; }</code></pre>
<h2 id="b7-must-know-code-snippets">B7. Must-Know Code Snippets</h2>
<h3 id="swap-using-a-temporary-and-using-a-pointer">Swap using a temporary and using a pointer</h3>
<pre><code>void swap(int *a, int *b) {
    int t = *a;
    *a = *b;
    *b = t;
}</code></pre>
<h3 id="string-length-and-string-copy">String length and string copy</h3>
<pre><code>size_t my_strlen(const char *s) {
    const char *p = s;
    while (*p) p++;
    return p - s;
}</code></pre>
<pre><code>char *my_strcpy(char *d, const char *s) {
    char *r = d;
    while ((*d++ = *s++)) ;
    return r;
}</code></pre>
<h3 id="reverse-a-string-in-place">Reverse a string in place</h3>
<pre><code>void reverse(char *s) {
    int i = 0, j = strlen(s) - 1;
    while (i &lt; j) {
        char t = s[i];
        s[i++] = s[j];
        s[j--] = t;
    }
}</code></pre>
<h3 id="linked-list-node-and-reverse">Linked list node and reverse</h3>
<pre><code>struct Node { int data; struct Node *next; };</code></pre>
<pre><code>struct Node *reverse_list(struct Node *head) {
    struct Node *prev = NULL, *cur = head;
    while (cur) {
        struct Node *next = cur-&gt;next;
        cur-&gt;next = prev;
        prev = cur;
        cur = next;
    }
    return prev;
}</code></pre>
<h3 id="detect-a-cycle-floyd">Detect a cycle (Floyd)</h3>
<pre><code>int has_cycle(struct Node *head) {
    struct Node *slow = head, *fast = head;
    while (fast &amp;&amp; fast-&gt;next) {
        slow = slow-&gt;next;
        fast = fast-&gt;next-&gt;next;
        if (slow == fast) return 1;
    }
    return 0;
}</code></pre>
<h3 id="atoi-with-sign-handling">atoi with sign handling</h3>
<pre><code>int my_atoi(const char *s) {
    int sign = 1, n = 0;
    while (*s == &#x27; &#x27;) s++;
    if (*s == &#x27;-&#x27;) { sign = -1; s++; }
    else if (*s == &#x27;+&#x27;) s++;
    while (*s &gt;= &#x27;0&#x27; &amp;&amp; *s &lt;= &#x27;9&#x27;)
        n = n * 10 + (*s++ - &#x27;0&#x27;);
    return sign * n;
}</code></pre>
<h3 id="endianness-check">Endianness check</h3>
<pre><code>int n = 1;
puts(*(char *)&amp;n ? &quot;little endian&quot; : &quot;big endian&quot;);</code></pre>
<h3 id="function-pointer-and-qsort-comparator">Function pointer and qsort comparator</h3>
<pre><code>int cmp(const void *a, const void *b) {
    int x = *(const int *)a, y = *(const int *)b;
    return (x &gt; y) - (x &lt; y);   // avoids overflow of x - y
}
qsort(arr, n, sizeof arr[0], cmp);</code></pre>
<h2 id="b8-top-gotchas-and-undefined-behavior">B8. Top Gotchas and Undefined Behavior</h2>
<div class="tw"><table><tr><th><strong>Mistake</strong></th><th><strong>Why it is a problem / fix</strong></th></tr><tr><td>Using gets()</td><td>No bounds check; removed from the standard. Use fgets.</td></tr><tr><td>Forgetting the null terminator</td><td>String functions read past the buffer. Allocate length + 1.</td></tr><tr><td>sizeof on an array parameter</td><td>It gives the pointer size, not the array size. Pass the length.</td></tr><tr><td>Returning address of a local</td><td>The stack frame is gone; pointer dangles.</td></tr><tr><td>malloc without NULL check</td><td>Crash on allocation failure.</td></tr><tr><td>free then use</td><td>Use after free is undefined. Set pointer to NULL after free.</td></tr><tr><td>Double free</td><td>Heap corruption. Set pointer to NULL after free.</td></tr><tr><td>realloc assigned directly to the same pointer</td><td>On failure the original block leaks. Use a temp.</td></tr><tr><td>Modifying a string literal</td><td>Undefined; use a char array.</td></tr><tr><td>Signed integer overflow</td><td>Undefined; use unsigned or check before the operation.</td></tr><tr><td>Comparing signed with unsigned</td><td>Signed value converts to unsigned; negative becomes huge.</td></tr><tr><td>Comparing floats with ==</td><td>Use a tolerance: fabs(a - b) &lt; eps.</td></tr><tr><td>Macro with side effects</td><td>SQUARE(i++) evaluates i++ twice; parenthesize and avoid side effects.</td></tr><tr><td>Missing break in switch</td><td>Falls through to the next case.</td></tr><tr><td>= instead of == in a condition</td><td>Assigns and tests the result; enable -Wall.</td></tr><tr><td>Uninitialized local variables</td><td>Hold garbage values; reading them is undefined.</td></tr><tr><td>Wrong scanf specifier or missing &amp;</td><td>Undefined behavior; also check scanf return value.</td></tr><tr><td>Off-by-one in loops and buffers</td><td>Arrays are 0-indexed; the last valid index is n - 1.</td></tr></table></div>
