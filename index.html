<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C & Embedded Library</title>
<meta name="theme-color" content="#080612">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --sp{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{
 --bg:#080612;--surf:#110d21;--surf2:#1a1433;--tx:#f3eeff;--tx2:#c5bce6;--mut:#8f85b8;--bd:#271f47;
 --p1:#ff5ea8;--p2:#ff9f43;--p3:#ffd23f;--p4:#3be39a;--p5:#37d5ff;--p6:#6f8dff;--p7:#b87bff;
 --ac:var(--p5);--ac2:var(--p7);--ac3:var(--p1);
 --rainbow:linear-gradient(100deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7));
 --rb-loop:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7),var(--p1));
 --code:#0a0716;--codetx:#e8e2ff;
 --glow:0 0 0 1px color-mix(in srgb,var(--p7) 12%,transparent),0 24px 56px -28px color-mix(in srgb,var(--p7) 55%,transparent);
 --fs:17px;--ease:cubic-bezier(.22,1,.36,1);--ease2:cubic-bezier(.32,.72,0,1);
 color-scheme:dark}
:root[data-theme=light]{--bg:#faf7ff;--surf:#fff;--surf2:#f0eafd;--tx:#1b1336;--tx2:#4b4272;--mut:#7c72a3;--bd:#e3dbf6;
 --p1:#e22d7e;--p2:#e8680a;--p3:#c48f00;--p4:#0a9d66;--p5:#0592c4;--p6:#3557ff;--p7:#8a42e6;
 --glow:0 0 0 1px color-mix(in srgb,var(--p7) 12%,transparent),0 20px 44px -26px color-mix(in srgb,var(--p7) 55%,transparent);color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:96px;-webkit-text-size-adjust:100%;scrollbar-color:color-mix(in srgb,var(--p7) 45%,transparent) transparent}
body{font:400 var(--fs)/1.8 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.open{overflow:hidden}
::selection{background:color-mix(in srgb,var(--ac) 35%,transparent)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ambient multicolor aurora: transform-only motion (GPU), no blur filters */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;contain:layout paint}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;will-change:transform;opacity:.6}
.bg i:nth-child(1){top:-32vmax;right:-20vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--p7) 40%,transparent),transparent);animation:d1 28s ease-in-out infinite alternate}
.bg i:nth-child(2){bottom:-36vmax;left:-24vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--p5) 30%,transparent),transparent);animation:d2 34s ease-in-out infinite alternate}
.bg i:nth-child(3){top:26vh;left:30vw;width:46vmax;height:46vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--p1) 26%,transparent),transparent);animation:d3 40s ease-in-out infinite alternate}
.bg i:nth-child(4){top:-20vmax;left:-18vmax;width:42vmax;height:42vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--p2) 22%,transparent),transparent);animation:d4 36s ease-in-out infinite alternate}
:root[data-theme=light] .bg i{opacity:.42}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--bd) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,var(--bd) 1px,transparent 1px) 0 0/56px 56px;opacity:.36;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 0,#000,transparent);mask-image:radial-gradient(ellipse 80% 70% at 50% 0,#000,transparent)}
@keyframes d1{to{transform:translate3d(-14vmax,10vmax,0) scale(1.15)}}
@keyframes d2{to{transform:translate3d(16vmax,-8vmax,0) scale(1.1)}}
@keyframes d3{to{transform:translate3d(-12vmax,-12vmax,0) scale(.85)}}
@keyframes d4{to{transform:translate3d(18vmax,14vmax,0) scale(1.2)}}

#bar{position:fixed;top:0;left:0;right:0;height:3px;clip-path:inset(0 100% 0 0);background:var(--rainbow);z-index:80}

/* header */
header{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:10px;margin:12px auto 0;max-width:1240px;width:calc(100% - 24px);padding:8px 10px 8px 16px;border-radius:22px;-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);background:color-mix(in srgb,var(--surf) 72%,transparent);border:1px solid var(--bd);box-shadow:var(--glow);transition:box-shadow .5s var(--ease),border-color .5s}
header.scrolled{border-color:color-mix(in srgb,var(--p7) 30%,var(--bd));box-shadow:0 0 0 1px color-mix(in srgb,var(--p7) 10%,transparent),0 18px 44px -18px #000a}
:root[data-theme=light] header.scrolled{box-shadow:0 14px 36px -18px #5a3fb055}
.logo{font:700 18px 'Space Grotesk',sans-serif;letter-spacing:-.01em;white-space:nowrap;display:flex;gap:9px;align-items:center;flex:none}
.logo span{background:var(--rb-loop) 0 0/200% 100% repeat-x;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 10s linear infinite}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--p1),var(--p2) 45%,var(--p7));color:#fff;font-size:15px;box-shadow:0 6px 18px -6px var(--p1);transition:transform .6s var(--ease)}
.logo:hover b{transform:rotate(-12deg) scale(1.1)}
@keyframes flow{to{background-position:200% 0}}
.tabs{position:relative;display:flex;gap:2px;margin:0 auto;padding:4px;min-width:0;overflow-x:auto;scrollbar-width:none;border-radius:15px;background:color-mix(in srgb,var(--surf2) 60%,transparent);border:1px solid var(--bd)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;z-index:1;flex:none;padding:8px 16px;border-radius:11px;font:500 13.5px 'JetBrains Mono',monospace;color:var(--mut);white-space:nowrap;transition:color .3s,transform .3s var(--ease)}
.tabs button:hover{color:var(--ac)}.tabs button.on{color:var(--ac)}.tabs button:active{transform:scale(.95)}
.pill{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:11px;background:color-mix(in srgb,var(--ac) 17%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 45%,transparent),0 6px 20px -8px var(--ac);will-change:transform,width}
.pill.ready{transition:transform .6s var(--ease),width .6s var(--ease),background-color .5s,box-shadow .5s}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--mut);flex:none;font:600 14px Inter,system-ui,sans-serif;transition:background-color .3s,color .3s,transform .35s var(--ease)}
.ib:hover{background:var(--surf2);color:var(--p1)}.ib:active{transform:scale(.88)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#menu{display:none}
#menu path{transform-box:fill-box;transform-origin:center;transition:transform .5s var(--ease),opacity .25s}
body.open #menu path:nth-child(1){transform:translateY(5px) rotate(45deg)}
body.open #menu path:nth-child(2){opacity:0;transform:scaleX(0)}
body.open #menu path:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
#th{display:grid}#th svg{grid-area:1/1;transition:transform .7s var(--ease),opacity .4s}
:root[data-theme=dark] #th .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme=light] #th .sun{opacity:0;transform:rotate(90deg) scale(.4)}
:root[data-theme=dark] #th{color:var(--p3)}:root[data-theme=light] #th{color:var(--p7)}

.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:8px;max-width:1264px;margin:0 auto;padding:0 12px}

/* sidebar */
aside{position:sticky;top:92px;height:calc(100vh - 108px);height:calc(100dvh - 108px);overflow:auto;overscroll-behavior:contain;margin-top:16px;padding:16px 12px 24px;border-radius:22px;background:color-mix(in srgb,var(--surf) 78%,transparent);border:1px solid var(--bd);scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
#q{width:100%;padding:11px 14px;border-radius:13px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:400 13px 'JetBrains Mono',monospace;outline:0;margin-bottom:12px;transition:border-color .3s,box-shadow .4s var(--ease)}
#q:focus{border-color:var(--p5);box-shadow:0 0 0 4px color-mix(in srgb,var(--p5) 18%,transparent)}
#toc{position:relative}
.ind{position:absolute;left:0;top:0;width:100%;height:0;border-radius:10px;background:color-mix(in srgb,var(--ac) 14%,transparent);pointer-events:none;opacity:0;will-change:transform;transition:transform .55s var(--ease),height .55s var(--ease),opacity .3s,background-color .5s}
.ind::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--ac);box-shadow:0 0 12px var(--ac);transition:background-color .5s,box-shadow .5s}
aside .part{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:20px 10px 6px}
aside a{position:relative;isolation:isolate;display:block;padding:8px 12px 8px 28px;border-radius:10px;color:var(--mut);text-decoration:none;font:500 13.5px/1.4 Inter,system-ui,sans-serif;transition:color .25s,transform .45s var(--ease)}
aside a::before{content:"";position:absolute;left:12px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--ac);opacity:.5;transition:transform .45s var(--ease),opacity .3s,box-shadow .4s}
aside a::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:10px;background:var(--surf2);opacity:0;transition:opacity .25s}
aside a:hover{color:var(--tx);transform:translate3d(4px,0,0)}aside a:hover::after{opacity:1}aside a:hover::before{opacity:1;transform:scale(1.4)}
aside a.on{color:var(--ac)}aside a.on::after{opacity:0}aside a.on::before{opacity:1;transform:scale(1.6);box-shadow:0 0 10px var(--ac)}
aside [hidden]{display:none!important}
.none{color:var(--mut);font-size:13px;padding:10px 12px}

/* hero: rotating rainbow border + colour-reactive spotlight */
main{padding:28px clamp(16px,4vw,56px) 140px;min-width:0}
.hero{position:relative;isolation:isolate;overflow:hidden;margin-bottom:56px;padding:44px 40px;border-radius:28px;border:1.5px solid transparent;
 background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 16%,var(--surf)),var(--surf) 62%) padding-box,conic-gradient(from var(--ang),var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7),var(--p1)) border-box;
 box-shadow:0 34px 70px -38px color-mix(in srgb,var(--ac) 65%,transparent);animation:spin 10s linear infinite}
@keyframes spin{to{--ang:360deg}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(440px circle at var(--mx,82%) var(--my,0%),color-mix(in srgb,var(--ac) 20%,transparent),transparent 62%)}
.hero::after{content:"</>";position:absolute;right:26px;top:8px;font:700 120px 'Space Grotesk',sans-serif;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.13;pointer-events:none;animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate3d(0,14px,0) rotate(-3deg)}}
.kicker{display:flex;align-items:center;gap:10px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.22em;color:var(--ac);margin-bottom:16px}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:pl 2.4s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.hero h1{font:700 clamp(32px,5.4vw,52px)/1.04 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin-bottom:14px;background:var(--rb-loop) 0 0/200% 100% repeat-x;-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em;animation:flow 12s linear infinite}
.hero p{color:var(--tx2);max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{font:500 12px 'JetBrains Mono',monospace;padding:6px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ac) 38%,var(--bd));background:color-mix(in srgb,var(--ac) 10%,var(--surf2));color:var(--tx2);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.chip:hover{transform:translate3d(0,-3px,0);box-shadow:0 10px 22px -12px var(--ac)}
.chip b{color:var(--ac);font-weight:600}
.chip:nth-child(1){--ac:var(--p1)}.chip:nth-child(2){--ac:var(--p4)}.chip:nth-child(3){--ac:var(--p2)}

/* article: --ac/--ac2 are set per section from JS, so every part gets its own colours */
article{max-width:790px}
.rv{opacity:0;transform:translate3d(0,22px,0);transition:opacity .75s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
pre.rv{transform:translate3d(0,28px,0) scale(.975);transition:opacity .75s var(--ease),transform .9s var(--ease),border-color .4s,box-shadow .5s var(--ease),--sp .6s var(--ease)}
pre.rv.in{transform:none}
article h1{font:700 32px 'Space Grotesk',sans-serif;margin:84px 0 12px;padding-top:26px;border-top:1px dashed var(--bd);letter-spacing:-.025em;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
article h2{position:relative;font:700 clamp(25px,3.4vw,33px)/1.2 'Space Grotesk',sans-serif;margin:60px 0 18px;letter-spacing:-.028em;scroll-margin-top:96px;text-wrap:balance}
article h2::before{content:"#";background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:10px;font-weight:500}
article h2::after{content:"";display:block;width:76px;height:3px;margin-top:12px;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));transform:scaleX(0);transform-origin:0 50%;transition:transform 1s var(--ease) .3s}
article h2.in::after{transform:none}
article h3{font:600 14px 'JetBrains Mono',monospace;margin:36px 0 10px;color:var(--ac);text-transform:uppercase;letter-spacing:.08em}
article p{margin:0 0 16px;color:var(--tx2);text-wrap:pretty}
article ul{margin:0 0 18px;padding-left:22px;color:var(--tx2)}li{margin:5px 0}li::marker{color:var(--ac)}
article strong{font-weight:600;color:var(--tx)}
code{font:400 .84em 'JetBrains Mono',monospace;background:color-mix(in srgb,var(--ac) 12%,var(--surf2));color:var(--ac);padding:.15em .45em;border-radius:6px}
pre{position:relative;background:var(--code);color:var(--codetx);border-radius:18px;margin:0 0 26px;border:1px solid color-mix(in srgb,var(--ac) 26%,var(--bd));
 background:radial-gradient(380px circle at var(--mx,70%) var(--my,0px),color-mix(in srgb,var(--ac) var(--sp),transparent),transparent 65%),var(--code);
 box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 8%,transparent),0 26px 56px -32px color-mix(in srgb,var(--ac) 55%,transparent);overflow:hidden;transition:border-color .4s,box-shadow .5s var(--ease),--sp .6s var(--ease)}
pre:hover{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd));--sp:13%}
pre::before{content:"";display:block;height:38px;border-bottom:1px solid color-mix(in srgb,var(--ac) 30%,transparent);background:radial-gradient(circle at 20px 50%,#ff5f57 5px,transparent 5.5px),radial-gradient(circle at 40px 50%,#febc2e 5px,transparent 5.5px),radial-gradient(circle at 60px 50%,#28c840 5px,transparent 5.5px),linear-gradient(90deg,color-mix(in srgb,var(--ac) 14%,transparent),color-mix(in srgb,var(--ac2) 10%,transparent))}
pre::after{content:"C";position:absolute;top:0;left:0;right:0;height:38px;text-align:center;font:500 11px/38px 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--ac);opacity:.8;pointer-events:none}
pre code{display:block;background:none;color:inherit;padding:16px 20px 18px;overflow-x:auto;overscroll-behavior-x:contain;font-size:13.5px;line-height:1.7;tab-size:4;scrollbar-width:thin;scrollbar-color:#ffffff22 transparent}
.cp{position:absolute;top:6px;right:8px;font:500 11px 'JetBrains Mono',monospace;color:#a79dcc;padding:5px 11px;border-radius:9px;border:1px solid #ffffff14;background:#ffffff08;transition:color .25s,background-color .25s,border-color .25s,transform .35s var(--ease)}
.cp:hover{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 50%,transparent)}.cp:active{transform:scale(.92)}
.cp.ok{color:#04110d;background:var(--p4);border-color:var(--p4)}
/* multicolour syntax highlighting (code blocks stay dark in both themes) */
pre .k{color:#ff6ac1}            /* control flow  */
pre .t{color:#5ce1ff}            /* types         */
pre .sc{color:#c792ff}           /* storage / qualifiers */
pre .s{color:#8bf3a6}            /* strings       */
pre .h{color:#8bf3a6;font-style:italic} /* <headers> */
pre .n{color:#ffb454}            /* numbers       */
pre .c{color:#6e7bab;font-style:italic} /* comments */
pre .p{color:#ffd866}            /* preprocessor  */
pre .f{color:#7aa2ff}            /* function calls */
pre .m{color:#ff8f6b}            /* MACROS        */
pre .l{color:#ff9e64;font-weight:500} /* NULL true false */
pre .a{color:#7df9c8}            /* struct members */
pre .o{color:#b9a9f0}            /* operators     */
.tw{overflow-x:auto;overscroll-behavior-x:contain;margin:0 0 26px;border:1px solid color-mix(in srgb,var(--ac) 24%,var(--bd));border-radius:18px;background:var(--surf);box-shadow:0 20px 48px -32px color-mix(in srgb,var(--ac) 55%,transparent)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
th{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 18%,var(--surf2)),color-mix(in srgb,var(--ac2) 14%,var(--surf2)));text-align:left;font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);white-space:nowrap}
th,td{padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:top}
td{color:var(--tx2);transition:background-color .25s}td:first-child{color:var(--tx);font-weight:500}tr:last-child td{border:0}tr:hover td{background:color-mix(in srgb,var(--ac) 8%,transparent)}

#top{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p7));box-shadow:0 12px 30px -10px color-mix(in srgb,var(--p1) 75%,transparent);opacity:0;transform:translate3d(0,26px,0) scale(.8);pointer-events:none;z-index:60;transition:opacity .4s var(--ease),transform .6s var(--ease)}
#top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
#top.show{opacity:1;transform:none;pointer-events:auto}
#top.show:hover{transform:translate3d(0,-4px,0)}#top:hover svg{transform:translate3d(0,-2px,0)}#top.show:active{transform:scale(.9)}
#scrim{position:fixed;inset:0;background:#000a;z-index:65;opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s .4s}
body.open #scrim{opacity:1;visibility:visible;transition:opacity .4s var(--ease)}

/* theme switch: circular reveal via View Transitions, crossfade fallback */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .45s,color .45s,border-color .45s,box-shadow .45s!important}

/* progress, practice, login */
.prac{margin:6px 0 34px;padding:16px 18px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--ac) 50%,var(--bd));background:color-mix(in srgb,var(--ac) 7%,var(--surf))}
.prac b{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.prac ul{margin:8px 0 12px 20px;color:var(--tx2);font-size:15px}
.prac label{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:500;font-size:14.5px}
.prac input{width:18px;height:18px;accent-color:var(--ac)}
.pgw{display:flex;align-items:center;gap:12px;margin-top:20px}

<template id="book-proto"><h1 id="part-a">Part A: Wired buses</h1><h2 id="uart">1. UART (Serial)</h2><p>UART (Universal Asynchronous Receiver/Transmitter) sends bytes one bit at a time on a single wire with <strong>no shared clock</strong>. Both ends agree on the speed (baud rate) in advance and the receiver re-synchronises on every start bit.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Wires</td><td>TX, RX, GND (optional RTS/CTS flow control)</td></tr><tr><td>Topology</td><td>Point to point (RS-485 makes it multi-drop)</td></tr><tr><td>Speed</td><td>9600 to 115200 baud typical, up to several Mbaud</td></tr><tr><td>Frame</td><td>1 start bit (0), 5 to 9 data bits LSB first, optional parity, 1 or 2 stop bits (1)</td></tr><tr><td>Voltage</td><td>TTL 3.3 V or 5 V; RS-232 is about +/-12 V and inverted; RS-485 is differential</td></tr><tr><td>Used for</td><td>Debug console, GPS, GSM and Bluetooth modules, Modbus RTU, LIN</td></tr></table></div><h3>How it works</h3><ul><li>Idle line is <strong>high</strong>. The falling edge of the start bit tells the receiver to start its bit timer; it samples each bit in the <strong>middle</strong> of the bit time (often 16x oversampling).</li><li>Bit time = 1 / baud. At 9600 baud one bit is 104.2 us, a 10-bit frame is 1.04 ms, so about 960 bytes/s. Real throughput is 80 percent of the baud rate with 8N1.</li><li>Parity (even or odd) detects a single flipped bit. The framing error flag means the stop bit was not high; the overrun error means software read too slowly.</li><li>Receive with an interrupt or DMA plus a ring buffer. Both clocks must match within about 2 percent.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 674 146" role="img" aria-label="UART frame for byte 0x41" style="min-width:674px;max-width:674px"><rect class="wband" x="110" y="20" width="46" height="116"/><text class="wl wh" x="133.0" y="13.0" text-anchor="middle">start</text><rect class="wband" x="524" y="20" width="46" height="116"/><text class="wl wh" x="547.0" y="13.0" text-anchor="middle">stop/par</text><line class="wg" x1="64" x2="64" y1="20" y2="134"/><line class="wg" x1="110" x2="110" y1="20" y2="134"/><line class="wg" x1="156" x2="156" y1="20" y2="134"/><line class="wg" x1="202" x2="202" y1="20" y2="134"/><line class="wg" x1="248" x2="248" y1="20" y2="134"/><line class="wg" x1="294" x2="294" y1="20" y2="134"/><line class="wg" x1="340" x2="340" y1="20" y2="134"/><line class="wg" x1="386" x2="386" y1="20" y2="134"/><line class="wg" x1="432" x2="432" y1="20" y2="134"/><line class="wg" x1="478" x2="478" y1="20" y2="134"/><line class="wg" x1="524" x2="524" y1="20" y2="134"/><line class="wg" x1="570" x2="570" y1="20" y2="134"/><line class="wg" x1="616" x2="616" y1="20" y2="134"/><line class="wg" x1="662" x2="662" y1="20" y2="134"/><text class="wt" x="4.0" y="61.0" text-anchor="start">8N1</text><path class="wv " d="M64 44 L110 44 L110 44 L110 70 L156 70 L156 70 L156 44 L202 44 L202 44 L202 70 L248 70 L294 70 L340 70 L386 70 L432 70 L432 70 L432 44 L478 44 L478 44 L478 70 L524 70 L524 70 L524 44 L570 44 L616 44 L662 44"/><text class="wl" x="87.0" y="39.0" text-anchor="middle">idle</text><text class="wl" x="133.0" y="39.0" text-anchor="middle">START</text><text class="wl" x="179.0" y="39.0" text-anchor="middle">D0=1</text><text class="wl" x="225.0" y="39.0" text-anchor="middle">D1=0</text><text class="wl" x="271.0" y="39.0" text-anchor="middle">D2=0</text><text class="wl" x="317.0" y="39.0" text-anchor="middle">D3=0</text><text class="wl" x="363.0" y="39.0" text-anchor="middle">D4=0</text><text class="wl" x="409.0" y="39.0" text-anchor="middle">D5=0</text><text class="wl" x="455.0" y="39.0" text-anchor="middle">D6=1</text><text class="wl" x="501.0" y="39.0" text-anchor="middle">D7=0</text><text class="wl" x="547.0" y="39.0" text-anchor="middle">STOP</text><text class="wl" x="616.0" y="39.0" text-anchor="middle">idle</text><text class="wt" x="4.0" y="119.0" text-anchor="start">8E1</text><path class="wv b" d="M64 102 L110 102 L110 102 L110 128 L156 128 L156 128 L156 102 L202 102 L202 102 L202 128 L248 128 L294 128 L340 128 L386 128 L432 128 L432 128 L432 102 L478 102 L478 102 L478 128 L524 128 L570 128 L570 128 L570 102 L616 102 L662 102"/><text class="wl" x="87.0" y="97.0" text-anchor="middle">idle</text><text class="wl" x="133.0" y="97.0" text-anchor="middle">START</text><text class="wl" x="179.0" y="97.0" text-anchor="middle">D0=1</text><text class="wl" x="225.0" y="97.0" text-anchor="middle">D1=0</text><text class="wl" x="271.0" y="97.0" text-anchor="middle">D2=0</text><text class="wl" x="317.0" y="97.0" text-anchor="middle">D3=0</text><text class="wl" x="363.0" y="97.0" text-anchor="middle">D4=0</text><text class="wl" x="409.0" y="97.0" text-anchor="middle">D5=0</text><text class="wl" x="455.0" y="97.0" text-anchor="middle">D6=1</text><text class="wl" x="501.0" y="97.0" text-anchor="middle">D7=0</text><text class="wl" x="547.0" y="97.0" text-anchor="middle">P=0</text><text class="wl" x="593.0" y="97.0" text-anchor="middle">STOP</text><text class="wl" x="639.0" y="97.0" text-anchor="middle">idle</text></svg></div><figcaption>Byte 0x41 ("A") = 01000001. It is sent <strong>LSB first</strong>: D0 = 1 comes right after the start bit. The second row adds an even-parity bit (0x41 has two 1s, so P = 0).</figcaption></figure><h3>Baud rate generation</h3><p>The UART divides its clock to get the bit rate. For an AVR with 16x oversampling: <code>UBRR = f_clk / (16 x baud) - 1</code>. At 16 MHz and 9600 baud, UBRR = 103.17, rounded to 103, so the real rate is 9615 baud (error 0.16 percent, fine). At 115200 baud the error is 2.1 percent, which is near the limit; use a crystal such as 18.432 MHz for exact rates.</p><h3>RS-232, RS-422 and RS-485</h3><div class="tw"><table><tr><th>Standard</th><th>Signalling</th><th>Max distance</th><th>Nodes</th><th>Notes</th></tr><tr><td>TTL / CMOS UART</td><td>0 V and 3.3 or 5 V, single-ended</td><td>about 1 m</td><td>2</td><td>What MCU pins output</td></tr><tr><td>RS-232</td><td>single-ended, +3 to +15 V = 0, -3 to -15 V = 1 (inverted)</td><td>15 m</td><td>2</td><td>Needs a MAX232-style level shifter</td></tr><tr><td>RS-422</td><td>differential, full duplex (2 pairs)</td><td>1200 m</td><td>1 driver, 10 receivers</td><td>Up to 10 Mbit/s at short range</td></tr><tr><td>RS-485</td><td>differential, half duplex (1 pair), 120 Ohm ends</td><td>1200 m</td><td>32 unit loads (more with modern chips)</td><td>Needs DE/RE direction control; used by Modbus RTU</td></tr></table></div><h3>Errors and flow control</h3><ul><li><strong>Framing error:</strong> stop bit read as 0. <strong>Parity error:</strong> parity mismatch. <strong>Overrun:</strong> a new byte arrived before the old one was read. <strong>Break:</strong> line held low longer than a whole frame (used as a signal, for example in LIN).</li><li><strong>Hardware flow control:</strong> RTS/CTS lines tell the sender to pause. <strong>Software flow control:</strong> XOFF (0x13) pauses and XON (0x11) resumes.</li><li><strong>Common settings:</strong> 9600 8N1 (GPS, simple devices), 115200 8N1 (debug consoles), 8E1 (Modbus).</li></ul><h3>Interrupt-driven receive with a ring buffer</h3><pre><code>#define RX_SIZE 64u
static volatile uint8_t rx_buf[RX_SIZE];
static volatile uint8_t head, tail;

void UART_RX_IRQHandler(void)          /* one byte received */
{
    uint8_t b = UART-&gt;DR;              /* reading clears the flag */
    uint8_t next = (uint8_t)((head + 1u) % RX_SIZE);
    if (next != tail) { rx_buf[head] = b; head = next; }  /* drop on full */
}

int uart_read(void)                    /* -1 if empty */
{
    if (head == tail) return -1;
    uint8_t b = rx_buf[tail];
    tail = (uint8_t)((tail + 1u) % RX_SIZE);
    return b;
}</code></pre><h3>Common problems</h3><ul><li>Wrong baud rate or clock error: garbage characters.</li><li>TX wired to TX instead of crossing TX to RX; missing common ground.</li><li>Mixing RS-232 and TTL levels can damage the chip.</li></ul><p><strong>Interview:</strong> Why does UART need no clock wire? Each frame starts with a start bit, so the receiver re-syncs every byte; both sides only need the same baud rate within about 2 percent.</p><h2 id="spi">2. SPI (Serial Peripheral Interface)</h2><p>SPI is a fast, synchronous, <strong>full-duplex</strong> bus. One master drives the clock and every bit sent on MOSI is matched by a bit received on MISO. There are no addresses: the master picks a slave with its own chip-select line.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Wires</td><td>SCK, MOSI, MISO, plus one SS/CS per slave</td></tr><tr><td>Topology</td><td>1 master, many slaves (star of CS lines, or daisy chain)</td></tr><tr><td>Speed</td><td>1 to 50 MHz typical, no fixed limit</td></tr><tr><td>Frame</td><td>No framing: usually 8 bits, MSB first; the CS low period is the "frame"</td></tr><tr><td>Acknowledge</td><td>None; the master never knows whether a slave exists</td></tr><tr><td>Used for</td><td>Flash, SD cards, TFT displays, ADC/DAC, IMUs, radio chips</td></tr></table></div><h3>How it works</h3><ul><li>Four modes come from <strong>CPOL</strong> (clock level when idle) and <strong>CPHA</strong> (which edge samples). Mode 0 = CPOL 0, CPHA 0 (sample on rising edge). Mode 1 = 0,1 (falling). Mode 2 = 1,0 (falling). Mode 3 = 1,1 (rising). Master and slave must use the same mode.</li><li>The shift registers of master and slave form a ring: after 8 clocks the two bytes have swapped. To read from a slave the master must send a dummy byte (often 0xFF or 0x00).</li><li>Typical register read: CS low, send command or address byte, read N data bytes, CS high.</li><li>Pins per extra slave: just one more CS. Speed is limited by wiring capacitance and the slowest slave.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 580 262" role="img" aria-label="SPI mode 0 transfer of 0xA5 and 0x3C" style="min-width:580px;max-width:580px"><line class="wk" x1="120" x2="120" y1="20" y2="250"/><line class="wk" x1="176" x2="176" y1="20" y2="250"/><line class="wk" x1="232" x2="232" y1="20" y2="250"/><line class="wk" x1="288" x2="288" y1="20" y2="250"/><line class="wk" x1="344" x2="344" y1="20" y2="250"/><line class="wk" x1="400" x2="400" y1="20" y2="250"/><line class="wk" x1="456" x2="456" y1="20" y2="250"/><line class="wk" x1="512" x2="512" y1="20" y2="250"/><text class="wt" x="4.0" y="61.0" text-anchor="start">SS</text><path class="wv c" d="M64 44 L92 44 L92 44 L92 70 L120 70 L148 70 L176 70 L204 70 L232 70 L260 70 L288 70 L316 70 L344 70 L372 70 L400 70 L428 70 L456 70 L484 70 L512 70 L540 70 L540 70 L540 44 L568 44"/><text class="wl" x="316.0" y="39.0" text-anchor="middle">chip select low = slave selected</text><text class="wt" x="4.0" y="119.0" text-anchor="start">SCK</text><path class="wv " d="M64 128 L92 128 L120 128 L120 128 L120 102 L148 102 L148 102 L148 128 L176 128 L176 128 L176 102 L204 102 L204 102 L204 128 L232 128 L232 128 L232 102 L260 102 L260 102 L260 128 L288 128 L288 128 L288 102 L316 102 L316 102 L316 128 L344 128 L344 128 L344 102 L372 102 L372 102 L372 128 L400 128 L400 128 L400 102 L428 102 L428 102 L428 128 L456 128 L456 128 L456 102 L484 102 L484 102 L484 128 L512 128 L512 128 L512 102 L540 102 L540 102 L540 128 L568 128"/><text class="wl" x="316.0" y="97.0" text-anchor="middle">mode 0: idle low, data sampled on rising edge</text><text class="wt" x="4.0" y="177.0" text-anchor="start">MOSI</text><path class="wv b" d="M64 160 L92 160 L120 160 L148 160 L148 160 L148 186 L176 186 L204 186 L204 186 L204 160 L232 160 L260 160 L260 160 L260 186 L288 186 L316 186 L344 186 L372 186 L372 186 L372 160 L400 160 L428 160 L428 160 L428 186 L456 186 L484 186 L484 186 L484 160 L512 160 L540 160 L568 160"/><text class="wl" x="120.0" y="155.0" text-anchor="middle">b7=1</text><text class="wl" x="176.0" y="155.0" text-anchor="middle">b6=0</text><text class="wl" x="232.0" y="155.0" text-anchor="middle">b5=1</text><text class="wl" x="288.0" y="155.0" text-anchor="middle">b4=0</text><text class="wl" x="344.0" y="155.0" text-anchor="middle">b3=0</text><text class="wl" x="400.0" y="155.0" text-anchor="middle">b2=1</text><text class="wl" x="456.0" y="155.0" text-anchor="middle">b1=0</text><text class="wl" x="512.0" y="155.0" text-anchor="middle">b0=1</text><text class="wt" x="4.0" y="235.0" text-anchor="start">MISO</text><path class="wv d" d="M64 244 L92 244 L120 244 L148 244 L176 244 L204 244 L204 244 L204 218 L232 218 L260 218 L288 218 L316 218 L344 218 L372 218 L400 218 L428 218 L428 218 L428 244 L456 244 L484 244 L512 244 L540 244 L568 244"/><text class="wl" x="120.0" y="213.0" text-anchor="middle">b7=0</text><text class="wl" x="176.0" y="213.0" text-anchor="middle">b6=0</text><text class="wl" x="232.0" y="213.0" text-anchor="middle">b5=1</text><text class="wl" x="288.0" y="213.0" text-anchor="middle">b4=1</text><text class="wl" x="344.0" y="213.0" text-anchor="middle">b3=1</text><text class="wl" x="400.0" y="213.0" text-anchor="middle">b2=1</text><text class="wl" x="456.0" y="213.0" text-anchor="middle">b1=0</text><text class="wl" x="512.0" y="213.0" text-anchor="middle">b0=0</text></svg></div><figcaption>Master sends 0xA5 on MOSI while the slave returns 0x3C on MISO. Dotted pink lines are the <strong>rising edges</strong> where both sides sample. Data changes on the falling edge.</figcaption></figure><h3>The four modes</h3><div class="tw"><table><tr><th>Mode</th><th>CPOL</th><th>CPHA</th><th>Idle clock</th><th>Data sampled on</th><th>Data changes on</th></tr><tr><td>0</td><td>0</td><td>0</td><td>low</td><td>rising edge</td><td>falling edge</td></tr><tr><td>1</td><td>0</td><td>1</td><td>low</td><td>falling edge</td><td>rising edge</td></tr><tr><td>2</td><td>1</td><td>0</td><td>high</td><td>falling edge</td><td>rising edge</td></tr><tr><td>3</td><td>1</td><td>1</td><td>high</td><td>rising edge</td><td>falling edge</td></tr></table></div><p>Most sensors use mode 0 or 3. Always check the datasheet timing diagram, not just the mode name.</p><h3>Variants and wiring</h3><ul><li><strong>Daisy chain:</strong> MISO of one slave feeds MOSI of the next and all share one CS (shift registers, LED drivers). Saves pins but data passes through every device.</li><li><strong>Dual, Quad and Octal SPI:</strong> 2, 4 or 8 data lines instead of MOSI/MISO. Quad SPI (QSPI) flash allows execute-in-place at 100+ MHz.</li><li><strong>3-wire SPI:</strong> one bidirectional data line. <strong>Microwire:</strong> an older, similar bus.</li><li><strong>Limits:</strong> clock rate is set by the slowest device and by wire length; add series resistors (22 to 33 Ohm) on SCK for long traces.</li></ul><h3>Example: read a flash chip ID</h3><p>A typical NOR flash answers command <code>0x9F</code> with three bytes: manufacturer, memory type, capacity.</p><pre><code>uint8_t spi_xfer(uint8_t out)          /* bit-banged mode 0, MSB first */
{
    uint8_t in = 0;
    for (int i = 7; i &gt;= 0; i--) {
        MOSI_WRITE((out &gt;&gt; i) &amp; 1u);   /* set data while SCK is low */
        SCK_HIGH();                    /* slave and master sample here */
        in = (uint8_t)((in &lt;&lt; 1) | MISO_READ());
        SCK_LOW();
    }
    return in;
}

void flash_read_id(uint8_t id[3])
{
    CS_LOW();
    spi_xfer(0x9F);                    /* JEDEC ID command */
    for (int i = 0; i &lt; 3; i++) id[i] = spi_xfer(0xFF);  /* dummy bytes */
    CS_HIGH();
}</code></pre><h3>Common problems</h3><ul><li>Wrong mode: shifted or inverted data.</li><li>Two slaves driving MISO at once (CS not released). Use tri-state MISO or one CS each.</li><li>Clock too fast for long jumper wires.</li></ul><p><strong>Interview:</strong> What is the difference between SPI and I2C? SPI is faster and full duplex but needs a CS pin per slave; I2C needs 2 wires and uses addresses and ACKs, but is slower.</p><h2 id="i2c">3. I2C (Inter-Integrated Circuit)</h2><p>I2C uses just <strong>two open-drain wires</strong>, SDA (data) and SCL (clock), shared by many devices. Every device has an address, so a master can talk to dozens of sensors on the same two wires.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Wires</td><td>SDA, SCL, GND; pull-up resistor on each line (2.2 to 10 kOhm)</td></tr><tr><td>Topology</td><td>Multi-master, multi-slave bus; 7-bit (or 10-bit) addresses</td></tr><tr><td>Speed</td><td>100 kHz standard, 400 kHz fast, 1 MHz fast-plus, 3.4 MHz high-speed</td></tr><tr><td>Frame</td><td>START, address + R/W, ACK, data bytes each followed by ACK, STOP</td></tr><tr><td>Acknowledge</td><td>Receiver pulls SDA low on the 9th clock = ACK; high = NACK</td></tr><tr><td>Used for</td><td>Sensors, RTC, EEPROM, OLED, I/O expanders</td></tr></table></div><h3>How it works</h3><ul><li><strong>START</strong> = SDA falls while SCL is high. <strong>STOP</strong> = SDA rises while SCL is high. At all other times SDA may change only while SCL is <strong>low</strong>.</li><li>Address 0x48 (1001000) with W = 0 gives the first byte 0x90; with R = 1 it is 0x91. Many datasheets quote the 8-bit form, which is a common source of confusion.</li><li>A <strong>repeated START</strong> switches between write and read without releasing the bus (used to write a register pointer, then read its value).</li><li>Clock stretching: a slow slave holds SCL low until it is ready. Arbitration: two masters that send at once compare SDA; the one that sees a different level backs off.</li><li>Rise time depends on pull-up R x bus capacitance, so a long bus needs smaller resistors.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 736 158" role="img" aria-label="I2C write of 0x3A to address 0x48" style="min-width:736px;max-width:736px"><rect class="wband" x="94" y="20" width="30" height="128"/><text class="wl wh" x="109.0" y="13.0" text-anchor="middle">START</text><rect class="wband" x="364" y="20" width="30" height="128"/><text class="wl wh" x="379.0" y="13.0" text-anchor="middle">ACK</text><rect class="wband" x="634" y="20" width="30" height="128"/><text class="wl wh" x="649.0" y="13.0" text-anchor="middle">ACK</text><rect class="wband" x="664" y="20" width="30" height="128"/><text class="wl wh" x="679.0" y="13.0" text-anchor="middle">STOP</text><line class="wg" x1="64" x2="64" y1="20" y2="146"/><line class="wg" x1="94" x2="94" y1="20" y2="146"/><line class="wg" x1="124" x2="124" y1="20" y2="146"/><line class="wg" x1="154" x2="154" y1="20" y2="146"/><line class="wg" x1="184" x2="184" y1="20" y2="146"/><line class="wg" x1="214" x2="214" y1="20" y2="146"/><line class="wg" x1="244" x2="244" y1="20" y2="146"/><line class="wg" x1="274" x2="274" y1="20" y2="146"/><line class="wg" x1="304" x2="304" y1="20" y2="146"/><line class="wg" x1="334" x2="334" y1="20" y2="146"/><line class="wg" x1="364" x2="364" y1="20" y2="146"/><line class="wg" x1="394" x2="394" y1="20" y2="146"/><line class="wg" x1="424" x2="424" y1="20" y2="146"/><line class="wg" x1="454" x2="454" y1="20" y2="146"/><line class="wg" x1="484" x2="484" y1="20" y2="146"/><line class="wg" x1="514" x2="514" y1="20" y2="146"/><line class="wg" x1="544" x2="544" y1="20" y2="146"/><line class="wg" x1="574" x2="574" y1="20" y2="146"/><line class="wg" x1="604" x2="604" y1="20" y2="146"/><line class="wg" x1="634" x2="634" y1="20" y2="146"/><line class="wg" x1="664" x2="664" y1="20" y2="146"/><line class="wg" x1="694" x2="694" y1="20" y2="146"/><line class="wg" x1="724" x2="724" y1="20" y2="146"/><text class="wt" x="4.0" y="61.0" text-anchor="start">SCL</text><path class="wv " d="M64 44 L74 44 L84 44 L94 44 L104 44 L114 44 L114 44 L114 70 L124 70 L134 70 L134 70 L134 44 L144 44 L144 44 L144 70 L154 70 L164 70 L164 70 L164 44 L174 44 L174 44 L174 70 L184 70 L194 70 L194 70 L194 44 L204 44 L204 44 L204 70 L214 70 L224 70 L224 70 L224 44 L234 44 L234 44 L234 70 L244 70 L254 70 L254 70 L254 44 L264 44 L264 44 L264 70 L274 70 L284 70 L284 70 L284 44 L294 44 L294 44 L294 70 L304 70 L314 70 L314 70 L314 44 L324 44 L324 44 L324 70 L334 70 L344 70 L344 70 L344 44 L354 44 L354 44 L354 70 L364 70 L374 70 L374 70 L374 44 L384 44 L384 44 L384 70 L394 70 L404 70 L404 70 L404 44 L414 44 L414 44 L414 70 L424 70 L434 70 L434 70 L434 44 L444 44 L444 44 L444 70 L454 70 L464 70 L464 70 L464 44 L474 44 L474 44 L474 70 L484 70 L494 70 L494 70 L494 44 L504 44 L504 44 L504 70 L514 70 L524 70 L524 70 L524 44 L534 44 L534 44 L534 70 L544 70 L554 70 L554 70 L554 44 L564 44 L564 44 L564 70 L574 70 L584 70 L584 70 L584 44 L594 44 L594 44 L594 70 L604 70 L614 70 L614 70 L614 44 L624 44 L624 44 L624 70 L634 70 L644 70 L644 70 L644 44 L654 44 L654 44 L654 70 L664 70 L674 70 L674 70 L674 44 L684 44 L694 44 L704 44 L714 44 L724 44"/><text class="wt" x="4.0" y="125.0" text-anchor="start">SDA</text><path class="wv b" d="M64 108 L74 108 L84 108 L94 108 L104 108 L104 108 L104 134 L114 134 L124 134 L124 134 L124 108 L134 108 L144 108 L154 108 L154 108 L154 134 L164 134 L174 134 L184 134 L194 134 L204 134 L214 134 L214 134 L214 108 L224 108 L234 108 L244 108 L244 108 L244 134 L254 134 L264 134 L274 134 L284 134 L294 134 L304 134 L314 134 L324 134 L334 134 L344 134 L354 134 L364 134 L374 134 L384 134 L394 134 L404 134 L414 134 L424 134 L434 134 L444 134 L454 134 L454 134 L454 108 L464 108 L474 108 L484 108 L494 108 L504 108 L514 108 L524 108 L534 108 L544 108 L544 108 L544 134 L554 134 L564 134 L574 134 L574 134 L574 108 L584 108 L594 108 L604 108 L604 108 L604 134 L614 134 L624 134 L634 134 L644 134 L654 134 L664 134 L674 134 L684 134 L684 134 L684 108 L694 108 L704 108 L714 108 L724 108"/><text class="wl" x="79.0" y="103.0" text-anchor="middle">idle</text><text class="wl" x="109.0" y="103.0" text-anchor="middle">S</text><text class="wl" x="139.0" y="103.0" text-anchor="middle">A6</text><text class="wl" x="169.0" y="103.0" text-anchor="middle">A5</text><text class="wl" x="199.0" y="103.0" text-anchor="middle">A4</text><text class="wl" x="229.0" y="103.0" text-anchor="middle">A3</text><text class="wl" x="259.0" y="103.0" text-anchor="middle">A2</text><text class="wl" x="289.0" y="103.0" text-anchor="middle">A1</text><text class="wl" x="319.0" y="103.0" text-anchor="middle">A0</text><text class="wl" x="349.0" y="103.0" text-anchor="middle">W</text><text class="wl" x="379.0" y="103.0" text-anchor="middle">ACK</text><text class="wl" x="409.0" y="103.0" text-anchor="middle">D7</text><text class="wl" x="439.0" y="103.0" text-anchor="middle">D6</text><text class="wl" x="469.0" y="103.0" text-anchor="middle">D5</text><text class="wl" x="499.0" y="103.0" text-anchor="middle">D4</text><text class="wl" x="529.0" y="103.0" text-anchor="middle">D3</text><text class="wl" x="559.0" y="103.0" text-anchor="middle">D2</text><text class="wl" x="589.0" y="103.0" text-anchor="middle">D1</text><text class="wl" x="619.0" y="103.0" text-anchor="middle">D0</text><text class="wl" x="649.0" y="103.0" text-anchor="middle">ACK</text><text class="wl" x="679.0" y="103.0" text-anchor="middle">P</text><text class="wl" x="709.0" y="103.0" text-anchor="middle">idle</text></svg></div><figcaption>Write 0x3A to the device at address 0x48. The slave drives SDA low in both ACK slots. SDA is stable while SCL is high and changes only while SCL is low.</figcaption></figure><h3>Addresses</h3><ul><li>A 7-bit address allows 128 values; 0x00 to 0x07 and 0x78 to 0x7F are reserved (general call, 10-bit prefix and others), leaving <strong>0x08 to 0x77</strong> for devices.</li><li>The 8-bit "write address" is <code>(addr7 &lt;&lt; 1) | 0</code> and the "read address" is <code>(addr7 &lt;&lt; 1) | 1</code>. Arduino <code>Wire</code> and Linux tools use the 7-bit form.</li><li>10-bit addressing sends a prefix <code>11110xx</code> followed by a second address byte.</li></ul><h3>Speed modes</h3><div class="tw"><table><tr><th>Mode</th><th>Max clock</th><th>Max rise time</th><th>Notes</th></tr><tr><td>Standard</td><td>100 kHz</td><td>1000 ns</td><td>Default</td></tr><tr><td>Fast</td><td>400 kHz</td><td>300 ns</td><td>Most sensors</td></tr><tr><td>Fast-plus</td><td>1 MHz</td><td>120 ns</td><td>Stronger drivers</td></tr><tr><td>High-speed</td><td>3.4 MHz</td><td>-</td><td>Needs a master code and a current-source pull-up</td></tr><tr><td>Ultra-fast</td><td>5 MHz</td><td>-</td><td>Write-only, push-pull</td></tr></table></div><h3>Choosing pull-up resistors</h3><p>The resistor must be small enough for the bus to rise in time and large enough that a device can still pull it low (3 mA max sink).</p><ul><li><code>R_max = t_rise / (0.8473 x C_bus)</code> and <code>R_min = (V_dd - 0.4 V) / 3 mA</code>.</li><li>Example: 3.3 V, 100 pF bus, fast mode: R_max = 300 ns / (0.8473 x 100 pF) = 3.5 kOhm, R_min = 0.97 kOhm, so use 2.2 kOhm. The bus capacitance limit is 400 pF.</li></ul><h3>Reading a register (repeated START)</h3><ul><li>START, address + W, ACK, register number, ACK, <strong>repeated START</strong>, address + R, ACK, data byte 1, ACK, ..., last data byte, <strong>NACK</strong> from the master, STOP.</li><li>The master sends a NACK on the last byte to tell the slave to stop driving SDA.</li></ul><pre><code>uint8_t reg = 0x00;
Wire.beginTransmission(0x48);          /* START + address + W */
Wire.write(reg);                       /* register pointer */
Wire.endTransmission(false);           /* false = repeated START */
Wire.requestFrom(0x48, 2);             /* address + R, read 2 bytes */
int16_t raw = (Wire.read() &lt;&lt; 8) | Wire.read();</code></pre><h3>Bus recovery</h3><p>If a slave holds SDA low after a reset, the master toggles SCL as a GPIO up to 9 times until SDA is released, then generates a STOP. Many MCU I2C peripherals lock up after errors, so firmware should add a timeout and a re-init path.</p><h3>Common problems</h3><ul><li>No or wrong pull-ups: lines never go high.</li><li>A slave holds SDA low and the bus hangs. Recover by clocking SCL up to 9 times, then send STOP.</li><li>Two devices with the same address: change the address pin or use a multiplexer such as the TCA9548A.</li></ul><p><strong>Interview:</strong> Why open-drain? Any device can pull a line low without short-circuiting another that wants it high, which makes ACK, clock stretching and multi-master arbitration possible.</p><h2 id="can">4. CAN (Controller Area Network)</h2><p>CAN is a robust two-wire <strong>differential</strong> multi-master bus designed by Bosch for cars. Messages carry an <strong>identifier</strong> that says what the data is (not who it is for), and every node hears every message.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Wires</td><td>CAN_H, CAN_L twisted pair, 120 Ohm termination at both ends (60 Ohm measured)</td></tr><tr><td>Topology</td><td>Linear bus, multi-master, up to about 110 nodes</td></tr><tr><td>Speed</td><td>Classic up to 1 Mbit/s at 40 m; 125 kbit/s at 500 m; CAN FD up to 5 to 8 Mbit/s in the data phase</td></tr><tr><td>Payload</td><td>0 to 8 bytes (CAN FD: up to 64)</td></tr><tr><td>ID</td><td>11 bits standard, 29 bits extended; lower value = higher priority</td></tr><tr><td>Used for</td><td>Cars (OBD-II), trucks (J1939), industrial (CANopen), robots</td></tr></table></div><h3>How it works</h3><ul><li><strong>Dominant (0)</strong> overrides <strong>recessive (1)</strong> on the bus, like a wired-AND. In a transceiver CAN_H goes to about 3.5 V and CAN_L to 1.5 V for a dominant bit; both sit at 2.5 V when recessive.</li><li><strong>Arbitration:</strong> nodes start together and compare each sent bit with the bus. A node that sends 1 but sees 0 has lost, stops sending and retries later. The winner is never delayed or corrupted.</li><li><strong>Bit stuffing:</strong> after five equal bits the sender inserts an opposite bit so receivers can stay synchronised.</li><li><strong>Error handling:</strong> bit, stuff, CRC, form and ACK errors; the receiver sends an error frame. Each node has transmit and receive error counters; above 255 it goes <strong>bus-off</strong>.</li><li>The sender puts a recessive bit in the ACK slot; any node that got the frame correctly drives it dominant.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 540 262" role="img" aria-label="CAN differential levels" style="min-width:540px;max-width:540px"><line class="wg" x1="64" x2="64" y1="20" y2="250"/><line class="wg" x1="122" x2="122" y1="20" y2="250"/><line class="wg" x1="180" x2="180" y1="20" y2="250"/><line class="wg" x1="238" x2="238" y1="20" y2="250"/><line class="wg" x1="296" x2="296" y1="20" y2="250"/><line class="wg" x1="354" x2="354" y1="20" y2="250"/><line class="wg" x1="412" x2="412" y1="20" y2="250"/><line class="wg" x1="470" x2="470" y1="20" y2="250"/><line class="wg" x1="528" x2="528" y1="20" y2="250"/><text class="wt" x="4.0" y="61.0" text-anchor="start">Bit</text><path class="wv " d="M64 44 L122 44 L122 44 L122 70 L180 70 L180 70 L180 44 L238 44 L296 44 L296 44 L296 70 L354 70 L412 70 L412 70 L412 44 L470 44 L528 44"/><text class="wl" x="93.0" y="39.0" text-anchor="middle">rec 1</text><text class="wl" x="151.0" y="39.0" text-anchor="middle">DOM 0</text><text class="wl" x="209.0" y="39.0" text-anchor="middle">rec 1</text><text class="wl" x="267.0" y="39.0" text-anchor="middle">rec 1</text><text class="wl" x="325.0" y="39.0" text-anchor="middle">DOM 0</text><text class="wl" x="383.0" y="39.0" text-anchor="middle">DOM 0</text><text class="wl" x="441.0" y="39.0" text-anchor="middle">rec 1</text><text class="wl" x="499.0" y="39.0" text-anchor="middle">rec 1</text><text class="wt" x="4.0" y="119.0" text-anchor="start">CAN_H</text><path class="wv b" d="M64 115 L122 115 L122 115 L122 102 L180 102 L180 102 L180 115 L238 115 L296 115 L296 115 L296 102 L354 102 L412 102 L412 102 L412 115 L470 115 L528 115"/><text class="wl" x="93.0" y="97.0" text-anchor="middle">2.5 V</text><text class="wl" x="151.0" y="97.0" text-anchor="middle">3.5 V</text><text class="wl" x="209.0" y="97.0" text-anchor="middle">2.5 V</text><text class="wl" x="267.0" y="97.0" text-anchor="middle">2.5 V</text><text class="wl" x="325.0" y="97.0" text-anchor="middle">3.5 V</text><text class="wl" x="383.0" y="97.0" text-anchor="middle">3.5 V</text><text class="wl" x="441.0" y="97.0" text-anchor="middle">2.5 V</text><text class="wl" x="499.0" y="97.0" text-anchor="middle">2.5 V</text><text class="wt" x="4.0" y="177.0" text-anchor="start">CAN_L</text><path class="wv d" d="M64 173 L122 173 L122 173 L122 186 L180 186 L180 186 L180 173 L238 173 L296 173 L296 173 L296 186 L354 186 L412 186 L412 186 L412 173 L470 173 L528 173"/><text class="wl" x="93.0" y="155.0" text-anchor="middle">2.5 V</text><text class="wl" x="151.0" y="155.0" text-anchor="middle">1.5 V</text><text class="wl" x="209.0" y="155.0" text-anchor="middle">2.5 V</text><text class="wl" x="267.0" y="155.0" text-anchor="middle">2.5 V</text><text class="wl" x="325.0" y="155.0" text-anchor="middle">1.5 V</text><text class="wl" x="383.0" y="155.0" text-anchor="middle">1.5 V</text><text class="wl" x="441.0" y="155.0" text-anchor="middle">2.5 V</text><text class="wl" x="499.0" y="155.0" text-anchor="middle">2.5 V</text><text class="wt" x="4.0" y="235.0" text-anchor="start">Vdiff</text><path class="wv c" d="M64 244 L122 244 L122 244 L122 218 L180 218 L180 218 L180 244 L238 244 L296 244 L296 244 L296 218 L354 218 L412 218 L412 218 L412 244 L470 244 L528 244"/><text class="wl" x="93.0" y="213.0" text-anchor="middle">0 V</text><text class="wl" x="151.0" y="213.0" text-anchor="middle">2 V</text><text class="wl" x="209.0" y="213.0" text-anchor="middle">0 V</text><text class="wl" x="267.0" y="213.0" text-anchor="middle">0 V</text><text class="wl" x="325.0" y="213.0" text-anchor="middle">2 V</text><text class="wl" x="383.0" y="213.0" text-anchor="middle">2 V</text><text class="wl" x="441.0" y="213.0" text-anchor="middle">0 V</text><text class="wl" x="499.0" y="213.0" text-anchor="middle">0 V</text></svg></div><figcaption>Logic 1 is recessive (both lines about 2.5 V, difference 0 V). Logic 0 is dominant (CAN_H up, CAN_L down, difference about 2 V).</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 510 262" role="img" aria-label="CAN arbitration between three nodes" style="min-width:510px;max-width:510px"><rect class="wband" x="64" y="20" width="62" height="232"/><text class="wl wh" x="95.0" y="13.0" text-anchor="middle">SOF</text><rect class="wband" x="126" y="20" width="372" height="232"/><text class="wl wh" x="312.0" y="13.0" text-anchor="middle">identifier bits (MSB first)</text><line class="wg" x1="64" x2="64" y1="20" y2="250"/><line class="wg" x1="126" x2="126" y1="20" y2="250"/><line class="wg" x1="188" x2="188" y1="20" y2="250"/><line class="wg" x1="250" x2="250" y1="20" y2="250"/><line class="wg" x1="312" x2="312" y1="20" y2="250"/><line class="wg" x1="374" x2="374" y1="20" y2="250"/><line class="wg" x1="436" x2="436" y1="20" y2="250"/><line class="wg" x1="498" x2="498" y1="20" y2="250"/><text class="wt" x="4.0" y="61.0" text-anchor="start">Node A</text><path class="wv " d="M64 70 L126 70 L126 70 L126 44 L188 44 L188 44 L188 70 L250 70 L312 70 L312 70 L312 44 L374 44 L374 44 L374 70 L436 70 L436 70 L436 44 L498 44"/><text class="wl" x="95.0" y="39.0" text-anchor="middle">SOF</text><text class="wl" x="467.0" y="39.0" text-anchor="middle">wins</text><text class="wt" x="4.0" y="119.0" text-anchor="start">Node B</text><path class="wv b" d="M64 128 L126 128 L126 128 L126 102 L188 102 L188 102 L188 128 L250 128 L312 128 L312 128 L312 102 L374 102 L436 102 L498 102"/><text class="wl" x="405.0" y="97.0" text-anchor="middle">B loses</text><text class="wt" x="4.0" y="177.0" text-anchor="start">Node C</text><path class="wv c" d="M64 186 L126 186 L126 186 L126 160 L188 160 L188 160 L188 186 L250 186 L250 186 L250 160 L312 160 L374 160 L436 160 L498 160"/><text class="wl" x="281.0" y="155.0" text-anchor="middle">C loses</text><text class="wt" x="4.0" y="235.0" text-anchor="start">Bus</text><path class="wv d" d="M64 244 L126 244 L126 244 L126 218 L188 218 L188 218 L188 244 L250 244 L312 244 L312 244 L312 218 L374 218 L374 218 L374 244 L436 244 L436 244 L436 218 L498 218"/><text class="wl" x="312.0" y="213.0" text-anchor="middle">bus = A (lowest ID 100101 wins)</text></svg></div><figcaption>Three nodes start at the same time. C sends a 1 where the bus is 0 and drops out at the third ID bit; B drops out at the fifth. A, with the lowest ID, finishes its frame.</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 570 136" role="img" aria-label="CAN frame layout" style="min-width:570px;max-width:570px"><text class="wl" x="8.0" y="14.0" text-anchor="start">Classic CAN data frame (not to scale)</text><rect class="wb " x="8" y="20" width="48.8" height="44" rx="4"/><text class="wf1" x="32.4" y="41.0" text-anchor="middle">SOF</text><text class="wf2" x="32.4" y="54.0" text-anchor="middle">1</text><rect class="wb b" x="60.8" y="20" width="136.8" height="44" rx="4"/><text class="wf1" x="129.2" y="41.0" text-anchor="middle">Identifier</text><text class="wf2" x="129.2" y="54.0" text-anchor="middle">11 bits</text><rect class="wb " x="201.6" y="20" width="48.8" height="44" rx="4"/><text class="wf1" x="226.0" y="41.0" text-anchor="middle">RTR</text><text class="wf2" x="226.0" y="54.0" text-anchor="middle">1</text><rect class="wb " x="254.4" y="20" width="48.8" height="44" rx="4"/><text class="wf1" x="278.8" y="41.0" text-anchor="middle">IDE</text><text class="wf2" x="278.8" y="54.0" text-anchor="middle">1</text><rect class="wb " x="307.2" y="20" width="48.8" height="44" rx="4"/><text class="wf1" x="331.6" y="41.0" text-anchor="middle">r0</text><text class="wf2" x="331.6" y="54.0" text-anchor="middle">1</text><rect class="wb " x="360" y="20" width="75.2" height="44" rx="4"/><text class="wf1" x="397.6" y="41.0" text-anchor="middle">DLC</text><text class="wf2" x="397.6" y="54.0" text-anchor="middle">4 bits</text><rect class="wb b" x="8" y="78" width="154.4" height="44" rx="4"/><text class="wf1" x="85.2" y="99.0" text-anchor="middle">Data</text><text class="wf2" x="85.2" y="112.0" text-anchor="middle">0 to 8 bytes</text><rect class="wb " x="166.4" y="78" width="101.6" height="44" rx="4"/><text class="wf1" x="217.2" y="99.0" text-anchor="middle">CRC</text><text class="wf2" x="217.2" y="112.0" text-anchor="middle">15 bits</text><rect class="wb " x="272" y="78" width="40" height="44" rx="4"/><text class="wf1" x="292.0" y="99.0" text-anchor="middle">D</text><text class="wf2" x="292.0" y="112.0" text-anchor="middle">del</text><rect class="wb b" x="316" y="78" width="57.6" height="44" rx="4"/><text class="wf1" x="344.8" y="99.0" text-anchor="middle">ACK</text><text class="wf2" x="344.8" y="112.0" text-anchor="middle">slot</text><rect class="wb " x="377.6" y="78" width="40" height="44" rx="4"/><text class="wf1" x="397.6" y="99.0" text-anchor="middle">D</text><text class="wf2" x="397.6" y="112.0" text-anchor="middle">del</text><rect class="wb " x="421.6" y="78" width="75.2" height="44" rx="4"/><text class="wf1" x="459.2" y="99.0" text-anchor="middle">EOF</text><text class="wf2" x="459.2" y="112.0" text-anchor="middle">7 bits</text><rect class="wb g" x="500.8" y="78" width="57.6" height="44" rx="4"/><text class="wf1" x="529.6" y="99.0" text-anchor="middle">IFS</text><text class="wf2" x="529.6" y="112.0" text-anchor="middle">3</text></svg></div><figcaption>Field order of a standard data frame. The ACK slot is sent recessive and overwritten dominant by receivers.</figcaption></figure><h3>Standard and extended frames</h3><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 558 76" role="img" aria-label="CAN extended frame" style="min-width:558px;max-width:558px"><text class="wl" x="8.0" y="14.0" text-anchor="start">Extended frame (29-bit identifier), arbitration and control part</text><rect class="wb " x="8" y="20" width="46.6" height="42" rx="4"/><text class="wf1" x="31.3" y="40.0" text-anchor="middle">SOF</text><text class="wf2" x="31.3" y="53.0" text-anchor="middle">1</text><rect class="wb b" x="58.6" y="20" width="97.2" height="42" rx="4"/><text class="wf1" x="107.2" y="40.0" text-anchor="middle">ID A</text><text class="wf2" x="107.2" y="53.0" text-anchor="middle">11 bits</text><rect class="wb " x="159.8" y="20" width="46.6" height="42" rx="4"/><text class="wf1" x="183.1" y="40.0" text-anchor="middle">SRR</text><text class="wf2" x="183.1" y="53.0" text-anchor="middle">1</text><rect class="wb " x="210.4" y="20" width="60.4" height="42" rx="4"/><text class="wf1" x="240.6" y="40.0" text-anchor="middle">IDE</text><text class="wf2" x="240.6" y="53.0" text-anchor="middle">1 (ext)</text><rect class="wb b" x="274.8" y="20" width="106.4" height="42" rx="4"/><text class="wf1" x="328.0" y="40.0" text-anchor="middle">ID B</text><text class="wf2" x="328.0" y="53.0" text-anchor="middle">18 bits</text><rect class="wb " x="385.2" y="20" width="46.6" height="42" rx="4"/><text class="wf1" x="408.5" y="40.0" text-anchor="middle">RTR</text><text class="wf2" x="408.5" y="53.0" text-anchor="middle">1</text><rect class="wb " x="435.8" y="20" width="55.8" height="42" rx="4"/><text class="wf1" x="463.7" y="40.0" text-anchor="middle">r1 r0</text><text class="wf2" x="463.7" y="53.0" text-anchor="middle">2</text><rect class="wb " x="495.6" y="20" width="51.2" height="42" rx="4"/><text class="wf1" x="521.2" y="40.0" text-anchor="middle">DLC</text><text class="wf2" x="521.2" y="53.0" text-anchor="middle">4</text></svg></div><figcaption>In an extended frame the 29-bit identifier is split in two parts. The IDE bit is dominant (0) in a standard frame and recessive (1) in an extended frame, so standard frames win arbitration against extended frames with the same first 11 bits.</figcaption></figure><h3>Bit timing</h3><ul><li>One bit is divided into <strong>time quanta (tq)</strong>: Sync_Seg (1 tq) + Prop_Seg + Phase_Seg1 + Phase_Seg2. The sample point sits at the end of Phase_Seg1, usually <strong>75 to 87.5 percent</strong> of the bit.</li><li><code>bit rate = f_clk / (BRP x (1 + TS1 + TS2))</code>. Example: 48 MHz clock, BRP = 3, TS1 = 11, TS2 = 4 gives 16 tq per bit and 1 Mbit/s with a 75 percent sample point.</li><li>Resynchronisation jump width (SJW) lets a node stretch or shorten a bit by a few tq to follow clock drift.</li></ul><h3>Bus length versus speed</h3><div class="tw"><table><tr><th>Bit rate</th><th>1 Mbit/s</th><th>500 kbit/s</th><th>250 kbit/s</th><th>125 kbit/s</th><th>50 kbit/s</th></tr><tr><td>Typical max length</td><td>40 m</td><td>100 m</td><td>250 m</td><td>500 m</td><td>1000 m</td></tr></table></div><h3>Error states</h3><div class="tw"><table><tr><th>State</th><th>Condition</th><th>Behaviour</th></tr><tr><td>Error active</td><td>TEC and REC below 128</td><td>Sends active (dominant) error flags</td></tr><tr><td>Error passive</td><td>TEC or REC 128 or more</td><td>Sends passive error flags and waits an extra 8 bits after sending</td></tr><tr><td>Bus-off</td><td>TEC above 255</td><td>Node stops; returns after 128 x 11 recessive bits or a software reset</td></tr></table></div><p>The five error types are bit error, stuff error, CRC error, form error and ACK error.</p><h3>CAN FD</h3><ul><li>Adds the FDF bit and <strong>BRS</strong> (bit-rate switch): the arbitration phase stays at the normal rate, the data phase runs faster (up to 5 to 8 Mbit/s).</li><li>Payload up to 64 bytes. DLC 9 to 15 map to 12, 16, 20, 24, 32, 48, 64 bytes. CRC grows to 17 or 21 bits with stuff-bit counting.</li><li>Not compatible with classic-only nodes on the same bus.</li></ul><h3>Filtering and higher layers</h3><ul><li>Hardware acceptance filters keep only wanted IDs: a frame passes when <code>(rx_id &amp; mask) == (filter &amp; mask)</code>.</li><li><strong>OBD-II</strong> (500 kbit/s): the tester sends ID 0x7DF with <code>02 01 0C</code> (service 01, PID 0C = engine speed); the ECU replies on 0x7E8 with <code>04 41 0C A B</code>, and rpm = (256 x A + B) / 4.</li><li><strong>CANopen</strong> (industrial, node IDs and PDO/SDO), <strong>J1939</strong> (trucks, 29-bit IDs), <strong>UDS</strong> (diagnostics), <strong>ISO-TP</strong> (multi-frame transport for more than 8 bytes).</li></ul><h3>Common problems</h3><ul><li>Missing or double termination: reflections, errors at high speed.</li><li>Wrong bit-rate on one node: it floods the bus with error frames.</li><li>Using a bare MCU CAN pin without a transceiver chip (for example TJA1050 or SN65HVD230).</li></ul><p><strong>Interview:</strong> How does CAN avoid collisions? It does not avoid them; it resolves them non-destructively by bitwise arbitration, so the lowest ID wins without losing time or data.</p><h2 id="modbus">5. Modbus (RTU, ASCII, TCP)</h2><p>Modbus is a simple <strong>application-level master/slave</strong> protocol from 1979, still everywhere in PLCs, meters, drives and sensors. It defines what the bytes mean (registers and coils), and runs on a serial line (RS-485/RS-232) or on TCP.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Medium</td><td>RS-485 or RS-232 (RTU, ASCII) or Ethernet TCP port 502</td></tr><tr><td>Topology</td><td>One master (client) and up to 247 slaves (servers), addresses 1 to 247, 0 = broadcast</td></tr><tr><td>Speed</td><td>9600 to 115200 baud serial (19200 default); 10/100 Mbit/s for TCP</td></tr><tr><td>Data model</td><td>Coils (1-bit R/W), discrete inputs (1-bit R), input registers (16-bit R), holding registers (16-bit R/W)</td></tr><tr><td>Error check</td><td>RTU: CRC-16 (low byte first); ASCII: LRC; TCP: relies on TCP checksum</td></tr><tr><td>Used for</td><td>PLCs, energy meters, VFDs, building automation</td></tr></table></div><h3>How it works</h3><ul><li>Only the master starts a transaction; a slave answers only when its address matches. Typical timeout is 100 ms to 1 s.</li><li>Function codes: 01 read coils, 02 read discrete inputs, 03 read holding registers, 04 read input registers, 05 write single coil, 06 write single register, 15 (0x0F) write multiple coils, 16 (0x10) write multiple registers.</li><li><strong>Exception reply:</strong> the slave returns function code + 0x80 and one exception byte: 01 illegal function, 02 illegal address, 03 illegal value, 04 device failure.</li><li>RTU frames are separated by a silent gap of at least <strong>3.5 character times</strong> (about 2 ms at 19200 baud, fixed 1.75 ms above that). A gap of more than 1.5 character times inside a frame invalidates it.</li><li>ASCII frames start with ":" and end with CR LF, sending each byte as two hex characters. They are easier to debug but twice as long.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 656 232" role="img" aria-label="Modbus RTU request, response and TCP frame" style="min-width:656px;max-width:656px"><text class="wl" x="8.0" y="14.0" text-anchor="start">RTU request: master reads 2 holding registers from address 0 of slave 1</text><rect class="wb g" x="8" y="20" width="76" height="46" rx="4"/><text class="wf1" x="46.0" y="42.0" text-anchor="middle">t3.5</text><text class="wf2" x="46.0" y="55.0" text-anchor="middle">silent</text><rect class="wb " x="88" y="20" width="60" height="46" rx="4"/><text class="wf1" x="118.0" y="42.0" text-anchor="middle">Addr</text><text class="wf2" x="118.0" y="55.0" text-anchor="middle">01</text><rect class="wb " x="152" y="20" width="60" height="46" rx="4"/><text class="wf1" x="182.0" y="42.0" text-anchor="middle">Func</text><text class="wf2" x="182.0" y="55.0" text-anchor="middle">03</text><rect class="wb b" x="216" y="20" width="92" height="46" rx="4"/><text class="wf1" x="262.0" y="42.0" text-anchor="middle">Start</text><text class="wf2" x="262.0" y="55.0" text-anchor="middle">00 00</text><rect class="wb b" x="312" y="20" width="92" height="46" rx="4"/><text class="wf1" x="358.0" y="42.0" text-anchor="middle">Qty</text><text class="wf2" x="358.0" y="55.0" text-anchor="middle">00 02</text><rect class="wb " x="408" y="20" width="92" height="46" rx="4"/><text class="wf1" x="454.0" y="42.0" text-anchor="middle">CRC</text><text class="wf2" x="454.0" y="55.0" text-anchor="middle">C4 0B</text><rect class="wb g" x="504" y="20" width="76" height="46" rx="4"/><text class="wf1" x="542.0" y="42.0" text-anchor="middle">t3.5</text><text class="wf2" x="542.0" y="55.0" text-anchor="middle">silent</text><text class="wl" x="8.0" y="90.0" text-anchor="start">RTU response: 4 data bytes = two 16-bit registers (10 and 11)</text><rect class="wb g" x="8" y="96" width="76" height="46" rx="4"/><text class="wf1" x="46.0" y="118.0" text-anchor="middle">t3.5</text><text class="wf2" x="46.0" y="131.0" text-anchor="middle">silent</text><rect class="wb " x="88" y="96" width="60" height="46" rx="4"/><text class="wf1" x="118.0" y="118.0" text-anchor="middle">Addr</text><text class="wf2" x="118.0" y="131.0" text-anchor="middle">01</text><rect class="wb " x="152" y="96" width="60" height="46" rx="4"/><text class="wf1" x="182.0" y="118.0" text-anchor="middle">Func</text><text class="wf2" x="182.0" y="131.0" text-anchor="middle">03</text><rect class="wb " x="216" y="96" width="60" height="46" rx="4"/><text class="wf1" x="246.0" y="118.0" text-anchor="middle">Bytes</text><text class="wf2" x="246.0" y="131.0" text-anchor="middle">04</text><rect class="wb b" x="280" y="96" width="92" height="46" rx="4"/><text class="wf1" x="326.0" y="118.0" text-anchor="middle">Reg 0</text><text class="wf2" x="326.0" y="131.0" text-anchor="middle">00 0A</text><rect class="wb b" x="376" y="96" width="92" height="46" rx="4"/><text class="wf1" x="422.0" y="118.0" text-anchor="middle">Reg 1</text><text class="wf2" x="422.0" y="131.0" text-anchor="middle">00 0B</text><rect class="wb " x="472" y="96" width="92" height="46" rx="4"/><text class="wf1" x="518.0" y="118.0" text-anchor="middle">CRC</text><text class="wf2" x="518.0" y="131.0" text-anchor="middle">lo hi</text><rect class="wb g" x="568" y="96" width="76" height="46" rx="4"/><text class="wf1" x="606.0" y="118.0" text-anchor="middle">t3.5</text><text class="wf2" x="606.0" y="131.0" text-anchor="middle">silent</text><text class="wl" x="8.0" y="166.0" text-anchor="start">Modbus TCP (port 502): same PDU, MBAP header instead of address and CRC</text><rect class="wb " x="8" y="172" width="84" height="46" rx="4"/><text class="wf1" x="50.0" y="194.0" text-anchor="middle">Trans ID</text><text class="wf2" x="50.0" y="207.0" text-anchor="middle">2 B</text><rect class="wb " x="96" y="172" width="68" height="46" rx="4"/><text class="wf1" x="130.0" y="194.0" text-anchor="middle">Proto</text><text class="wf2" x="130.0" y="207.0" text-anchor="middle">0000</text><rect class="wb " x="168" y="172" width="68" height="46" rx="4"/><text class="wf1" x="202.0" y="194.0" text-anchor="middle">Length</text><text class="wf2" x="202.0" y="207.0" text-anchor="middle">2 B</text><rect class="wb " x="240" y="172" width="56" height="46" rx="4"/><text class="wf1" x="268.0" y="194.0" text-anchor="middle">Unit</text><text class="wf2" x="268.0" y="207.0" text-anchor="middle">1 B</text><rect class="wb " x="300" y="172" width="56" height="46" rx="4"/><text class="wf1" x="328.0" y="194.0" text-anchor="middle">Func</text><text class="wf2" x="328.0" y="207.0" text-anchor="middle">03</text><rect class="wb b" x="360" y="172" width="116" height="46" rx="4"/><text class="wf1" x="418.0" y="194.0" text-anchor="middle">Data</text><text class="wf2" x="418.0" y="207.0" text-anchor="middle">00 00 00 02</text></svg></div><figcaption>Example request <code>01 03 00 00 00 02 C4 0B</code>. Register values are sent <strong>big-endian</strong>; the CRC is sent low byte first.</figcaption></figure><h3>CRC-16 (RTU)</h3><p>Polynomial 0xA001 (reflected 0x8005), initial value 0xFFFF. For <code>01 03 00 00 00 02</code> the CRC is 0x0BC4, sent as <code>C4 0B</code>.</p><pre><code>uint16_t modbus_crc(const uint8_t *p, uint8_t n)
{
    uint16_t crc = 0xFFFFu;
    while (n--) {
        crc ^= *p++;
        for (int i = 0; i &lt; 8; i++)
            crc = (crc &amp; 1u) ? (uint16_t)((crc &gt;&gt; 1) ^ 0xA001u) : (uint16_t)(crc &gt;&gt; 1);
    }
    return crc;                        /* send low byte first */
}</code></pre><h3>Data model and addressing</h3><div class="tw"><table><tr><th>Table</th><th>Type</th><th>Access</th><th>Classic address</th><th>Function codes</th></tr><tr><td>Coils</td><td>1 bit</td><td>read/write</td><td>00001 to 09999</td><td>01, 05, 15</td></tr><tr><td>Discrete inputs</td><td>1 bit</td><td>read only</td><td>10001 to 19999</td><td>02</td></tr><tr><td>Input registers</td><td>16 bit</td><td>read only</td><td>30001 to 39999</td><td>04</td></tr><tr><td>Holding registers</td><td>16 bit</td><td>read/write</td><td>40001 to 49999</td><td>03, 06, 16</td></tr></table></div><p>On the wire the first register is 0, so "holding register 40001" is sent as address 0000. Check whether your device manual is 0-based or 1-based.</p><h3>More examples</h3><ul><li><strong>Write single register:</strong> <code>01 06 00 01 00 03 + CRC</code> sets register 1 to 3; the slave echoes the same frame.</li><li><strong>Exception:</strong> request <code>01 03 FF FF 00 01 + CRC</code> to a bad address returns <code>01 83 02 + CRC</code> (function 0x03 + 0x80, code 02 illegal data address).</li><li><strong>Limits:</strong> the PDU is at most 253 bytes, so a read returns at most 125 registers and a write at most 123 registers; the whole RTU frame is at most 256 bytes.</li><li><strong>Types:</strong> a 32-bit value or float occupies two registers; the word order differs between vendors (big-endian, little-endian, word-swapped).</li></ul><h3>Wiring and timing</h3><ul><li>RS-485 two-wire: A/B (D-/D+) plus common; 120 Ohm termination at both ends; bias resistors hold the idle state high.</li><li>The master waits for a response timeout (for example 200 ms). Broadcast (address 0) has no reply, so wait a turnaround delay before the next request.</li><li>ASCII mode: <code>:</code> + hex pairs + LRC + CR LF, timing is relaxed. TCP mode: Transaction ID lets a client match replies when several requests are in flight.</li></ul><h3>Common problems</h3><ul><li>Wrong parity or stop bits (RTU default is 8E1).</li><li>Off-by-one register addressing: documents say 40001, the wire says 0.</li><li>RS-485 without termination or bias resistors; missing direction (DE/RE) control.</li></ul><p><strong>Interview:</strong> Modbus RTU vs TCP? RTU is binary over a serial line with CRC and 3.5-character gaps; TCP drops the CRC and slave address, adds a 7-byte MBAP header and uses port 502.</p><h2 id="lin">6. LIN (Local Interconnect Network)</h2><p>LIN is a <strong>cheap single-wire</strong> bus for car body electronics (door locks, mirrors, seats, wipers, rain sensors). It sits below CAN: slow, simple, no crystal needed in the slaves.</p><div class="tw"><table><tr><th>Item</th><th>Detail</th></tr><tr><td>Wires</td><td>One data line (12 V level), supply, ground</td></tr><tr><td>Topology</td><td>1 master + up to 16 slaves, no collisions (master schedule)</td></tr><tr><td>Speed</td><td>up to 20 kbit/s (9600 and 19200 common), range about 40 m</td></tr><tr><td>Frame</td><td>Break, sync 0x55, protected ID, 1 to 8 data bytes, checksum</td></tr><tr><td>Bytes</td><td>Each is UART 8N1, LSB first</td></tr><tr><td>Used for</td><td>Door modules, seat motors, climate flaps, rain/light sensors</td></tr></table></div><h3>How it works</h3><ul><li>The master follows a <strong>schedule table</strong>: it sends a header for each frame ID in turn; the slave that owns that ID sends the response. This is why LIN has no arbitration.</li><li>The long dominant <strong>break</strong> (13 bits or more) cannot be a normal UART byte, so it marks a new frame. The <strong>sync byte 0x55</strong> (alternating bits) lets slaves without a crystal measure and adjust their baud rate.</li><li><strong>Protected ID:</strong> 6-bit ID + 2 parity bits. P0 = ID0 xor ID1 xor ID2 xor ID4; P1 = not (ID1 xor ID3 xor ID4 xor ID5). ID 0x10 becomes PID 0x50.</li><li>IDs 0 to 59 are signal frames; 60 and 61 carry diagnostics; 62 and 63 are reserved. Checksum is "classic" (data only, LIN 1.x) or "enhanced" (PID + data, LIN 2.x).</li><li>Bus idle = recessive (high, near battery voltage); dominant = low, near ground.</li></ul><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 654 94" role="img" aria-label="LIN header waveform" style="min-width:654px;max-width:654px"><rect class="wband" x="64" y="20" width="578" height="64"/><text class="wl wh" x="353.0" y="13.0" text-anchor="middle">header sent by the master</text><text class="wt" x="4.0" y="61.0" text-anchor="start">LIN</text><path class="wv " d="M64 70 L81 70 L98 70 L115 70 L132 70 L149 70 L166 70 L183 70 L200 70 L217 70 L234 70 L251 70 L268 70 L285 70 L285 70 L285 44 L302 44 L302 44 L302 70 L319 70 L319 70 L319 44 L336 44 L336 44 L336 70 L353 70 L353 70 L353 44 L370 44 L370 44 L370 70 L387 70 L387 70 L387 44 L404 44 L404 44 L404 70 L421 70 L421 70 L421 44 L438 44 L438 44 L438 70 L455 70 L455 70 L455 44 L472 44 L472 44 L472 70 L489 70 L506 70 L523 70 L540 70 L557 70 L557 70 L557 44 L574 44 L574 44 L574 70 L591 70 L591 70 L591 44 L608 44 L608 44 L608 70 L625 70 L625 70 L625 44 L642 44"/><text class="wl" x="174.5" y="39.0" text-anchor="middle">Break: 13+ bit times low</text><text class="wl" x="293.5" y="39.0" text-anchor="middle">d</text><text class="wl" x="387.0" y="39.0" text-anchor="middle">Sync 0x55</text><text class="wl" x="557.0" y="39.0" text-anchor="middle">PID 0x50</text></svg></div><figcaption>The header for frame ID 0x10: break, delimiter, sync 0x55 and PID 0x50 (bits LSB first, each byte has a start and a stop bit).</figcaption></figure><figure class="dg wf"><div class="dgs"><svg viewBox="0 0 464 80" role="img" aria-label="LIN frame layout" style="min-width:464px;max-width:464px"><text class="wl" x="8.0" y="14.0" text-anchor="start">Frame = header (master) + response (one slave, or the master)</text><rect class="wb g" x="8" y="20" width="75.2" height="46" rx="4"/><text class="wf1" x="45.6" y="42.0" text-anchor="middle">Break</text><text class="wf2" x="45.6" y="55.0" text-anchor="middle">13+ bits</text><rect class="wb " x="87.2" y="20" width="57.6" height="46" rx="4"/><text class="wf1" x="116.0" y="42.0" text-anchor="middle">Sync</text><text class="wf2" x="116.0" y="55.0" text-anchor="middle">0x55</text><rect class="wb " x="148.8" y="20" width="75.2" height="46" rx="4"/><text class="wf1" x="186.4" y="42.0" text-anchor="middle">PID</text><text class="wf2" x="186.4" y="55.0" text-anchor="middle">ID + parity</text><rect class="wb b" x="228" y="20" width="136.8" height="46" rx="4"/><text class="wf1" x="296.4" y="42.0" text-anchor="middle">Data 1 to 8</text><text class="wf2" x="296.4" y="55.0" text-anchor="middle">1 to 8 bytes</text><rect class="wb " x="368.8" y="20" width="84" height="46" rx="4"/><text class="wf1" x="410.8" y="42.0" text-anchor="middle">Checksum</text><text class="wf2" x="410.8" y="55.0" text-anchor="middle">1 byte</text></svg></div><figcaption>A slave answers with up to 8 data bytes; the checksum protects them.</figcaption></figure><h3>Checksum example</h3><p>Classic checksum = inverted 8-bit sum of the data bytes with the carry added back. For data <code>4A 55 93 E5</code>: 4A + 55 = 9F; + 93 = 132, so 32 + carry 1 = 33; + E5 = 118, so 18 + 1 = 19; inverted = <strong>E6</strong>. The enhanced checksum includes the PID in the sum.</p><h3>Frame types</h3><div class="tw"><table><tr><th>Type</th><th>Purpose</th></tr><tr><td>Unconditional</td><td>Normal frame sent in its schedule slot</td></tr><tr><td>Event-triggered</td><td>Several slaves share one ID; the one with new data answers (collisions are resolved by the master)</td></tr><tr><td>Sporadic</td><td>Sent only when the master has updated data</td></tr><tr><td>Diagnostic</td><td>ID 60 (0x3C master request) and 61 (0x3D slave response)</td></tr><tr><td>Reserved</td><td>IDs 62 and 63</td></tr></table></div><h3>Frame timing</h3><ul><li>Nominal header = 34 bit times; nominal response = 10 x (data bytes + 1) bit times. Allowed total = 1.4 x nominal.</li><li>At 19200 baud one bit is 52.08 us. A frame with 8 data bytes is
